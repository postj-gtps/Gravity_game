<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics - Space Trains & Alien Trails</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
            flex-wrap: wrap;
            gap: 8px;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .controls-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
            border-radius: 4px;
            min-height: 38px; /* Chromebook touch friendly */
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .btn-portal-blue {
            border-color: #00f0ff;
            color: #00f0ff;
        }
        .btn-portal-blue.active, .btn-portal-blue:hover {
            background: #00f0ff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 2px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .instructions-bar {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            font-size: 12px;
            color: #aaaaaa;
        }

        #spam-status {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .status-ready {
            color: #00ff66;
        }

        .status-cooldown {
            color: #ff3366;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity & Space Trains 🚂</h1>
        
        <div class="controls-group">
            <button id="mode-ball-btn" class="btn active" onclick="setMode('ball')">🚂 Launch Space Train</button>
            <button id="mode-portal-btn" class="btn btn-portal-blue" onclick="setMode('portal')">🌀 Place Portals</button>
            <button class="btn" onclick="clearPortals()">Clear Portals</button>
            <button class="btn" onclick="resetSimulation()">Reset All</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- Instructions, Space Train Counter & Cooldown Indicator -->
    <div class="instructions-bar">
        <span id="instruction-text">Mode: Launch Space Train — Click/Tap canvas to spawn a train.</span>
        <div>Trains: <span id="ball-count">0</span>/30 | Spam Filter: <span id="spam-status" class="status-ready">READY</span></div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 120;          // Historic trail points stored for alien emojis
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const SPAM_COOLDOWN_MS = 1000;    // 1-second delay between launches
        const MAX_BALLS = 30;              // Maximum onscreen train cap

        // STATE VARIABLES
        let currentMode = 'ball';          // 'ball' (space train) or 'portal'
        let lastLaunchTime = 0;           // Timestamp for spam-click filter
        let balls = [];                    // Space train array
        let portals = [];                 // Array holding up to 2 portal objects
        let asteroids = [];               // Floating asteroids that clone trains
        let triangles = [];               // Floating triangles that reflect trains
        let explosions = [];              // Explosion animation particles
        let portalPulseAngle = 0;         // For portal visual animation

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 14
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initSpaceObjects() {
            asteroids = [];
            triangles = [];
            explosions = [];

            // Spawn floating Asteroids
            for (let i = 0; i < 3; i++) {
                const radius = 25 + Math.random() * 15;
                const numPoints = 8;
                const points = [];
                for (let j = 0; j < numPoints; j++) {
                    const angle = (j / numPoints) * Math.PI * 2;
                    const rOffset = radius * (0.8 + Math.random() * 0.4);
                    points.push({ angle, rOffset });
                }
                asteroids.push({
                    x: Math.random() * (canvas.width - 120) + 60,
                    y: Math.random() * (canvas.height - 120) + 60,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: radius,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02,
                    points: points
                });
            }

            // Spawn floating Triangles
            for (let i = 0; i < 3; i++) {
                const radius = 20 + Math.random() * 10;
                triangles.push({
                    x: Math.random() * (canvas.width - 120) + 60,
                    y: Math.random() * (canvas.height - 120) + 60,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: (Math.random() - 0.5) * 2.5,
                    radius: radius,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.03
                });
            }
        }

        initSpaceObjects();

        function setMode(mode) {
            currentMode = mode;
            const ballBtn = document.getElementById('mode-ball-btn');
            const portalBtn = document.getElementById('mode-portal-btn');
            const instrText = document.getElementById('instruction-text');

            if (mode === 'ball') {
                ballBtn.classList.add('active');
                portalBtn.classList.remove('active');
                instrText.textContent = "Mode: Launch Space Train — Click/Tap canvas to spawn a train (1s cooldown).";
            } else {
                portalBtn.classList.add('active');
                ballBtn.classList.remove('active');
                instrText.textContent = "Mode: Place Portals — Click canvas to set Portal 1 (Blue) and Portal 2 (Orange).";
            }
        }

        // Pointer/Click Event handling for Chromebook Touch + Mouse
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (currentMode === 'ball') {
                attemptLaunchBall(clickX, clickY);
            } else if (currentMode === 'portal') {
                placePortal(clickX, clickY);
            }
        });

        function attemptLaunchBall(x, y) {
            const now = Date.now();
            const timeElapsed = now - lastLaunchTime;

            // Spam-Click Filter Check
            if (timeElapsed < SPAM_COOLDOWN_MS) {
                flashSpamWarning();
                return;
            }

            // Enforce maximum 30 space trains limit
            if (balls.length >= MAX_BALLS) {
                return;
            }

            lastLaunchTime = now;
            updateSpamUI();

            // Launch direction calculation
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);  
            const vy = -LAUNCH_VELOCITY * Math.cos(rad); 

            // Spawn new space train into state array
            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 12,
                teleportCooldown: 0,      // Cooldown timer to prevent infinite teleport loop
                trail: []
            });
        }

        function placePortal(x, y) {
            const portalColors = [
                { border: '#00f0ff', core: '#0088cc', label: '1' }, // Portal 1 (Cyan/Blue)
                { border: '#ff6600', core: '#ff3300', label: '2' }  // Portal 2 (Orange)
            ];

            if (portals.length < 2) {
                const colorScheme = portalColors[portals.length];
                portals.push({
                    x: x,
                    y: y,
                    radius: 22,
                    ...colorScheme
                });
            } else {
                portals.shift();
                portals[0].border = portalColors[0].border;
                portals[0].core = portalColors[0].core;
                portals[0].label = '1';

                portals.push({
                    x: x,
                    y: y,
                    radius: 22,
                    border: portalColors[1].border,
                    core: portalColors[1].core,
                    label: '2'
                });
            }
        }

        function clearPortals() {
            portals = [];
        }

        function resetSimulation() {
            balls = [];
            portals = [];
            explosions = [];
            initSpaceObjects();
        }

        function flashSpamWarning() {
            const statusElem = document.getElementById('spam-status');
            statusElem.textContent = 'WAIT 1s!';
            statusElem.className = 'status-cooldown';
        }

        function updateSpamUI() {
            const statusElem = document.getElementById('spam-status');
            statusElem.textContent = 'COOLDOWN...';
            statusElem.className = 'status-cooldown';

            setTimeout(() => {
                statusElem.textContent = 'READY';
                statusElem.className = 'status-ready';
            }, SPAM_COOLDOWN_MS);
        }

        function triggerExplosion(x, y) {
            explosions.push({
                x: x,
                y: y,
                size: 24,
                alpha: 1.0
            });
        }

        function updatePhysics() {
            // Update Floating Asteroid Positions
            for (const ast of asteroids) {
                ast.x += ast.vx;
                ast.y += ast.vy;
                ast.angle += ast.rotSpeed;

                if (ast.x < -ast.radius) ast.x = canvas.width + ast.radius;
                if (ast.x > canvas.width + ast.radius) ast.x = -ast.radius;
                if (ast.y < -ast.radius) ast.y = canvas.height + ast.radius;
                if (ast.y > canvas.height + ast.radius) ast.y = -ast.radius;
            }

            // Update Floating Triangle Positions
            for (const tri of triangles) {
                tri.x += tri.vx;
                tri.y += tri.vy;
                tri.angle += tri.rotSpeed;

                if (tri.x < -tri.radius) tri.x = canvas.width + tri.radius;
                if (tri.x > canvas.width + tri.radius) tri.x = -tri.radius;
                if (tri.y < -tri.radius) tri.y = canvas.height + tri.radius;
                if (tri.y > canvas.height + tri.radius) tri.y = -tri.radius;
            }

            // Update Explosions
            for (let eIdx = explosions.length - 1; eIdx >= 0; eIdx--) {
                const exp = explosions[eIdx];
                exp.alpha -= 0.03;
                exp.size += 1.2;
                if (exp.alpha <= 0) {
                    explosions.splice(eIdx, 1);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                if (b.teleportCooldown > 0) {
                    b.teleportCooldown--;
                }

                // 1. Central Gravity Node Calculation
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: train hits central mass
                if (dist < centralNode.radius + b.radius) {
                    triggerExplosion(b.x, b.y);
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // 2. Wall Collision Explosion Logic (Space Train explodes on wall hit)
                if (b.x - b.radius <= 0 || b.x + b.radius >= canvas.width || 
                    b.y - b.radius <= 0 || b.y + b.radius >= canvas.height) {
                    triggerExplosion(b.x, b.y);
                    balls.splice(i, 1);
                    continue;
                }

                // 3. Asteroid Collision & Space Train Spawning Logic
                for (const ast of asteroids) {
                    const adx = b.x - ast.x;
                    const ady = b.y - ast.y;
                    const adist = Math.hypot(adx, ady);
                    const minDist = b.radius + ast.radius;

                    if (adist < minDist && adist > 0) {
                        const nx = adx / adist;
                        const ny = ady / adist;

                        b.x = ast.x + nx * (minDist + 1);
                        b.y = ast.y + ny * (minDist + 1);

                        const dot = b.vx * nx + b.vy * ny;
                        if (dot < 0) {
                            b.vx -= 2 * dot * nx;
                            b.vy -= 2 * dot * ny;
                        }

                        // Clone space train if under limit
                        if (balls.length < MAX_BALLS) {
                            const angleOffset = Math.PI / 4;
                            const cos = Math.cos(angleOffset);
                            const sin = Math.sin(angleOffset);
                            const spawnVx = b.vx * cos - b.vy * sin;
                            const spawnVy = b.vx * sin + b.vy * cos;

                            balls.push({
                                x: b.x + nx * (b.radius * 2 + 2),
                                y: b.y + ny * (b.radius * 2 + 2),
                                vx: spawnVx,
                                vy: spawnVy,
                                radius: b.radius,
                                teleportCooldown: 10,
                                trail: []
                            });
                        }
                        break;
                    }
                }

                // 4. Triangle Collision Logic (Bounce only)
                for (const tri of triangles) {
                    const tdx = b.x - tri.x;
                    const tdy = b.y - tri.y;
                    const tdist = Math.hypot(tdx, tdy);
                    const minDist = b.radius + tri.radius;

                    if (tdist < minDist && tdist > 0) {
                        const nx = tdx / tdist;
                        const ny = tdy / tdist;

                        b.x = tri.x + nx * (minDist + 1);
                        b.y = tri.y + ny * (minDist + 1);

                        const dot = b.vx * nx + b.vy * ny;
                        if (dot < 0) {
                            b.vx -= 2 * dot * nx;
                            b.vy -= 2 * dot * ny;
                        }
                        break;
                    }
                }

                // 5. Portal Teleportation Logic
                if (portals.length === 2 && b.teleportCooldown === 0) {
                    for (let pIdx = 0; pIdx < 2; pIdx++) {
                        const inPortal = portals[pIdx];
                        const outPortal = portals[1 - pIdx];

                        const pdx = inPortal.x - b.x;
                        const pdy = inPortal.y - b.y;
                        const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

                        if (pDist < inPortal.radius + b.radius) {
                            const exitAngle = Math.atan2(b.vy, b.vx);
                            b.x = outPortal.x + Math.cos(exitAngle) * (outPortal.radius + b.radius + 4);
                            b.y = outPortal.y + Math.sin(exitAngle) * (outPortal.radius + b.radius + 4);

                            b.teleportCooldown = 20;
                            b.trail = [];
                            break;
                        }
                    }
                }

                // Record position history for Alien trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Update UI train counter
            const ballCountElem = document.getElementById('ball-count');
            if (ballCountElem) ballCountElem.textContent = balls.length;

            portalPulseAngle += 0.05;
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Floating Asteroids
            for (const ast of asteroids) {
                ctx.save();
                ctx.translate(ast.x, ast.y);
                ctx.rotate(ast.angle);

                ctx.beginPath();
                for (let p = 0; p < ast.points.length; p++) {
                    const pt = ast.points[p];
                    const px = Math.cos(pt.angle) * pt.rOffset;
                    const py = Math.sin(pt.angle) * pt.rOffset;
                    if (p === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                ctx.fillStyle = '#2a2a35';
                ctx.fill();
                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            // 3. Draw Floating Triangles
            for (const tri of triangles) {
                ctx.save();
                ctx.translate(tri.x, tri.y);
                ctx.rotate(tri.angle);

                ctx.beginPath();
                for (let p = 0; p < 3; p++) {
                    const angle = (p * 2 * Math.PI) / 3;
                    const px = Math.cos(angle) * tri.radius;
                    const py = Math.sin(angle) * tri.radius;
                    if (p === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                ctx.fillStyle = '#ff007f';
                ctx.globalAlpha = 0.8;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            // 4. Draw Portals
            for (const p of portals) {
                const pulseRadius = p.radius + Math.sin(portalPulseAngle) * 3;

                ctx.beginPath();
                ctx.arc(p.x, p.y, pulseRadius, 0, Math.PI * 2);
                ctx.strokeStyle = p.border;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = p.core;
                ctx.globalAlpha = 0.4;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.label, p.x, p.y);
            }

            // 5. Draw Space Trains & Alien Trails
            for (const b of balls) {
                // Render Alien Emoji Trail (spaced out evenly along the path)
                for (let t = 0; t < b.trail.length; t += 10) {
                    const pt = b.trail[t];
                    const alpha = (t + 1) / b.trail.length;
                    ctx.save();
                    ctx.globalAlpha = alpha * 0.85;
                    ctx.font = '16px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👽', pt.x, pt.y);
                    ctx.restore();
                }

                // Render Space Train Emoji rotated in travel direction
                ctx.save();
                ctx.translate(b.x, b.y);
                const angle = Math.atan2(b.vy, b.vx);
                ctx.rotate(angle);

                ctx.font = '26px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚂', 0, 0);

                ctx.restore();
            }

            // 6. Draw Explosion Visual Effects
            for (const exp of explosions) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, exp.alpha);
                ctx.font = `${exp.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💥', exp.x, exp.y);
                ctx.restore();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
