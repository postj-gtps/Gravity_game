<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics - Fireball Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #05020a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ff5500;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 8px rgba(255, 120, 0, 0.6);
        }

        .btn-reset {
            background: transparent;
            color: #ffaa00;
            border: 1px solid #ffaa00;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffaa00;
            color: #000000;
            box-shadow: 0 0 10px #ffaa00;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ff5500;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents touch screen scrolling on Chromebooks */
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #aaaaaa;
            text-align: center;
        }

        .cooldown-text {
            color: #ff4400;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation 🔥</h1>
        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click or tap to launch a fireball! <span class="cooldown-text">(1 second launch limit)</span>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed velocity on click
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 70;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const COOLDOWN_TIME_MS = 1000;     // Baseline requirement: 1x per second spam limit

        // STATE VARIABLES
        let balls = [];
        let particles = [];
        let lastLaunchTime = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 14
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pointer event handles both touchscreen taps and mouse clicks
        canvas.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            
            // Spam-click filter: allow launch at most once per second (1000ms)
            if (now - lastLaunchTime < COOLDOWN_TIME_MS) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchBall(clickX, clickY);
            lastLaunchTime = now;
        });

        function launchBall(x, y) {
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = LAUNCH_VELOCITY * Math.sin(rad);
            const vy = -LAUNCH_VELOCITY * Math.cos(rad);

            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 7,
                trail: []
            }];
        }

        function resetSimulation() {
            balls = [];
            particles = [];
        }

        function spawnFireParticle(x, y, vx, vy) {
            particles.push({
                x: x + (Math.random() - 0.5) * 6,
                y: y + (Math.random() - 0.5) * 6,
                vx: -vx * 0.2 + (Math.random() - 0.5) * 1.5,
                vy: -vy * 0.2 + (Math.random() - 0.5) * 1.5,
                size: Math.random() * 5 + 3,
                life: 1.0,
                decay: Math.random() * 0.04 + 0.03
            });
        }

        function updatePhysics() {
            // Update Ball Physics
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                if (dist < centralNode.radius + b.radius) {
                    // Collision explosion effect
                    for (let p = 0; p < 25; p++) {
                        spawnFireParticle(b.x, b.y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
                    }
                    balls.splice(i, 1);
                    continue;
                }

                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }

                // Spawn tail flame particles
                spawnFireParticle(b.x, b.y, b.vx, b.vy);
            }

            // Update Fire/Spark Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.size *= 0.95;
                p.life -= p.decay;

                if (p.life <= 0 || p.size < 0.5) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Dark glowing space background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Central Gravity Node (Star / Void Core)
            const nodeGlow = ctx.createRadialGradient(
                centralNode.x, centralNode.y, 2,
                centralNode.x, centralNode.y, centralNode.radius * 2.5
            );
            nodeGlow.addColorStop(0, '#ffffff');
            nodeGlow.addColorStop(0.3, '#ffaa00');
            nodeGlow.addColorStop(0.7, '#ff2200');
            nodeGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = nodeGlow;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // 2. Draw Fire Trail Segments
            for (const b of balls) {
                const trailLen = b.trail.length;
                for (let t = 1; t < trailLen; t++) {
                    const p1 = b.trail[t - 1];
                    const p2 = b.trail[t];
                    const ratio = t / trailLen; // 0 at tail end, 1 at ball head

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);

                    // Dynamic fiery trail styling
                    ctx.lineWidth = ratio * (b.radius * 2);
                    
                    if (ratio < 0.3) {
                        ctx.strokeStyle = `rgba(100, 0, 0, ${ratio * 2})`;
                    } else if (ratio < 0.6) {
                        ctx.strokeStyle = `rgba(255, 60, 0, ${ratio})`;
                    } else if (ratio < 0.85) {
                        ctx.strokeStyle = `rgba(255, 170, 0, ${ratio})`;
                    } else {
                        ctx.strokeStyle = `rgba(255, 255, 200, ${ratio})`;
                    }
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // 3. Draw Fireball Head
                const ballGlow = ctx.createRadialGradient(
                    b.x, b.y, 1,
                    b.x, b.y, b.radius * 2.2
                );
                ballGlow.addColorStop(0, '#ffffff');
                ballGlow.addColorStop(0.3, '#ffff55');
                ballGlow.addColorStop(0.6, '#ff6600');
                ballGlow.addColorStop(0.9, '#cc0000');
                ballGlow.addColorStop(1, 'rgba(200, 0, 0, 0)');

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = ballGlow;
                ctx.fill();
            }

            // 4. Draw Ember Sparks & Flame Particles
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

                if (p.life > 0.6) {
                    ctx.fillStyle = `rgba(255, 255, 180, ${p.life})`;
                } else if (p.life > 0.3) {
                    ctx.fillStyle = `rgba(255, 120, 0, ${p.life})`;
                } else {
                    ctx.fillStyle = `rgba(180, 20, 0, ${p.life})`;
                }
                ctx.fill();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
