<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics - Rocket Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #05020a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ff5500;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 8px rgba(255, 120, 0, 0.6);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #ffaa00;
            font-weight: bold;
        }

        .slider-group input[type=range] {
            cursor: pointer;
            accent-color: #ffaa00;
        }

        .btn-reset {
            background: transparent;
            color: #ffaa00;
            border: 1px solid #ffaa00;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffaa00;
            color: #000000;
            box-shadow: 0 0 10px #ffaa00;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ff5500;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents touch screen scrolling on Chromebooks */
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #aaaaaa;
            text-align: center;
        }

        .cooldown-text {
            color: #ff4400;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation 🚀</h1>
        
        <div class="controls">
            <div class="slider-group">
                <label for="rocketSlider">Rockets: <span id="sliderValue">5</span></label>
                <input type="range" id="rocketSlider" min="1" max="30" value="5" oninput="document.getElementById('sliderValue').innerText = this.value">
            </div>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click or tap to launch rockets! <span class="cooldown-text">(1 second launch limit)</span>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const LAUNCH_VELOCITY = 5;         // Fixed launch speed
        const TRAIL_LENGTH = 40;           // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const COOLDOWN_TIME_MS = 1000;     // Baseline requirement: 1x per second spam limit

        // STATE VARIABLES
        let rockets = [];
        let particles = [];
        let lastLaunchTime = 0;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 14
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Generates bright random HSL colors for rockets
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 100%, 60%)`;
        }

        // Pointer event handles both touchscreen taps and mouse clicks
        canvas.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            
            // Spam-click filter: allow launch at most once per second (1000ms)
            if (now - lastLaunchTime < COOLDOWN_TIME_MS) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const count = parseInt(document.getElementById('rocketSlider').value, 10);
            launchRockets(clickX, clickY, count);
            lastLaunchTime = now;
        });

        function launchRockets(x, y, count) {
            const angleStep = (Math.PI * 2) / count;

            for (let i = 0; i < count; i++) {
                const angle = i * angleStep;
                const vx = LAUNCH_VELOCITY * Math.cos(angle);
                const vy = LAUNCH_VELOCITY * Math.sin(angle);

                rockets.push({
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    radius: 8,
                    color: getRandomColor(),
                    trail: []
                });
            }
        }

        function resetSimulation() {
            rockets = [];
            particles = [];
        }

        function spawnExhaustParticle(x, y, vx, vy, color) {
            particles.push({
                x: x + (Math.random() - 0.5) * 4,
                y: y + (Math.random() - 0.5) * 4,
                vx: -vx * 0.2 + (Math.random() - 0.5) * 1.5,
                vy: -vy * 0.2 + (Math.random() - 0.5) * 1.5,
                size: Math.random() * 4 + 2,
                life: 1.0,
                decay: Math.random() * 0.04 + 0.03,
                color: color
            });
        }

        function updatePhysics() {
            // Update Rocket Physics
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];

                const margin = 500;
                if (r.x < -margin || r.x > canvas.width + margin || 
                    r.y < -margin || r.y > canvas.height + margin) {
                    rockets.splice(i, 1);
                    continue;
                }

                const dx = centralNode.x - r.x;
                const dy = centralNode.y - r.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                if (dist < centralNode.radius + r.radius) {
                    // Collision explosion effect
                    for (let p = 0; p < 20; p++) {
                        spawnExhaustParticle(r.x, r.y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, r.color);
                    }
                    rockets.splice(i, 1);
                    continue;
                }

                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                r.vx += ax;
                r.vy += ay;
                r.x += r.vx;
                r.y += r.vy;

                // Record position history for trail
                r.trail.push({ x: r.x, y: r.y });
                if (r.trail.length > TRAIL_LENGTH) {
                    r.trail.shift();
                }

                // Spawn exhaust trail particles
                spawnExhaustParticle(r.x, r.y, r.vx, r.vy, r.color);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.size *= 0.95;
                p.life -= p.decay;

                if (p.life <= 0 || p.size < 0.5) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Dark space background with subtle motion blur
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Central Gravity Node (Star Core)
            const nodeGlow = ctx.createRadialGradient(
                centralNode.x, centralNode.y, 2,
                centralNode.x, centralNode.y, centralNode.radius * 2.5
            );
            nodeGlow.addColorStop(0, '#ffffff');
            nodeGlow.addColorStop(0.3, '#ffaa00');
            nodeGlow.addColorStop(0.7, '#ff2200');
            nodeGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = nodeGlow;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // 2. Draw Color-Matched Trails
            for (const r of rockets) {
                const trailLen = r.trail.length;
                for (let t = 1; t < trailLen; t++) {
                    const p1 = r.trail[t - 1];
                    const p2 = r.trail[t];
                    const ratio = t / trailLen;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineWidth = ratio * 3.5;
                    ctx.strokeStyle = r.color;
                    ctx.globalAlpha = ratio * 0.6;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            }

            // 3. Draw Rocket Vectors
            for (const r of rockets) {
                const angle = Math.atan2(r.vy, r.vx);

                ctx.save();
                ctx.translate(r.x, r.y);
                ctx.rotate(angle);

                // Main Rocket Body
                ctx.fillStyle = r.color;
                ctx.fillRect(-10, -4, 14, 8);

                // Nose Cone
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(4, -4);
                ctx.lineTo(12, 0);
                ctx.lineTo(4, 4);
                ctx.closePath();
                ctx.fill();

                // Side Fins
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.moveTo(-10, -4);
                ctx.lineTo(-14, -7);
                ctx.lineTo(-6, -4);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-10, 4);
                ctx.lineTo(-14, 7);
                ctx.lineTo(-6, 4);
                ctx.closePath();
                ctx.fill();

                // Cockpit Window
                ctx.fillStyle = '#111122';
                ctx.beginPath();
                ctx.arc(-1, 0, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Rocket Tail Flame
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-10, -2);
                ctx.lineTo(-15 - Math.random() * 5, 0);
                ctx.lineTo(-10, 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // 4. Draw Exhaust Particles
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
