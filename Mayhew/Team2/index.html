<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn.active {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents touchscreen scrolling gesture conflicts on Chromebooks */
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <button id="bouncyBtn" class="btn" onclick="toggleBouncyWalls()">Bouncy Walls: OFF</button>
            <button class="btn" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click & drag to pull back like a slingshot to launch a ball (1s cooldown between launches).
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const SPAM_COOLDOWN_MS = 1000;    // 1-second spam-click limit between launches
        const MAX_DRAG_DIST = 200;        // Maximum pull-back distance for slingshot
        const SPEED_SCALE = 0.12;         // Slingshot pull distance to velocity multiplier
        const MAX_LAUNCH_SPEED = 22;      // Cap on launch velocity

        // STATE VARIABLES
        let balls = [];
        let bouncyWalls = false;
        let lastLaunchTime = 0;

        // Slingshot drag state
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let cooldownMessage = '';
        let cooldownTimeout = null;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleBouncyWalls() {
            bouncyWalls = !bouncyWalls;
            const btn = document.getElementById('bouncyBtn');
            btn.textContent = `Bouncy Walls: ${bouncyWalls ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active', bouncyWalls);
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // Pointer event listeners (supports mouse, trackpad, and Chromebook touchscreens)
        canvas.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            if (now - lastLaunchTime < SPAM_COOLDOWN_MS) {
                showCooldownNotice();
                return;
            }

            const pos = getCanvasCoords(e);
            isDragging = true;
            dragStart = { x: pos.x, y: pos.y };
            dragCurrent = { x: pos.x, y: pos.y };

            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const pos = getCanvasCoords(e);
            dragCurrent = { x: pos.x, y: pos.y };
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            try {
                canvas.releasePointerCapture(e.pointerId);
            } catch (err) {}

            const now = Date.now();
            if (now - lastLaunchTime < SPAM_COOLDOWN_MS) return;

            // Calculate pullback vector (Slingshot logic)
            let pullX = dragStart.x - dragCurrent.x;
            let pullY = dragStart.y - dragCurrent.y;
            let dist = Math.hypot(pullX, pullY);

            // Cap drag length
            if (dist > MAX_DRAG_DIST) {
                pullX = (pullX / dist) * MAX_DRAG_DIST;
                pullY = (pullY / dist) * MAX_DRAG_DIST;
                dist = MAX_DRAG_DIST;
            }

            // Quick single click default launch speed
            let vx = pullX * SPEED_SCALE;
            let vy = pullY * SPEED_SCALE;
            if (dist < 5) {
                vx = 5;
                vy = 0;
            }

            // Cap launch velocity
            const speed = Math.hypot(vx, vy);
            if (speed > MAX_LAUNCH_SPEED) {
                vx = (vx / speed) * MAX_LAUNCH_SPEED;
                vy = (vy / speed) * MAX_LAUNCH_SPEED;
            }

            launchBall(dragStart.x, dragStart.y, vx, vy);
            lastLaunchTime = Date.now();
        });

        canvas.addEventListener('pointercancel', () => {
            isDragging = false;
        });

        function showCooldownNotice() {
            cooldownMessage = 'PLEASE WAIT 1 SECOND BETWEEN LAUNCHES';
            if (cooldownTimeout) clearTimeout(cooldownTimeout);
            cooldownTimeout = setTimeout(() => {
                cooldownMessage = '';
            }, 1000);
        }

        function launchBall(x, y, vx, vy) {
            // Overwrite existing array to maintain a single ball on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                trail: [] // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
        }

        function updatePhysics() {
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                if (bouncyWalls) {
                    const RESTITUTION = 0.9; // Bouncy wall velocity retention factor
                    if (b.x - b.radius < 0) {
                        b.x = b.radius;
                        b.vx = -b.vx * RESTITUTION;
                    } else if (b.x + b.radius > canvas.width) {
                        b.x = canvas.width - b.radius;
                        b.vx = -b.vx * RESTITUTION;
                    }

                    if (b.y - b.radius < 0) {
                        b.y = b.radius;
                        b.vy = -b.vy * RESTITUTION;
                    } else if (b.y + b.radius > canvas.height) {
                        b.y = canvas.height - b.radius;
                        b.vy = -b.vy * RESTITUTION;
                    }
                } else {
                    // Standard off-screen removal if bouncy walls are off
                    const margin = 500;
                    if (b.x < -margin || b.x > canvas.width + margin || 
                        b.y < -margin || b.y > canvas.height + margin) {
                        balls.splice(i, 1);
                        continue;
                    }
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }
        }

        function drawSlingshot() {
            if (!isDragging) return;

            let pullX = dragStart.x - dragCurrent.x;
            let pullY = dragStart.y - dragCurrent.y;
            let dist = Math.hypot(pullX, pullY);

            let clampedX = dragCurrent.x;
            let clampedY = dragCurrent.y;

            if (dist > MAX_DRAG_DIST) {
                clampedX = dragStart.x - (pullX / dist) * MAX_DRAG_DIST;
                clampedY = dragStart.y - (pullY / dist) * MAX_DRAG_DIST;
            }

            // Rubber band drag line
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(clampedX, clampedY);
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Trajectory direction vector line
            const launchX = dragStart.x + pullX;
            const launchY = dragStart.y + pullY;

            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(launchX, launchY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ball spawn point indicator
            ctx.beginPath();
            ctx.arc(dragStart.x, dragStart.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Drag handle endpoint ring
            ctx.beginPath();
            ctx.arc(clampedX, clampedY, 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 2. Draw Ball & Trail
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 3. Draw Slingshot Visual Aiming Overlay
            drawSlingshot();

            // 4. Draw Spam-click Cooldown Banner
            if (cooldownMessage) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.fillText(cooldownMessage, canvas.width / 2, 30);
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
