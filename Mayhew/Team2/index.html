<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation - UFO Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn.active {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents touchscreen scrolling gesture conflicts on Chromebooks */
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="header-controls">
            <button id="bouncyBtn" class="btn" onclick="toggleBouncyWalls()">Bouncy Walls: OFF</button>
            <button class="btn" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click & drag to pull back like a slingshot to launch a UFO (1s cooldown between launches).
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const TRAIL_LENGTH = 180;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const SPAM_COOLDOWN_MS = 1000;    // 1-second spam-click limit between launches
        const MAX_DRAG_DIST = 200;        // Maximum pull-back distance for slingshot
        const SPEED_SCALE = 0.12;         // Slingshot pull distance to velocity multiplier
        const MAX_LAUNCH_SPEED = 22;      // Cap on launch velocity

        // STATE VARIABLES
        let balls = [];
        let particles = [];              // Firework particles array
        let backgroundUfos = [];         // Background decorative UFOs
        let bouncyWalls = false;
        let lastLaunchTime = 0;

        // Slingshot drag state
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let cooldownMessage = '';
        let cooldownTimeout = null;

        // Central Gravity Node Definition (The Sun)
        const centralNode = {
            x: 0,
            y: 0,
            radius: 16
        };

        // Initialize Background UFOs with varied shapes and slow drifting movement
        function initBackgroundUfos() {
            backgroundUfos = [];
            const count = 18;
            const ufoTypes = ['saucer', 'triangle', 'cigar', 'diamond'];

            for (let i = 0; i < count; i++) {
                backgroundUfos.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    scale: 0.6 + Math.random() * 0.8,
                    type: ufoTypes[i % ufoTypes.length],
                    alpha: 0.25 + Math.random() * 0.25,
                    pulse: Math.random() * Math.PI * 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.01
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            if (backgroundUfos.length === 0) {
                initBackgroundUfos();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleBouncyWalls() {
            bouncyWalls = !bouncyWalls;
            const btn = document.getElementById('bouncyBtn');
            btn.textContent = `Bouncy Walls: ${bouncyWalls ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active', bouncyWalls);
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // Pointer event listeners (supports mouse, trackpad, and Chromebook touchscreens)
        canvas.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            if (now - lastLaunchTime < SPAM_COOLDOWN_MS) {
                showCooldownNotice();
                return;
            }

            const pos = getCanvasCoords(e);
            isDragging = true;
            dragStart = { x: pos.x, y: pos.y };
            dragCurrent = { x: pos.x, y: pos.y };

            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const pos = getCanvasCoords(e);
            dragCurrent = { x: pos.x, y: pos.y };
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            try {
                canvas.releasePointerCapture(e.pointerId);
            } catch (err) {}

            const now = Date.now();
            if (now - lastLaunchTime < SPAM_COOLDOWN_MS) return;

            // Calculate pullback vector (Slingshot logic)
            let pullX = dragStart.x - dragCurrent.x;
            let pullY = dragStart.y - dragCurrent.y;
            let dist = Math.hypot(pullX, pullY);

            // Cap drag length
            if (dist > MAX_DRAG_DIST) {
                pullX = (pullX / dist) * MAX_DRAG_DIST;
                pullY = (pullY / dist) * MAX_DRAG_DIST;
                dist = MAX_DRAG_DIST;
            }

            // Quick single click default launch speed
            let vx = pullX * SPEED_SCALE;
            let vy = pullY * SPEED_SCALE;
            if (dist < 5) {
                vx = 5;
                vy = 0;
            }

            // Cap launch velocity
            const speed = Math.hypot(vx, vy);
            if (speed > MAX_LAUNCH_SPEED) {
                vx = (vx / speed) * MAX_LAUNCH_SPEED;
                vy = (vy / speed) * MAX_LAUNCH_SPEED;
            }

            launchBall(dragStart.x, dragStart.y, vx, vy);
            lastLaunchTime = Date.now();
        });

        canvas.addEventListener('pointercancel', () => {
            isDragging = false;
        });

        function showCooldownNotice() {
            cooldownMessage = 'PLEASE WAIT 1 SECOND BETWEEN LAUNCHES';
            if (cooldownTimeout) clearTimeout(cooldownTimeout);
            cooldownTimeout = setTimeout(() => {
                cooldownMessage = '';
            }, 1000);
        }

        function launchBall(x, y, vx, vy) {
            // Overwrite existing array to maintain a single ball/UFO on screen
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 12, // Hitbox radius for central sun collision
                trail: []   // Stores history of past {x, y} coordinates
            }];
        }

        function resetSimulation() {
            balls = [];
            particles = [];
        }

        // Spawn colorful firework particles when collision occurs with the sun
        function createFireworkExplosion(x, y) {
            const particleCount = 65;
            const colors = ['#FFD700', '#FF4500', '#FF1493', '#00FFFF', '#00FF66', '#FF0055', '#FFFFFF', '#FFA500'];

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 7;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 2.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0,
                    decay: 0.015 + Math.random() * 0.02
                });
            }
        }

        function updatePhysics() {
            // 1. Update Background UFO Drift
            for (const ufo of backgroundUfos) {
                ufo.x += ufo.vx;
                ufo.y += ufo.vy;
                ufo.pulse += 0.04;
                ufo.rotation += ufo.rotSpeed;

                // Wrap background UFOs around screen edges
                if (ufo.x < -30) ufo.x = canvas.width + 30;
                if (ufo.x > canvas.width + 30) ufo.x = -30;
                if (ufo.y < -30) ufo.y = canvas.height + 30;
                if (ufo.y > canvas.height + 30) ufo.y = -30;
            }

            // 2. Update UFO Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                if (bouncyWalls) {
                    const RESTITUTION = 0.9; // Bouncy wall velocity retention factor
                    if (b.x - b.radius < 0) {
                        b.x = b.radius;
                        b.vx = -b.vx * RESTITUTION;
                    } else if (b.x + b.radius > canvas.width) {
                        b.x = canvas.width - b.radius;
                        b.vx = -b.vx * RESTITUTION;
                    }

                    if (b.y - b.radius < 0) {
                        b.y = b.radius;
                        b.vy = -b.vy * RESTITUTION;
                    } else if (b.y + b.radius > canvas.height) {
                        b.y = canvas.height - b.radius;
                        b.vy = -b.vy * RESTITUTION;
                    }
                } else {
                    // Standard off-screen removal if bouncy walls are off
                    const margin = 500;
                    if (b.x < -margin || b.x > canvas.width + margin || 
                        b.y < -margin || b.y > canvas.height + margin) {
                        balls.splice(i, 1);
                        continue;
                    }
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Collision check: UFO collides with central sun -> EXPLODE!
                if (dist < centralNode.radius + b.radius) {
                    createFireworkExplosion(b.x, b.y);
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Record position history for alien face trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // 3. Update Firework Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96; // Velocity friction/drag
                p.vy *= 0.96;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Draw various shaped UFOs (Saucer, Triangle, Cigar, Diamond)
        function drawUfoShape(type, x, y, scale, angle, opacity, isMain = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);
            ctx.globalAlpha = opacity;

            if (type === 'saucer') {
                // Classic Flying Saucer
                // Top Dome
                ctx.beginPath();
                ctx.arc(0, -3, 8, Math.PI, 0);
                ctx.fillStyle = isMain ? 'rgba(0, 240, 255, 0.85)' : 'rgba(120, 200, 255, 0.6)';
                ctx.fill();

                // Main Disc
                ctx.beginPath();
                ctx.ellipse(0, 2, 18, 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = isMain ? '#c0c0c0' : '#8a9ea7';
                ctx.fill();
                ctx.strokeStyle = isMain ? '#00e5ff' : '#4a6572';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Bottom Thruster Base
                ctx.beginPath();
                ctx.ellipse(0, 5, 8, 3, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#00e5ff';
                ctx.fill();

                // Glowing Lights
                const lights = [-12, -4, 4, 12];
                lights.forEach((lx, idx) => {
                    ctx.beginPath();
                    ctx.arc(lx, 2, 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = (idx % 2 === 0) ? '#00ffff' : '#ff0055';
                    ctx.fill();
                });
            } else if (type === 'triangle') {
                // Triangular Delta UFO
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(14, 12);
                ctx.lineTo(-14, 12);
                ctx.closePath();
                ctx.fillStyle = isMain ? '#2a2e3d' : '#1e222e';
                ctx.fill();
                ctx.strokeStyle = '#00b0ff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Glowing Central Core
                ctx.beginPath();
                ctx.arc(0, 2, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffff';
                ctx.fill();

                // Corner Lights
                const corners = [{x:0, y:-10}, {x:10, y:9}, {x:-10, y:9}];
                corners.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#00e5ff';
                    ctx.fill();
                });
            } else if (type === 'cigar') {
                // Cigar / Cylindrical Probe
                ctx.beginPath();
                ctx.roundRect(-16, -5, 32, 10, 5);
                ctx.fillStyle = '#4f5b66';
                ctx.fill();
                ctx.strokeStyle = '#80d8ff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Glowing Strip
                ctx.beginPath();
                ctx.rect(-10, -1.5, 20, 3);
                ctx.fillStyle = '#00e5ff';
                ctx.fill();
            } else if (type === 'diamond') {
                // Diamond Probe UFO
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(10, 0);
                ctx.lineTo(0, 14);
                ctx.lineTo(-10, 0);
                ctx.closePath();
                ctx.fillStyle = '#1c3144';
                ctx.fill();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Ring around center
                ctx.beginPath();
                ctx.ellipse(0, 0, 14, 4, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            ctx.restore();
        }

        // Render vector green alien faces along the trajectory trail
        function drawAlienFace(x, y, scale, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = opacity;

            // Green Head (Oval shape)
            ctx.beginPath();
            ctx.ellipse(0, 0, 6 * scale, 8 * scale, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#00FF33';
            ctx.fill();
            ctx.strokeStyle = '#00991F';
            ctx.lineWidth = 1 * scale;
            ctx.stroke();

            // Left Eye (Black slanted almond eye)
            ctx.beginPath();
            ctx.ellipse(-2.2 * scale, -1.8 * scale, 1.6 * scale, 2.8 * scale, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Right Eye (Black slanted almond eye)
            ctx.beginPath();
            ctx.ellipse(2.2 * scale, -1.8 * scale, 1.6 * scale, 2.8 * scale, Math.PI / 6, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Tiny Mouth
            ctx.beginPath();
            ctx.arc(0, 3.5 * scale, 1.5 * scale, 0, Math.PI);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 0.8 * scale;
            ctx.stroke();

            ctx.restore();
        }

        function drawBackgroundUfos() {
            for (const ufo of backgroundUfos) {
                const pulseAlpha = ufo.alpha + Math.sin(ufo.pulse) * 0.08;
                drawUfoShape(ufo.type, ufo.x, ufo.y, ufo.scale, ufo.rotation, Math.max(0.1, pulseAlpha));
            }
        }

        function drawSlingshot() {
            if (!isDragging) return;

            let pullX = dragStart.x - dragCurrent.x;
            let pullY = dragStart.y - dragCurrent.y;
            let dist = Math.hypot(pullX, pullY);

            let clampedX = dragCurrent.x;
            let clampedY = dragCurrent.y;

            if (dist > MAX_DRAG_DIST) {
                clampedX = dragStart.x - (pullX / dist) * MAX_DRAG_DIST;
                clampedY = dragStart.y - (pullY / dist) * MAX_DRAG_DIST;
            }

            // Rubber band drag line
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(clampedX, clampedY);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Trajectory direction vector line
            const launchX = dragStart.x + pullX;
            const launchY = dragStart.y + pullY;

            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(launchX, launchY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Preview UFO at launch origin position
            const angle = Math.atan2(pullY, pullX);
            drawUfoShape('saucer', dragStart.x, dragStart.y, 0.9, angle, 0.9, true);

            // Drag handle endpoint ring
            ctx.beginPath();
            ctx.arc(clampedX, clampedY, 5, 0, Math.PI * 2);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background UFOs of various shapes floating in deep space
            drawBackgroundUfos();

            // 2. Draw Central Mass Node (Styled as glowing Sun)
            ctx.shadowColor = '#FF8C00';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700'; // Sun Gold
            ctx.fill();

            // Glowing inner core of the sun
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 0.55, 0, Math.PI * 2);
            ctx.fillStyle = '#FF4500'; // Orange-Red Core
            ctx.fill();

            // 3. Draw Firework Particles
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            }

            // 4. Draw Active UFO Balls & Green Alien Face Trail
            for (const b of balls) {
                // Render green alien faces along the orbit trail (spaced every 6 points for optimal Chromebook FPS)
                const step = 6;
                for (let t = 0; t < b.trail.length; t += step) {
                    const point = b.trail[t];
                    const progress = (t + 1) / b.trail.length; // 0 (oldest point) to 1 (newest point)
                    const opacity = 0.15 + 0.85 * progress;
                    const scale = 0.5 + 0.7 * progress;
                    drawAlienFace(point.x, point.y, scale, opacity);
                }

                // Calculate UFO orientation angle based on movement vector
                const angle = Math.atan2(b.vy, b.vx);

                // Draw main UFO shape for the ball
                drawUfoShape('saucer', b.x, b.y, 1.0, angle, 1.0, true);
            }

            // 5. Draw Slingshot Visual Aiming Overlay
            drawSlingshot();

            // 6. Draw Spam-click Cooldown Banner
            if (cooldownMessage) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.fillText(cooldownMessage, canvas.width / 2, 30);
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
