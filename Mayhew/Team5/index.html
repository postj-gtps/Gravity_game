<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Speed Control Container */
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .control-group input[type=range] {
            cursor: pointer;
            accent-color: #ffffff;
            width: 120px;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        
        <!-- Ball Speed Multiplier Control -->
        <div class="control-group">
            <label for="speedSlider">LAUNCH POWER: <span id="speedValue">5</span>x</label>
            <input type="range" id="speedSlider" min="1" max="15" value="5" step="1">
        </div>

        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click/Touch and pull back to aim & launch a ball (1s cooldown). Bounce off floating astronauts!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueDisplay = document.getElementById('speedValue');

        // SIMULATION CONSTANTS
        const GRAVITY_CONSTANT = 1800;    // Strength of gravitational pull (G)
        const TRAIL_LENGTH = 300;         // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;     // Prevents infinite velocity near center
        const COOLDOWN_TIME_MS = 1000;    // 1-second spam click cooldown
        const BALL_LIFESPAN_MS = 10000;   // 10 seconds before explosion
        const BALL_RADIUS = 4;
        const ASTRONAUT_RADIUS = BALL_RADIUS * 2; // Twice the size of the ball (8px)

        // STATE VARIABLES
        let balls = [];
        let particles = [];
        let stars = [];
        let planets = [];
        let astronauts = [];
        let lastLaunchTime = 0;
        let launchMultiplier = parseFloat(speedSlider.value);

        // Slingshot Drag State
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: 12
        };

        // Speed Slider Event Listener
        speedSlider.addEventListener('input', (e) => {
            launchMultiplier = parseFloat(e.target.value);
            speedValueDisplay.textContent = launchMultiplier;
        });

        // Generate Starfield, Planets, and Astronauts
        function initSpaceBackground() {
            // Generate Stars
            stars = [];
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    xRatio: Math.random(),
                    yRatio: Math.random(),
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }

            // Generate Planets
            planets = [];
            const planetCount = Math.floor(Math.random() * 3) + 4;
            const planetColors = [
                '#4a90e2', '#e67e22', '#9b59b6', '#2ecc71', '#f1c40f', '#e74c3c', '#1abc9c'
            ];

            for (let i = 0; i < planetCount; i++) {
                planets.push({
                    xRatio: 0.1 + Math.random() * 0.8,
                    yRatio: 0.1 + Math.random() * 0.8,
                    radius: Math.floor(Math.random() * 18) + 12,
                    color: planetColors[Math.floor(Math.random() * planetColors.length)],
                    hasRing: Math.random() > 0.5,
                    ringTilt: (Math.random() * 0.5 + 0.2) * Math.PI
                });
            }

            // Initialize Floating Astronauts
            initAstronauts();
        }

        function initAstronauts() {
            astronauts = [];
            const count = 5;
            for (let i = 0; i < count; i++) {
                // Place away from center to avoid immediate absorption
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 200;
                const x = (canvas.width || 800) / 2 + Math.cos(angle) * distance;
                const y = (canvas.height || 600) / 2 + Math.sin(angle) * distance;

                astronauts.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    radius: ASTRONAUT_RADIUS,
                    mass: 4, // Heavier mass than the ball (mass ratio = 4:1)
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);

        // Helper to get Canvas Coordinates for Mouse & Touch Events
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // SLINGSHOT DRAG HANDLERS
        function handlePointerDown(e) {
            const now = Date.now();
            if (now - lastLaunchTime < COOLDOWN_TIME_MS) {
                return; // Block input if cooldown is active
            }

            const pos = getCanvasPos(e);
            isDragging = true;
            dragStart = pos;
            dragCurrent = pos;
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            dragCurrent = getCanvasPos(e);
        }

        function handlePointerUp() {
            if (!isDragging) return;

            const now = Date.now();
            const dx = dragStart.x - dragCurrent.x; // Pull back vector gives opposite launch direction
            const dy = dragStart.y - dragCurrent.y;
            const distance = Math.hypot(dx, dy);

            // Minimum drag distance requirement to fire
            if (distance > 5 && (now - lastLaunchTime >= COOLDOWN_TIME_MS)) {
                const sensitivity = 0.05 * (launchMultiplier / 5);
                const vx = dx * sensitivity;
                const vy = dy * sensitivity;

                launchBall(dragStart.x, dragStart.y, vx, vy);
                lastLaunchTime = now;
            }

            isDragging = false;
        }

        // Mouse Listeners
        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        // Touch Screen Listeners (Chromebook compatibility)
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { handlePointerMove(e); });
        window.addEventListener('touchend', (e) => { handlePointerUp(); });

        function launchBall(x, y, vx, vy) {
            balls = [{
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: BALL_RADIUS,
                mass: 1,
                trail: [],
                launchTime: Date.now()
            }];
        }

        function createFireworks(x, y) {
            const particleCount = 45;
            const colors = ['#ff0055', '#00e5ff', '#ffea00', '#76ff03', '#d500f9', '#ff9100'];

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2.5 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0,
                    decay: Math.random() * 0.02 + 0.015
                });
            }
        }

        function resetSimulation() {
            balls = [];
            particles = [];
            initAstronauts();
        }

        // Newton 2D Elastic Collision Resolution
        function resolveCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = b1.radius + b2.radius;

            if (dist < minDist && dist > 0) {
                // Collision Normal Vector
                const nx = dx / dist;
                const ny = dy / dist;

                // Position Correction (Separation to avoid sticking)
                const overlap = minDist - dist;
                b1.x -= nx * overlap * 0.5;
                b1.y -= ny * overlap * 0.5;
                b2.x += nx * overlap * 0.5;
                b2.y += ny * overlap * 0.5;

                // Relative Velocity
                const rvx = b1.vx - b2.vx;
                const rvy = b1.vy - b2.vy;
                const velAlongNormal = rvx * nx + rvy * ny;

                // Do not resolve if objects are moving apart
                if (velAlongNormal > 0) {
                    const restitution = 0.9; // Bounciness coefficient
                    const m1 = b1.mass || 1;
                    const m2 = b2.mass || 4;

                    // Newton's Third Law Impulse calculation
                    const impulse = -(1 + restitution) * velAlongNormal / ((1 / m1) + (1 / m2));

                    // Equal and opposite velocity change
                    b1.vx += (impulse / m1) * nx;
                    b1.vy += (impulse / m1) * ny;
                    b2.vx -= (impulse / m2) * nx;
                    b2.vy -= (impulse / m2) * ny;
                }
            }
        }

        function updatePhysics() {
            const now = Date.now();

            // 1. Update Astronaut Physics
            for (let a of astronauts) {
                a.x += a.vx;
                a.y += a.vy;
                a.rotation += a.vRot;

                // Screen Boundary Bounce for Astronauts
                if (a.x - a.radius < 0) { a.x = a.radius; a.vx *= -1; }
                if (a.x + a.radius > canvas.width) { a.x = canvas.width - a.radius; a.vx *= -1; }
                if (a.y - a.radius < 0) { a.y = a.radius; a.vy *= -1; }
                if (a.y + a.radius > canvas.height) { a.y = canvas.height - a.radius; a.vy *= -1; }
            }

            // 2. Update Ball Physics & Timers
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // 10-second explosion check
                if (now - b.launchTime >= BALL_LIFESPAN_MS) {
                    createFireworks(b.x, b.y);
                    balls.splice(i, 1);
                    continue;
                }

                // Remove ball if it travels too far off-screen
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Gravity acceleration (inverse square law)
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Check collision with all floating astronauts
                for (let a of astronauts) {
                    resolveCollision(b, a);
                }

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // 3. Update Firework Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawAstronaut(astro) {
            ctx.save();
            ctx.translate(astro.x, astro.y);
            ctx.rotate(astro.rotation);

            // Astronaut Body/Helmet (White circle, twice the size of the ball)
            ctx.beginPath();
            ctx.arc(0, 0, astro.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Astronaut Visor (Dark cyan/blue oval)
            ctx.beginPath();
            ctx.ellipse(0, -1, astro.radius * 0.5, astro.radius * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#00e5ff';
            ctx.fill();

            // Small Backpack detail
            ctx.fillStyle = '#888888';
            ctx.fillRect(-astro.radius - 2, -astro.radius * 0.5, 2, astro.radius);

            ctx.restore();
        }

        function drawSlingshot() {
            if (!isDragging) return;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;

            // Draw Pull Line (Slingshot Elastic Band)
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(dragCurrent.x, dragCurrent.y);
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Aim Vector Line (Direction ball will launch)
            const aimX = dragStart.x + dx;
            const aimY = dragStart.y + dy;
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(aimX, aimY);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Anchor point highlight
            ctx.beginPath();
            ctx.arc(dragStart.x, dragStart.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#00e5ff';
            ctx.fill();
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Starfield Background
            for (const star of stars) {
                ctx.beginPath();
                ctx.arc(star.xRatio * canvas.width, star.yRatio * canvas.height, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            }

            // 2. Draw Background Planets
            for (const planet of planets) {
                const px = planet.xRatio * canvas.width;
                const py = planet.yRatio * canvas.height;

                ctx.beginPath();
                ctx.arc(px, py, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();

                if (planet.hasRing) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(px, py, planet.radius * 1.8, planet.radius * 0.5, planet.ringTilt, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // 3. Draw Floating Astronauts
            for (const astro of astronauts) {
                drawAstronaut(astro);
            }

            // 4. Draw Central Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 5. Draw Ball & Trail
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 6. Draw Firework Particles
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            }

            // 7. Draw Slingshot Guidance
            drawSlingshot();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            initSpaceBackground();
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
