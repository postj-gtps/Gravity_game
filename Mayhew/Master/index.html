<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .planet-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slider-select {
            accent-color: #ffffff;
            cursor: pointer;
            width: 110px;
        }

        .dropdown-select {
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 12px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        .dropdown-select:hover, .dropdown-select:focus {
            background: #ffffff;
            color: #000000;
        }

        .dropdown-select option {
            background: #000000;
            color: #ffffff;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="controls">
            <!-- Rocket Quantity Control -->
            <div class="control-group">
                <label for="rocketSlider" class="planet-label">Rockets: <span id="rocketVal">1</span></label>
                <input type="range" id="rocketSlider" class="slider-select" min="1" max="30" value="1" oninput="updateRocketCount(this.value)">
            </div>

            <!-- Planet Focus Select Control -->
            <div class="control-group">
                <label for="planetSelect" class="planet-label">Highlight Planet:</label>
                <select id="planetSelect" class="dropdown-select" onchange="changePlanet(this.value)">
                    <option value="mercury">Mercury</option>
                    <option value="venus">Venus</option>
                    <option value="earth" selected>Earth</option>
                    <option value="mars">Mars</option>
                    <option value="jupiter">Jupiter</option>
                    <option value="saturn">Saturn</option>
                    <option value="uranus">Uranus</option>
                    <option value="neptune">Neptune</option>
                </select>
            </div>

            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click or tap anywhere to launch rockets (max 1 launch/sec). Rockets bounce off planets, asteroids, and astronauts!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // PLANETARY DATA CONFIGURATION & RELATIVE POSITIONS ON SCREEN
        const PLANETS = {
            mercury: { name: 'Mercury', gravity: 700,  color: '#aaaaaa', radius: 8,  relX: 0.15, relY: 0.25 },
            venus:   { name: 'Venus',   gravity: 1600, color: '#e3bb76', radius: 11, relX: 0.35, relY: 0.70 },
            earth:   { name: 'Earth',   gravity: 1800, color: '#4b9cd3', radius: 12, relX: 0.50, relY: 0.35 },
            mars:    { name: 'Mars',    gravity: 900,  color: '#c1440e', radius: 9,  relX: 0.68, relY: 0.75 },
            jupiter: { name: 'Jupiter', gravity: 4500, color: '#d8ca9d', radius: 22, relX: 0.82, relY: 0.25 },
            saturn:  { name: 'Saturn',  gravity: 3200, color: '#e4d191', radius: 18, relX: 0.22, relY: 0.78 },
            uranus:  { name: 'Uranus',  gravity: 2400, color: '#75c6d1', radius: 15, relX: 0.42, relY: 0.18 },
            neptune: { name: 'Neptune', gravity: 2600, color: '#2f5fad', radius: 15, relX: 0.88, relY: 0.72 }
        };

        // SIMULATION CONSTANTS
        const LAUNCH_VELOCITY = 5;         // Velocity of launched rockets
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near planet centers
        const SPAM_LIMIT_MS = 1000;        // Spam click filter threshold (1 second)
        const NUM_ASTEROIDS = 6;           // Number of floating asteroids in scene
        const NUM_ASTRONAUTS = 5;          // Number of floating astronauts in scene
        const MAX_BALLS = 120;             // Upper cap on screen objects

        // STATE VARIABLES
        let balls = [];
        let asteroids = [];
        let astronauts = [];
        let particles = [];
        let highlightedPlanetKey = 'earth';
        let lastLaunchTime = 0;
        let rocketsPerLaunch = 1;

        function updateRocketCount(val) {
            rocketsPerLaunch = parseInt(val, 10) || 1;
            document.getElementById('rocketVal').textContent = rocketsPerLaunch;
        }

        function updatePlanetPositions() {
            for (const key in PLANETS) {
                const p = PLANETS[key];
                p.x = canvas.width * p.relX;
                p.y = canvas.height * p.relY;
            }
        }

        function createAsteroids() {
            asteroids = [];
            for (let i = 0; i < NUM_ASTEROIDS; i++) {
                let x, y, tooCloseToPlanet;

                do {
                    tooCloseToPlanet = false;
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;

                    for (const key in PLANETS) {
                        const p = PLANETS[key];
                        const dx = x - p.x;
                        const dy = y - p.y;
                        if (Math.sqrt(dx * dx + dy * dy) < p.radius + 40) {
                            tooCloseToPlanet = true;
                            break;
                        }
                    }
                } while (tooCloseToPlanet);

                const radius = Math.random() * 6 + 9;
                const speed = Math.random() * 1.2 + 0.6;
                const angle = Math.random() * Math.PI * 2;

                const numPoints = 8 + Math.floor(Math.random() * 5);
                const offsets = [];
                for (let p = 0; p < numPoints; p++) {
                    offsets.push(0.75 + Math.random() * 0.5);
                }

                asteroids.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: radius,
                    numPoints: numPoints,
                    offsets: offsets,
                    rotAngle: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function createAstronauts() {
            astronauts = [];
            for (let i = 0; i < NUM_ASTRONAUTS; i++) {
                let x, y, tooCloseToPlanet;

                do {
                    tooCloseToPlanet = false;
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;

                    for (const key in PLANETS) {
                        const p = PLANETS[key];
                        const dx = x - p.x;
                        const dy = y - p.y;
                        if (Math.sqrt(dx * dx + dy * dy) < p.radius + 40) {
                            tooCloseToPlanet = true;
                            break;
                        }
                    }
                } while (tooCloseToPlanet);

                const speed = Math.random() * 1.0 + 0.5;
                const angle = Math.random() * Math.PI * 2;

                astronauts.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 8, // Twice the radius of the rocket balls (radius = 4)
                    mass: 4,   // Heavier mass for elastic collisions
                    rotAngle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function createSparklyExplosion(x, y) {
            const particleCount = 35;
            const colors = ['#ffffff', '#00e5ff', '#ffea00', '#ff007f', '#a8ff00'];

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: Math.random() * 0.025 + 0.015,
                    sparkle: Math.random() > 0.4
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            updatePlanetPositions();

            if (asteroids.length === 0) {
                createAsteroids();
            }
            if (astronauts.length === 0) {
                createAstronauts();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function changePlanet(planetKey) {
            if (PLANETS[planetKey]) {
                highlightedPlanetKey = planetKey;
            }
        }

        function handleInput(e) {
            const now = Date.now();
            if (now - lastLaunchTime < SPAM_LIMIT_MS) {
                return; // Enforce 1 second launch limit
            }

            const rect = canvas.getBoundingClientRect();
            let clickX, clickY;

            if (e.touches && e.touches.length > 0) {
                clickX = e.touches[0].clientX - rect.left;
                clickY = e.touches[0].clientY - rect.top;
            } else {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            }

            lastLaunchTime = now;
            launchRockets(clickX, clickY);
        }

        canvas.addEventListener('click', handleInput);

        function launchRockets(x, y) {
            const count = rocketsPerLaunch;
            const angleStep = (2 * Math.PI) / count;

            for (let i = 0; i < count; i++) {
                if (balls.length >= MAX_BALLS) break;

                const angle = i * angleStep;
                const vx = LAUNCH_VELOCITY * Math.cos(angle);
                const vy = LAUNCH_VELOCITY * Math.sin(angle);

                balls.push({
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    radius: 4,
                    mass: 1,
                    trail: []
                });
            }
        }

        function resetSimulation() {
            balls = [];
            particles = [];
            createAsteroids();
            createAstronauts();
        }

        function updatePhysics() {
            // 1. Update Asteroids
            for (const ast of asteroids) {
                ast.x += ast.vx;
                ast.y += ast.vy;
                ast.rotAngle += ast.rotSpeed;

                if (ast.x - ast.radius < 0) {
                    ast.x = ast.radius;
                    ast.vx *= -1;
                } else if (ast.x + ast.radius > canvas.width) {
                    ast.x = canvas.width - ast.radius;
                    ast.vx *= -1;
                }
                if (ast.y - ast.radius < 0) {
                    ast.y = ast.radius;
                    ast.vy *= -1;
                } else if (ast.y + ast.radius > canvas.height) {
                    ast.y = canvas.height - ast.radius;
                    ast.vy *= -1;
                }
            }

            // 2. Update Astronauts (Movement & Boundary Collisions)
            for (const astro of astronauts) {
                astro.x += astro.vx;
                astro.y += astro.vy;
                astro.rotAngle += astro.rotSpeed;

                if (astro.x - astro.radius < 0) {
                    astro.x = astro.radius;
                    astro.vx *= -1;
                } else if (astro.x + astro.radius > canvas.width) {
                    astro.x = canvas.width - astro.radius;
                    astro.vx *= -1;
                }
                if (astro.y - astro.radius < 0) {
                    astro.y = astro.radius;
                    astro.vy *= -1;
                } else if (astro.y + astro.radius > canvas.height) {
                    astro.y = canvas.height - astro.radius;
                    astro.vy *= -1;
                }

                // Bounce Astronauts off Planet surfaces
                for (const key in PLANETS) {
                    const p = PLANETS[key];
                    const dx = astro.x - p.x;
                    const dy = astro.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p.radius + astro.radius;

                    if (dist < minDist) {
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);
                        astro.x += nx * (minDist - dist);
                        const dot = astro.vx * nx + astro.vy * ny;
                        if (dot < 0) {
                            astro.vx -= 2 * dot * nx;
                            astro.vy -= 2 * dot * ny;
                        }
                    }
                }
            }

            // 3. Astronaut vs Asteroid Collision (Destroys Asteroid in Sparkly Explosion)
            for (const astro of astronauts) {
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const ast = asteroids[j];
                    const dx = ast.x - astro.x;
                    const dy = ast.y - astro.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < ast.radius + astro.radius) {
                        createSparklyExplosion(ast.x, ast.y);
                        asteroids.splice(j, 1);
                    }
                }
            }

            // 4. Update Rockets Physics & Collisions
            let newBallsToSpawn = [];

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Gravitational Pull from Planets
                for (const key in PLANETS) {
                    const planet = PLANETS[key];
                    const dx = planet.x - b.x;
                    const dy = planet.y - b.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist > 0.001) {
                        const acceleration = planet.gravity / (distSq + SOFTENING_FACTOR);
                        b.vx += acceleration * (dx / dist);
                        b.vy += acceleration * (dy / dist);
                    }
                }

                b.x += b.vx;
                b.y += b.vy;

                // Planet Collision (Bounce off)
                for (const key in PLANETS) {
                    const planet = PLANETS[key];
                    const pdx = b.x - planet.x;
                    const pdy = b.y - planet.y;
                    const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                    const minDist = planet.radius + b.radius;

                    if (pdist < minDist) {
                        const pnx = pdx / (pdist || 1);
                        const pny = pdy / (pdist || 1);

                        b.x += pnx * (minDist - pdist);
                        const pdot = b.vx * pnx + b.vy * pny;
                        if (pdot < 0) {
                            b.vx = b.vx - 2 * pdot * pnx;
                            b.vy = b.vy - 2 * pdot * pny;
                        }
                    }
                }

                // Asteroid Collision (Spawns new ball)
                for (const ast of asteroids) {
                    const adx = b.x - ast.x;
                    const ady = b.y - ast.y;
                    const adist = Math.sqrt(adx * adx + ady * ady);
                    const minDist = ast.radius + b.radius;

                    if (adist < minDist) {
                        const nx = adx / (adist || 1);
                        const ny = ady / (adist || 1);

                        b.x += nx * (minDist - adist);
                        const dot = b.vx * nx + b.vy * ny;

                        if (dot < 0) {
                            b.vx = b.vx - 2 * dot * nx;
                            b.vy = b.vy - 2 * dot * ny;

                            if (balls.length + newBallsToSpawn.length < MAX_BALLS) {
                                const currentSpeed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                                const bounceAngle = Math.atan2(b.vy, b.vx);
                                const scatterAngle = bounceAngle + (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 4 + Math.random() * Math.PI / 4);

                                newBallsToSpawn.push({
                                    x: b.x + nx * 4,
                                    y: b.y + ny * 4,
                                    vx: Math.cos(scatterAngle) * currentSpeed,
                                    vy: Math.sin(scatterAngle) * currentSpeed,
                                    radius: 4,
                                    mass: 1,
                                    trail: []
                                });
                            }
                        }
                    }
                }

                // Astronaut Collision (2D Elastic Bounce according to Newton's Laws - NO new balls spawned)
                for (const astro of astronauts) {
                    const dx = astro.x - b.x;
                    const dy = astro.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = astro.radius + b.radius;

                    if (dist < minDist) {
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);

                        // Position correction to prevent sticking
                        const overlap = minDist - dist;
                        const mSum = b.mass + astro.mass;
                        b.x -= nx * overlap * (astro.mass / mSum);
                        b.y -= ny * overlap * (astro.mass / mSum);
                        astro.x += nx * overlap * (b.mass / mSum);
                        astro.y += ny * overlap * (b.mass / mSum);

                        // Relative velocity along collision normal
                        const rvx = astro.vx - b.vx;
                        const rvy = astro.vy - b.vy;
                        const velAlongNormal = rvx * nx + rvy * ny;

                        if (velAlongNormal < 0) {
                            const restitution = 1.0; // Elastic collision
                            const impulseMag = -(1 + restitution) * velAlongNormal / (1 / b.mass + 1 / astro.mass);

                            const impulseX = impulseMag * nx;
                            const impulseY = impulseMag * ny;

                            b.vx -= impulseX / b.mass;
                            b.vy -= impulseY / b.mass;
                            astro.vx += impulseX / astro.mass;
                            astro.vy += impulseY / astro.mass;
                        }
                    }
                }

                // Record trail history
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            if (newBallsToSpawn.length > 0) {
                balls.push(...newBallsToSpawn);
            }

            // 5. Update Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.97;
                p.vy *= 0.97;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Asteroids
            ctx.strokeStyle = '#aaaaaa';
            ctx.fillStyle = '#1c1c1c';
            ctx.lineWidth = 1.5;

            for (const ast of asteroids) {
                ctx.save();
                ctx.translate(ast.x, ast.y);
                ctx.rotate(ast.rotAngle);

                ctx.beginPath();
                const step = (Math.PI * 2) / ast.numPoints;
                for (let p = 0; p < ast.numPoints; p++) {
                    const r = ast.radius * ast.offsets[p];
                    const px = Math.cos(p * step) * r;
                    const py = Math.sin(p * step) * r;
                    if (p === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // 2. Draw Astronauts
            for (const astro of astronauts) {
                ctx.save();
                ctx.translate(astro.x, astro.y);
                ctx.rotate(astro.rotAngle);

                const r = astro.radius;

                // Backpack
                ctx.fillStyle = '#555555';
                ctx.fillRect(-r * 0.9, -r * 0.7, r * 0.4, r * 1.4);

                // Body Suit
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, r * 0.2, r * 0.65, 0, Math.PI * 2);
                ctx.fill();

                // Helmet
                ctx.beginPath();
                ctx.arc(0, -r * 0.3, r * 0.65, 0, Math.PI * 2);
                ctx.fill();

                // Visor
                ctx.beginPath();
                ctx.arc(r * 0.1, -r * 0.3, r * 0.45, -Math.PI * 0.4, Math.PI * 0.4);
                ctx.fillStyle = '#00d2ff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // Suit Chest Patch
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(-r * 0.25, r * 0.1, r * 0.25, r * 0.2);

                ctx.restore();
            }

            // 3. Draw Planets
            for (const key in PLANETS) {
                const planet = PLANETS[key];

                if (key === highlightedPlanetKey) {
                    ctx.beginPath();
                    ctx.arc(planet.x, planet.y, planet.radius + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                if (key === 'saturn') {
                    ctx.beginPath();
                    ctx.ellipse(planet.x, planet.y, planet.radius * 1.8, planet.radius * 0.6, Math.PI / 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#c2b280';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();

                ctx.fillStyle = '#888888';
                ctx.font = '10px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(planet.name.toUpperCase(), planet.x, planet.y + planet.radius + 12);
            }

            // 4. Draw Rockets & Trails
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 5. Draw Sparkly Explosion Particles
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;

                if (p.sparkle) {
                    const s = p.size;
                    ctx.fillRect(p.x - s, p.y - 1, s * 2, 2);
                    ctx.fillRect(p.x - 1, p.y - s, 2, s * 2);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
