<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .planet-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slider-select {
            accent-color: #ffffff;
            cursor: pointer;
            width: 110px;
        }

        .dropdown-select {
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 12px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        .dropdown-select:hover, .dropdown-select:focus {
            background: #ffffff;
            color: #000000;
        }

        .dropdown-select option {
            background: #000000;
            color: #ffffff;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        <div class="controls">
            <!-- Rocket Quantity Control -->
            <div class="control-group">
                <label for="rocketSlider" class="planet-label">Rockets: <span id="rocketVal">1</span></label>
                <input type="range" id="rocketSlider" class="slider-select" min="1" max="30" value="1" oninput="updateRocketCount(this.value)">
            </div>

            <!-- Planet Select Control -->
            <div class="control-group">
                <label for="planetSelect" class="planet-label">Planet:</label>
                <select id="planetSelect" class="dropdown-select" onchange="changePlanet(this.value)">
                    <option value="mercury">Mercury</option>
                    <option value="venus">Venus</option>
                    <option value="earth" selected>Earth</option>
                    <option value="mars">Mars</option>
                    <option value="jupiter">Jupiter</option>
                    <option value="saturn">Saturn</option>
                    <option value="uranus">Uranus</option>
                    <option value="neptune">Neptune</option>
                </select>
            </div>

            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click or tap anywhere on the canvas to launch rockets (1 launch per second). Asteroids bounce rockets and spawn new ones!
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // PLANETARY DATA CONFIGURATION
        const PLANETS = {
            mercury: { name: 'Mercury', gravity: 700,  color: '#aaaaaa', radius: 8 },
            venus:   { name: 'Venus',   gravity: 1600, color: '#e3bb76', radius: 11 },
            earth:   { name: 'Earth',   gravity: 1800, color: '#4b9cd3', radius: 12 },
            mars:    { name: 'Mars',    gravity: 900,  color: '#c1440e', radius: 9 },
            jupiter: { name: 'Jupiter', gravity: 4500, color: '#d8ca9d', radius: 22 },
            saturn:  { name: 'Saturn',  gravity: 3200, color: '#e4d191', radius: 18 },
            uranus:  { name: 'Uranus',  gravity: 2400, color: '#75c6d1', radius: 15 },
            neptune: { name: 'Neptune', gravity: 2600, color: '#2f5fad', radius: 15 }
        };

        // SIMULATION CONSTANTS
        const LAUNCH_VELOCITY = 5;         // Velocity of launched rockets
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const SPAM_LIMIT_MS = 1000;        // Spam click filter threshold (1 second)
        const NUM_ASTEROIDS = 6;           // Number of floating asteroids in scene
        const MAX_BALLS = 120;             // Upper cap on screen objects to preserve Chromebook performance

        // STATE VARIABLES
        let balls = [];
        let asteroids = [];
        let currentPlanetKey = 'earth';
        let lastLaunchTime = 0;
        let rocketsPerLaunch = 1;

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            radius: PLANETS[currentPlanetKey].radius
        };

        function updateRocketCount(val) {
            rocketsPerLaunch = parseInt(val, 10) || 1;
            document.getElementById('rocketVal').textContent = rocketsPerLaunch;
        }

        function createAsteroids() {
            asteroids = [];
            for (let i = 0; i < NUM_ASTEROIDS; i++) {
                let x, y, dist;
                // Generate initial asteroid positions outside central gravity zone
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                    const dx = x - canvas.width / 2;
                    const dy = y - canvas.height / 2;
                    dist = Math.sqrt(dx * dx + dy * dy);
                } while (dist < 130);

                const radius = Math.random() * 12 + 18; // Radius range 18 - 30
                const speed = Math.random() * 1.2 + 0.6;
                const angle = Math.random() * Math.PI * 2;

                // Procedural jagged polygon shapes for rocky aesthetic
                const numPoints = 8 + Math.floor(Math.random() * 5);
                const offsets = [];
                for (let p = 0; p < numPoints; p++) {
                    offsets.push(0.75 + Math.random() * 0.5);
                }

                asteroids.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: radius,
                    numPoints: numPoints,
                    offsets: offsets,
                    rotAngle: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            if (asteroids.length === 0) {
                createAsteroids();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function changePlanet(planetKey) {
            if (PLANETS[planetKey]) {
                currentPlanetKey = planetKey;
                centralNode.radius = PLANETS[planetKey].radius;
            }
        }

        // Handles click and touch input with 1x per second spam filter
        function handleInput(e) {
            const now = Date.now();
            if (now - lastLaunchTime < SPAM_LIMIT_MS) {
                return; // Enforce 1 second launch limit
            }

            const rect = canvas.getBoundingClientRect();
            let clickX, clickY;

            if (e.touches && e.touches.length > 0) {
                clickX = e.touches[0].clientX - rect.left;
                clickY = e.touches[0].clientY - rect.top;
            } else {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            }

            lastLaunchTime = now;
            launchRockets(clickX, clickY);
        }

        canvas.addEventListener('click', handleInput);

        function launchRockets(x, y) {
            const count = rocketsPerLaunch;
            const angleStep = (2 * Math.PI) / count;

            for (let i = 0; i < count; i++) {
                if (balls.length >= MAX_BALLS) break;

                // Calculate radial angle spread evenly in 360 degrees
                const angle = i * angleStep;
                const vx = LAUNCH_VELOCITY * Math.cos(angle);
                const vy = LAUNCH_VELOCITY * Math.sin(angle);

                balls.push({
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    radius: 4,
                    trail: []
                });
            }
        }

        function resetSimulation() {
            balls = [];
            createAsteroids();
        }

        function updatePhysics() {
            const currentPlanet = PLANETS[currentPlanetKey];

            // 1. Update Asteroid Movement & Boundary Collisions
            for (const ast of asteroids) {
                ast.x += ast.vx;
                ast.y += ast.vy;
                ast.rotAngle += ast.rotSpeed;

                if (ast.x - ast.radius < 0) {
                    ast.x = ast.radius;
                    ast.vx *= -1;
                } else if (ast.x + ast.radius > canvas.width) {
                    ast.x = canvas.width - ast.radius;
                    ast.vx *= -1;
                }
                if (ast.y - ast.radius < 0) {
                    ast.y = ast.radius;
                    ast.vy *= -1;
                } else if (ast.y + ast.radius > canvas.height) {
                    ast.y = canvas.height - ast.radius;
                    ast.vy *= -1;
                }
            }

            // 2. Update Ball Physics & Asteroid Collisions
            let newBallsToSpawn = [];

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = currentPlanet.gravity / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Asteroid Collision Detection & Spawning Logic
                for (const ast of asteroids) {
                    const adx = b.x - ast.x;
                    const ady = b.y - ast.y;
                    const adist = Math.sqrt(adx * adx + ady * ady);
                    const minDist = ast.radius + b.radius;

                    if (adist < minDist) {
                        // Collision normal vector
                        const nx = adx / (adist || 1);
                        const ny = ady / (adist || 1);

                        // Push ball outside asteroid radius to eliminate stickiness
                        const overlap = minDist - adist;
                        b.x += nx * overlap;
                        b.y += ny * overlap;

                        // Dot product of velocity with collision normal
                        const dot = b.vx * nx + b.vy * ny;

                        if (dot < 0) {
                            // Bounce original ball off asteroid normal surface
                            b.vx = b.vx - 2 * dot * nx;
                            b.vy = b.vy - 2 * dot * ny;

                            // Spawn a secondary ball bouncing off in a scattered angle
                            if (balls.length + newBallsToSpawn.length < MAX_BALLS) {
                                const currentSpeed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                                const bounceAngle = Math.atan2(b.vy, b.vx);
                                const scatterAngle = bounceAngle + (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 4 + Math.random() * Math.PI / 4);

                                newBallsToSpawn.push({
                                    x: b.x + nx * 4,
                                    y: b.y + ny * 4,
                                    vx: Math.cos(scatterAngle) * currentSpeed,
                                    vy: Math.sin(scatterAngle) * currentSpeed,
                                    radius: 4,
                                    trail: []
                                });
                            }
                        }
                    }
                }

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Append newly spawned collision balls
            if (newBallsToSpawn.length > 0) {
                balls.push(...newBallsToSpawn);
            }
        }

        function draw() {
            const currentPlanet = PLANETS[currentPlanetKey];

            // Clear canvas background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Asteroids
            ctx.strokeStyle = '#aaaaaa';
            ctx.fillStyle = '#1c1c1c';
            ctx.lineWidth = 1.5;

            for (const ast of asteroids) {
                ctx.save();
                ctx.translate(ast.x, ast.y);
                ctx.rotate(ast.rotAngle);

                ctx.beginPath();
                const step = (Math.PI * 2) / ast.numPoints;
                for (let p = 0; p < ast.numPoints; p++) {
                    const r = ast.radius * ast.offsets[p];
                    const px = Math.cos(p * step) * r;
                    const py = Math.sin(p * step) * r;
                    if (p === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // 2. Draw Central Planet Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = currentPlanet.color;
            ctx.fill();

            // Center mark on planet
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // 3. Draw Balls & Trails
            for (const b of balls) {
                // Draw path line
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                // Draw ball object
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
