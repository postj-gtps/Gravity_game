<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics Simulation - Team 5 (Wyld)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ffffff;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    input[type="range"] {
      cursor: pointer;
      accent-color: #ffffff;
      width: 110px;
    }

    #ball-counter {
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #cccccc;
    }

    .btn-action {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
    }

    .btn-action:hover {
      background: #ffffff;
      color: #000000;
    }

    .btn-action.active {
      background: #ffffff;
      color: #000000;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #000000;
      border: 1px solid #ffffff;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none; /* Prevents touchscreen panning/zooming on Chromebooks */
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #888888;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    
    <!-- Launch Speed Slider -->
    <div class="control-group">
      <label for="speed-slider">LAUNCH SPEED: <span id="speed-val">5</span></label>
      <input type="range" id="speed-slider" min="1" max="20" value="5" oninput="updateLaunchSpeed(this.value)">
    </div>

    <button id="bouncy-btn" class="btn-action" onclick="toggleBouncyWalls()">Bouncy Walls: OFF</button>
    <div id="ball-counter">Beyblades: 0 / 20</div>
    <button class="btn-action" onclick="resetSimulation()">Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Click or tap anywhere on the canvas to launch up to 20 Beyblades (1 launch per second limit).
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const ballCounterEl = document.getElementById('ball-counter');
    const bouncyBtnEl = document.getElementById('bouncy-btn');
    const speedValEl = document.getElementById('speed-val');

    // SIMULATION CONSTANTS
    const MAX_BALLS = 20; // Maximum active Beyblades on screen
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
    const TRAIL_LENGTH = 300; // Number of historic trail points stored
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const SPAM_COOLDOWN_MS = 1000; // 1-second spam-click filter

    // BEYBLADE PALETTE
    const BEYBLADE_COLORS = ['#FF3366', '#33CCFF', '#FFCC00', '#33FF66', '#CC33FF', '#FF9900'];

    // STATE VARIABLES
    let balls = [];
    let particles = []; // Spark particles for explosion effects
    let bouncyWalls = false;
    let launchVelocity = 5;
    let lastLaunchTime = 0;

    // Central Gravity Node Definition (Pikachu Sun)
    const centralNode = {
      x: 0,
      y: 0,
      radius: 24
    };

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Recenter gravity node dynamically
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Update Launch Speed from Slider
    function updateLaunchSpeed(val) {
      launchVelocity = parseFloat(val);
      speedValEl.textContent = val;
    }

    // Toggle Bouncy Walls Feature
    function toggleBouncyWalls() {
      bouncyWalls = !bouncyWalls;
      if (bouncyWalls) {
        bouncyBtnEl.textContent = 'Bouncy Walls: ON';
        bouncyBtnEl.classList.add('active');
      } else {
        bouncyBtnEl.textContent = 'Bouncy Walls: OFF';
        bouncyBtnEl.classList.remove('active');
      }
    }

    // Event Handler for both Touch and Mouse clicks
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      launchBall(clickX, clickY);
    });

    function launchBall(x, y) {
      const now = Date.now();
      
      // Spam-click filter (prevents adding more than 1x per second)
      if (now - lastLaunchTime < SPAM_COOLDOWN_MS) {
        return;
      }
      lastLaunchTime = now;

      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = launchVelocity * Math.sin(rad);
      const vy = -launchVelocity * Math.cos(rad);

      // Maintain up to 20 Beyblades (removes oldest if limit is reached)
      if (balls.length >= MAX_BALLS) {
        balls.shift();
      }

      balls.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 12, // Scaled for detailed Beyblade graphic
        angle: 0,
        spinSpeed: (Math.random() * 0.15 + 0.15) * (Math.random() < 0.5 ? 1 : -1),
        color: BEYBLADE_COLORS[Math.floor(Math.random() * BEYBLADE_COLORS.length)],
        bladeCount: 4 + Math.floor(Math.random() * 3), // 4, 5, or 6 blades
        trail: [] // Stores history of past {x, y} coordinates
      });
    }

    function resetSimulation() {
      balls = [];
      particles = [];
    }

    // Spawn particle explosion when Beyblades collide
    function createExplosion(x, y) {
      const numParticles = 16;
      const colors = ['#FFD700', '#FF5722', '#FF9800', '#FFFFFF', '#E91E63'];

      for (let i = 0; i < numParticles; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1.0 // Fade opacity from 1.0 down to 0
        });
      }
    }

    function updatePhysics() {
      // 1. Update Beyblade Positions & Gravity
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Spin animation update
        b.angle += b.spinSpeed;

        // Bouncy Walls vs Off-screen removal
        if (bouncyWalls) {
          if (b.x - b.radius < 0) {
            b.x = b.radius;
            b.vx *= -1;
          } else if (b.x + b.radius > canvas.width) {
            b.x = canvas.width - b.radius;
            b.vx *= -1;
          }

          if (b.y - b.radius < 0) {
            b.y = b.radius;
            b.vy *= -1;
          } else if (b.y + b.radius > canvas.height) {
            b.y = canvas.height - b.radius;
            b.vy *= -1;
          }
        } else {
          // Off-screen removal if bouncy walls are off
          const margin = 500;
          if (b.x < -margin || b.x > canvas.width + margin || 
              b.y < -margin || b.y > canvas.height + margin) {
            balls.splice(i, 1);
            continue;
          }
        }

        // Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: Beyblade collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        // Acceleration vector components
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Record position history for line trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }

      // 2. Beyblade Collision Detection
      const toRemove = new Set();
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const dx = balls[j].x - balls[i].x;
          const dy = balls[j].y - balls[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < balls[i].radius + balls[j].radius) {
            toRemove.add(i);
            toRemove.add(j);
            const explosionX = (balls[i].x + balls[j].x) / 2;
            const explosionY = (balls[i].y + balls[j].y) / 2;
            createExplosion(explosionX, explosionY);
          }
        }
      }

      // Remove colliding Beyblades (descending order)
      const sortedIndices = Array.from(toRemove).sort((a, b) => b - a);
      for (const index of sortedIndices) {
        balls.splice(index, 1);
      }

      // 3. Update Explosion Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03; // Fade rate

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // Renders Pikachu at central gravity node
    function drawPikachu(cx, cy, r) {
      // 1. Pointy Ears
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.5, cy - r * 0.5);
      ctx.lineTo(cx - r * 1.35, cy - r * 1.35);
      ctx.lineTo(cx - r * 0.1, cy - r * 0.8);
      ctx.closePath();
      ctx.fillStyle = '#FFDC00';
      ctx.fill();

      // Left Ear Black Tip
      ctx.beginPath();
      ctx.moveTo(cx - r * 1.35, cy - r * 1.35);
      ctx.lineTo(cx - r * 0.95, cy - r * 0.95);
      ctx.lineTo(cx - r * 0.65, cy - r * 1.15);
      ctx.closePath();
      ctx.fillStyle = '#222222';
      ctx.fill();

      // Right Ear Base
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.5, cy - r * 0.5);
      ctx.lineTo(cx + r * 1.35, cy - r * 1.35);
      ctx.lineTo(cx + r * 0.1, cy - r * 0.8);
      ctx.closePath();
      ctx.fillStyle = '#FFDC00';
      ctx.fill();

      // Right Ear Black Tip
      ctx.beginPath();
      ctx.moveTo(cx + r * 1.35, cy - r * 1.35);
      ctx.lineTo(cx + r * 0.95, cy - r * 0.95);
      ctx.lineTo(cx + r * 0.65, cy - r * 1.15);
      ctx.closePath();
      ctx.fillStyle = '#222222';
      ctx.fill();

      // 2. Yellow Head
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFDC00';
      ctx.fill();

      // 3. Red Cheeks
      const cheekR = r * 0.28;
      ctx.beginPath();
      ctx.arc(cx - r * 0.62, cy + r * 0.22, cheekR, 0, Math.PI * 2);
      ctx.fillStyle = '#E53935';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx + r * 0.62, cy + r * 0.22, cheekR, 0, Math.PI * 2);
      ctx.fillStyle = '#E53935';
      ctx.fill();

      // 4. Black Eyes & White Glint Highlights
      const eyeR = r * 0.18;
      ctx.beginPath();
      ctx.arc(cx - r * 0.38, cy - r * 0.15, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#222222';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx + r * 0.38, cy - r * 0.15, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#222222';
      ctx.fill();

      // White Highlights
      const shineR = r * 0.07;
      ctx.beginPath();
      ctx.arc(cx - r * 0.38, cy - r * 0.22, shineR, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.38, cy - r * 0.22, shineR, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // 5. Tiny Nose
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.06, cy + r * 0.05);
      ctx.lineTo(cx + r * 0.06, cy + r * 0.05);
      ctx.lineTo(cx, cy + r * 0.12);
      ctx.closePath();
      ctx.fillStyle = '#222222';
      ctx.fill();

      // 6. Smile Mouth
      ctx.beginPath();
      ctx.arc(cx - r * 0.12, cy + r * 0.22, r * 0.12, 0, Math.PI);
      ctx.arc(cx + r * 0.12, cy + r * 0.22, r * 0.12, 0, Math.PI);
      ctx.strokeStyle = '#222222';
      ctx.lineWidth = Math.max(1.5, r * 0.06);
      ctx.stroke();
    }

    // Custom Beyblade Graphic Renderer
    function drawBeyblade(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);

      const r = b.radius;

      // 1. Spiked Outer Blade Ring
      ctx.beginPath();
      const numBlades = b.bladeCount;
      for (let i = 0; i < numBlades * 2; i++) {
        const a = (i * Math.PI) / numBlades;
        const dist = (i % 2 === 0) ? r : r * 0.65;
        const bx = Math.cos(a) * dist;
        const by = Math.sin(a) * dist;
        if (i === 0) ctx.moveTo(bx, by);
        else ctx.lineTo(bx, by);
      }
      ctx.closePath();
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 2. Inner Metallic Ring
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#111111';
      ctx.fill();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1;
      ctx.stroke();

      // 3. Center Face Bolt (Hexagon)
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        const hx = Math.cos(a) * (r * 0.28);
        const hy = Math.sin(a) * (r * 0.28);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      // Update counter display
      ballCounterEl.textContent = `Beyblades: ${balls.length} / ${MAX_BALLS}`;

      // Clear canvas background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Pikachu Central Sun Node
      drawPikachu(centralNode.x, centralNode.y, centralNode.radius);

      // 2. Draw Beyblades & Trails
      for (const b of balls) {
        // Draw path line
        if (b.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let t = 1; t < b.trail.length; t++) {
            ctx.lineTo(b.trail[t].x, b.trail[t].y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        // Draw spinning Beyblade object
        drawBeyblade(b);
      }

      // 3. Draw Explosion Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
