<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Gravity Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #0d021a;
      color: #ff7518;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
      touch-action: none;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ff7518;
      box-shadow: 0 4px 12px rgba(255, 117, 24, 0.2);
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      color: #ff7518;
      text-shadow: 0 0 8px rgba(255, 117, 24, 0.6);
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #1a0933;
      color: #ff7518;
      border: 1px solid #ff7518;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      transition: all 0.15s ease-in-out;
    }

    .btn:hover {
      background: #ff7518;
      color: #0d021a;
      box-shadow: 0 0 10px #ff7518;
    }

    .btn-active {
      background: #39ff14;
      color: #0d021a;
      border-color: #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }

    .btn-active:hover {
      background: #2cd60f;
      color: #0d021a;
      border-color: #2cd60f;
      box-shadow: 0 0 12px #2cd60f;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #120024;
      border: 2px solid #ff7518;
      border-radius: 6px;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #b9a0e0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>🎃 Halloween Gravity Sim</h1>
    <div class="controls">
      <button id="toggle-bounce-btn" class="btn" onclick="toggleBouncyWalls()">Bouncy Walls: OFF</button>
      <button class="btn" onclick="resetSimulation()">Reset</button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click anywhere on the canvas to launch spooky orbiters (up to 40 on screen).
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const LAUNCH_VELOCITY = 5; // Fixed velocity on click
    const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
    const MAX_BALLS = 40; // Maximum active balls allowed on screen
    const MAX_NOTE_TRAIL = 25; // Maximum number of symbols stored in trail
    const NOTE_SPACING = 22; // Distance in pixels required between dropped trail symbols
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const SPOOKY_SYMBOLS = ['🎃', '👻', '🦇', '🕷️', '♫', '♩']; // Halloween trail symbols

    // STATE VARIABLES
    let balls = [];
    let bouncyWalls = false;

    // Central Gravity Node Definition
    const centralNode = {
      x: 0,
      y: 0,
      radius: 14
    };

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Recenter gravity node dynamically
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleBouncyWalls() {
      bouncyWalls = !bouncyWalls;
      const btn = document.getElementById('toggle-bounce-btn');
      if (bouncyWalls) {
        btn.innerText = 'Bouncy Walls: ON';
        btn.classList.add('btn-active');
      } else {
        btn.innerText = 'Bouncy Walls: OFF';
        btn.classList.remove('btn-active');
      }
    }

    // Launch Handler: Supports mouse click and touch inputs on Chromebooks
    function handleLaunch(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      launchBall(clickX, clickY);
    }

    canvas.addEventListener('pointerdown', handleLaunch);

    function launchBall(x, y) {
      // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = LAUNCH_VELOCITY * Math.sin(rad); // sin(90°) = 1 -> vx = 5
      const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0 -> vy = 0

      // If screen capacity (40 balls) is reached, remove the oldest ball (FIFO)
      if (balls.length >= MAX_BALLS) {
        balls.shift();
      }

      // Add the new ball to the simulation
      balls.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 5,
        trail: [{
          x: x,
          y: y,
          symbol: SPOOKY_SYMBOLS[0]
        }], // Stores history of spooky objects {x, y, symbol}
        lastNoteX: x,
        lastNoteY: y,
        noteIndex: 0
      });
    }

    function resetSimulation() {
      balls = [];
    }

    function updatePhysics() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: ball collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        // Acceleration vector components
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Bouncy Walls collision logic vs Off-screen removal
        if (bouncyWalls) {
          if (b.x - b.radius <= 0) {
            b.x = b.radius;
            b.vx = Math.abs(b.vx);
          } else if (b.x + b.radius >= canvas.width) {
            b.x = canvas.width - b.radius;
            b.vx = -Math.abs(b.vx);
          }

          if (b.y - b.radius <= 0) {
            b.y = b.radius;
            b.vy = Math.abs(b.vy);
          } else if (b.y + b.radius >= canvas.height) {
            b.y = canvas.height - b.radius;
            b.vy = -Math.abs(b.vy);
          }
        } else {
          // Remove ball if it travels too far off-screen (prevents memory leak)
          const margin = 500;
          if (b.x < -margin || b.x > canvas.width + margin || 
              b.y < -margin || b.y > canvas.height + margin) {
            balls.splice(i, 1);
            continue;
          }
        }

        // Calculate distance moved since last symbol was dropped
        const distSinceLastNote = Math.hypot(b.x - b.lastNoteX, b.y - b.lastNoteY);

        // Drop a new spooky symbol when distance threshold is reached
        if (distSinceLastNote >= NOTE_SPACING) {
          b.noteIndex = (b.noteIndex + 1) % SPOOKY_SYMBOLS.length;
          b.trail.push({
            x: b.x,
            y: b.y,
            symbol: SPOOKY_SYMBOLS[b.noteIndex]
          });

          b.lastNoteX = b.x;
          b.lastNoteY = b.y;

          if (b.trail.length > MAX_NOTE_TRAIL) {
            b.trail.shift();
          }
        }
      }
    }

    function draw() {
      // Clear canvas with deep Halloween purple background
      ctx.fillStyle = '#120024';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Central Gravity Mass (Glowing Pumpkin Node)
      ctx.save();
      ctx.shadowColor = '#ff7518';
      ctx.shadowBlur = 15;
      
      // Central orange glow circle
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff7518';
      ctx.fill();
      ctx.restore();

      // Pumpkin icon center mark
      ctx.fillStyle = '#120024';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎃', centralNode.x, centralNode.y);

      // 2. Draw Balls & Spooky Trails
      for (const b of balls) {
        // Draw spooky symbols behind the ball
        for (let t = 0; t < b.trail.length; t++) {
          const note = b.trail[t];
          const alpha = (t + 1) / b.trail.length;
          
          ctx.font = '14px "Courier New", monospace, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = `rgba(255, 183, 3, ${alpha.toFixed(2)})`;
          ctx.fillText(note.symbol, note.x, note.y);
        }

        // Draw active ball object with neon green glow
        ctx.save();
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#39ff14';
        ctx.fill();
        ctx.restore();
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
