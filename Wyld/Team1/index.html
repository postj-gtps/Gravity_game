<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wyld / Team 1 - Gravity Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0d1b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 1366px;
      height: 100%;
      max-height: 768px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1a1c38 0%, #080914 100%);
      touch-action: none;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-title {
      font-size: 20px;
      font-weight: bold;
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }
    .hud-info {
      font-size: 14px;
      color: #a0aec0;
    }
    .cooldown-bar-container {
      width: 180px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00d2ff;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .cooldown-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ff88);
      transition: width 0.05s linear;
    }
    .controls {
      position: absolute;
      bottom: 15px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    button {
      background: #2d3748;
      color: #ffffff;
      border: 1px solid #4a5568;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #4a5568;
      border-color: #00d2ff;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div class="hud">
      <div class="hud-title">🚀 Stitch Gravity Sim</div>
      <div class="hud-info">Tap or click to launch space rocks!</div>
      <div class="hud-info" id="ballCount">Balls active: 0</div>
      <div class="hud-info" id="cooldownText">Status: Ready</div>
      <div class="cooldown-bar-container">
        <div id="cooldownBar" class="cooldown-bar"></div>
      </div>
    </div>

    <div class="controls">
      <button id="resetBtn">Clear Space Rocks</button>
    </div>

    <canvas id="simCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const ballCountEl = document.getElementById('ballCount');
    const cooldownTextEl = document.getElementById('cooldownText');
    const cooldownBarEl = document.getElementById('cooldownBar');
    const resetBtn = document.getElementById('resetBtn');

    // Canvas internal resolution setup (1366x768 native target)
    const WIDTH = 1366;
    const HEIGHT = 768;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // Simulation Constants
    const G = 9000; // Gravitational constant
    const STITCH_RADIUS = 75;
    const PORTAL_RADIUS = 60;
    const SPAWN_COOLDOWN_MS = 1000; // 1-second spam click filter

    let lastSpawnTime = 0;
    let balls = [];
    let portalSparkles = [];

    // Central Planet Location
    const stitchCenter = { x: WIDTH / 2, y: HEIGHT / 2 };

    // Corner Portals setup
    // Pair map: 0 <-> 3 (Top-Left <-> Bottom-Right), 1 <-> 2 (Top-Right <-> Bottom-Left)
    const portals = [
      { id: 0, name: 'TL', x: 65, y: 65, targetIndex: 3, color: '#ff007f' },
      { id: 1, name: 'TR', x: WIDTH - 65, y: 65, targetIndex: 2, color: '#00f0ff' },
      { id: 2, name: 'BL', x: 65, y: HEIGHT - 65, targetIndex: 1, color: '#00f0ff' },
      { id: 3, name: 'BR', x: WIDTH - 65, y: HEIGHT - 65, targetIndex: 0, color: '#ff007f' }
    ];

    // Background Stars
    const bgStars = Array.from({ length: 120 }, () => ({
      x: Math.random() * WIDTH,
      y: Math.random() * HEIGHT,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.8 + 0.2
    }));

    class Ball {
      constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = 10 + Math.random() * 6;
        this.color = `hsl(${Math.random() * 360}, 85%, 65%)`;
        this.portalCooldown = 0; // Frames before re-entering portal
        this.trail = [];
      }

      update() {
        if (this.portalCooldown > 0) this.portalCooldown--;

        // Gravity math towards Stitch
        const dx = stitchCenter.x - this.x;
        const dy = stitchCenter.y - this.y;
        const distSq = Math.max(dx * dx + dy * dy, 1200);
        const dist = Math.sqrt(distSq);

        const force = G / distSq;
        const ax = (dx / dist) * force;
        const ay = (dy / dist) * force;

        this.vx += ax;
        this.vy += ay;

        this.x += this.vx;
        this.y += this.vy;

        // Save trail points
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 12) this.trail.shift();

        // Stitch planet collision (bounce off soft center)
        if (dist < STITCH_RADIUS + this.radius) {
          const overlap = (STITCH_RADIUS + this.radius) - dist;
          const nx = dx / dist;
          const ny = dy / dist;

          this.x -= nx * overlap;
          this.y -= ny * overlap;

          // Elastic bounce back
          const dot = this.vx * nx + this.vy * ny;
          this.vx = (this.vx - 1.6 * dot * nx) * 0.85;
          this.vy = (this.vy - 1.6 * dot * ny) * 0.85;
        }

        // Check Portals
        if (this.portalCooldown <= 0) {
          for (let p of portals) {
            const pdx = this.x - p.x;
            const pdy = this.y - p.y;
            const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

            if (pDist < PORTAL_RADIUS) {
              this.teleport(p);
              break;
            }
          }
        }
      }

      teleport(fromPortal) {
        const destPortal = portals[fromPortal.targetIndex];

        // Burst effect at entrance portal
        createSparkleBurst(fromPortal.x, fromPortal.y, fromPortal.color, 25);

        // Calculate direction towards screen center from target portal
        const toCenterX = stitchCenter.x - destPortal.x;
        const toCenterY = stitchCenter.y - destPortal.y;
        const cDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
        const dirX = toCenterX / cDist;
        const dirY = toCenterY / cDist;

        // Exit at destination portal, shifted slightly outward
        this.x = destPortal.x + dirX * (PORTAL_RADIUS + 15);
        this.y = destPortal.y + dirY * (PORTAL_RADIUS + 15);

        // Re-orient velocity inward with a nice speed kick
        const speed = Math.max(Math.sqrt(this.vx * this.vx + this.vy * this.vy), 4);
        this.vx = dirX * speed * 1.1;
        this.vy = dirY * speed * 1.1;

        this.portalCooldown = 30; // 30 frames cooldown to avoid immediate loop
        this.trail = [];

        // Burst effect at exit portal
        createSparkleBurst(destPortal.x, destPortal.y, destPortal.color, 25);
      }

      draw() {
        // Draw orbital trail
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          const alpha = (i + 1) / this.trail.length * 0.4;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, this.radius * (i / this.trail.length), 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = alpha;
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Draw main body
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Portal Sparkle Particles
    function createSparkleBurst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        portalSparkles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: color,
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function updateSparkles() {
      // Spawn ambient portal sparkles continuously
      portals.forEach(p => {
        if (Math.random() < 0.6) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * PORTAL_RADIUS;
          portalSparkles.push({
            x: p.x + Math.cos(angle) * r,
            y: p.y + Math.sin(angle) * r,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5 - 1,
            size: Math.random() * 3 + 1,
            color: p.color,
            life: 1.0,
            decay: Math.random() * 0.04 + 0.02
          });
        }
      });

      for (let i = portalSparkles.length - 1; i >= 0; i--) {
        const sp = portalSparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.life -= sp.decay;
        if (sp.life <= 0) {
          portalSparkles.splice(i, 1);
        }
      }
    }

    function drawSparkles() {
      portalSparkles.forEach(sp => {
        ctx.save();
        ctx.globalAlpha = Math.max(sp.life, 0);
        ctx.fillStyle = sp.color;
        ctx.shadowColor = sp.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Draw Central Stitch Planet
    function drawStitchPlanet(cx, cy, radius) {
      ctx.save();

      // Stitch Colors
      const blueFur = '#2b6cb0';
      const darkBlueFur = '#1a365d';
      const lightBluePatch = '#90cdf4';
      const innerEarPink = '#ed64a6';
      const eyeColor = '#10141e';
      const noseColor = '#1a202c';

      // Outer Gravitational Glow
      const glow = ctx.createRadialGradient(cx, cy, radius * 0.7, cx, cy, radius * 1.4);
      glow.addColorStop(0, 'rgba(66, 153, 225, 0.4)');
      glow.addColorStop(1, 'rgba(66, 153, 225, 0)');
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 1.4, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // LEFT EAR
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-Math.PI / 4);

      // Outer Left Ear
      ctx.beginPath();
      ctx.moveTo(-15, -radius * 0.5);
      ctx.quadraticCurveTo(-radius * 1.5, -radius * 1.4, -radius * 1.7, -radius * 0.4);
      // Ear Notch detail
      ctx.lineTo(-radius * 1.4, -radius * 0.2);
      ctx.lineTo(-radius * 1.5, -radius * 0.05);
      ctx.quadraticCurveTo(-radius * 1.1, radius * 0.3, -20, radius * 0.5);
      ctx.fillStyle = blueFur;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = darkBlueFur;
      ctx.stroke();

      // Inner Left Ear Pink Patch
      ctx.beginPath();
      ctx.moveTo(-20, -radius * 0.4);
      ctx.quadraticCurveTo(-radius * 1.3, -radius * 1.1, -radius * 1.4, -radius * 0.4);
      ctx.quadraticCurveTo(-radius * 0.9, radius * 0.2, -22, radius * 0.3);
      ctx.fillStyle = innerEarPink;
      ctx.fill();
      ctx.restore();

      // RIGHT EAR
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);

      // Outer Right Ear
      ctx.beginPath();
      ctx.moveTo(15, -radius * 0.5);
      ctx.quadraticCurveTo(radius * 1.5, -radius * 1.4, radius * 1.7, -radius * 0.4);
      ctx.quadraticCurveTo(radius * 1.1, radius * 0.3, 20, radius * 0.5);
      ctx.fillStyle = blueFur;
      ctx.fill();
      ctx.strokeStyle = darkBlueFur;
      ctx.stroke();

      // Inner Right Ear Pink Patch
      ctx.beginPath();
      ctx.moveTo(20, -radius * 0.4);
      ctx.quadraticCurveTo(radius * 1.3, -radius * 1.1, radius * 1.4, -radius * 0.4);
      ctx.quadraticCurveTo(radius * 0.9, radius * 0.2, 22, radius * 0.3);
      ctx.fillStyle = innerEarPink;
      ctx.fill();
      ctx.restore();

      // HEAD BASE
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = blueFur;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = darkBlueFur;
      ctx.stroke();

      // LIGHT BLUE EYE & MUZZLE PATCHES
      // Left Eye Light Patch
      ctx.beginPath();
      ctx.ellipse(cx - 28, cy - 12, 24, 30, -Math.PI / 8, 0, Math.PI * 2);
      ctx.fillStyle = lightBluePatch;
      ctx.fill();

      // Right Eye Light Patch
      ctx.beginPath();
      ctx.ellipse(cx + 28, cy - 12, 24, 30, Math.PI / 8, 0, Math.PI * 2);
      ctx.fillStyle = lightBluePatch;
      ctx.fill();

      // Muzzle Light Patch
      ctx.beginPath();
      ctx.ellipse(cx, cy + 22, 32, 22, 0, 0, Math.PI * 2);
      ctx.fillStyle = lightBluePatch;
      ctx.fill();

      // EYES
      // Left Eye
      ctx.beginPath();
      ctx.ellipse(cx - 26, cy - 10, 16, 22, -Math.PI / 10, 0, Math.PI * 2);
      ctx.fillStyle = eyeColor;
      ctx.fill();
      // Right Eye
      ctx.beginPath();
      ctx.ellipse(cx + 26, cy - 10, 16, 22, Math.PI / 10, 0, Math.PI * 2);
      ctx.fillStyle = eyeColor;
      ctx.fill();

      // Eye Highlights (Shiny Alien Eyes)
      ctx.beginPath();
      ctx.arc(cx - 22, cy - 18, 6, 0, Math.PI * 2);
      ctx.arc(cx + 30, cy - 18, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx - 30, cy - 6, 3, 0, Math.PI * 2);
      ctx.arc(cx + 22, cy - 6, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // NOSE
      ctx.beginPath();
      ctx.ellipse(cx, cy + 8, 16, 11, 0, 0, Math.PI * 2);
      ctx.fillStyle = noseColor;
      ctx.fill();

      // Nose Shine
      ctx.beginPath();
      ctx.ellipse(cx - 3, cy + 5, 5, 3, -Math.PI / 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fill();

      // MOUTH / SMILE
      ctx.beginPath();
      ctx.arc(cx, cy + 18, 22, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = darkBlueFur;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Little Stitch Tuft Hair on Top
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - radius + 2);
      ctx.quadraticCurveTo(cx - 4, cy - radius - 18, cx + 4, cy - radius - 12);
      ctx.quadraticCurveTo(cx + 8, cy - radius - 20, cx + 12, cy - radius + 2);
      ctx.fillStyle = blueFur;
      ctx.fill();

      ctx.restore();
    }

    // Draw Corner Portals
    function drawPortals() {
      const time = Date.now() * 0.003;

      portals.forEach((p, idx) => {
        ctx.save();
        ctx.translate(p.x, p.y);

        // Rotating Portal Rings
        ctx.rotate(idx % 2 === 0 ? time : -time);

        // Outer Glow
        const pGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, PORTAL_RADIUS + 15);
        pGlow.addColorStop(0, p.color);
        pGlow.addColorStop(0.7, 'rgba(0, 0, 0, 0.2)');
        pGlow.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(0, 0, PORTAL_RADIUS + 15, 0, Math.PI * 2);
        ctx.fillStyle = pGlow;
        ctx.fill();

        // Sparkly Swirl Ring
        ctx.beginPath();
        ctx.arc(0, 0, PORTAL_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 5;
        ctx.setLineDash([12, 8, 4, 8]);
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;
        ctx.stroke();

        // Center Black Hole
        ctx.beginPath();
        ctx.arc(0, 0, PORTAL_RADIUS * 0.65, 0, Math.PI * 2);
        ctx.fillStyle = '#05060d';
        ctx.fill();

        ctx.restore();
      });
    }

    // Spam-Click Rate Limiter Logic
    function handleSpawn(clientX, clientY) {
      const now = Date.now();
      const elapsed = now - lastSpawnTime;

      // Spam-click check (Max 1 ball per second)
      if (elapsed < SPAWN_COOLDOWN_MS) {
        return;
      }

      // Calculate canvas coordinates
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;

      const spawnX = (clientX - rect.left) * scaleX;
      const spawnY = (clientY - rect.top) * scaleY;

      // Don't spawn directly inside Stitch
      const distToStitch = Math.hypot(spawnX - stitchCenter.x, spawnY - stitchCenter.y);
      if (distToStitch < STITCH_RADIUS + 20) return;

      // Initial orbital velocity boost perpendicular to center
      const dx = stitchCenter.x - spawnX;
      const dy = stitchCenter.y - spawnY;
      const angle = Math.atan2(dy, dx) + Math.PI / 2; // 90 degree tangent angle
      const initialSpeed = 4.5;

      const vx = Math.cos(angle) * initialSpeed;
      const vy = Math.sin(angle) * initialSpeed;

      balls.push(new Ball(spawnX, spawnY, vx, vy));
      lastSpawnTime = now;
    }

    // Event Listeners (Mouse + Touch support for Chromebooks)
    canvas.addEventListener('mousedown', (e) => {
      handleSpawn(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handleSpawn(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    resetBtn.addEventListener('click', () => {
      balls = [];
    });

    // Update HUD Cooldown Display
    function updateHUD() {
      ballCountEl.textContent = `Balls active: ${balls.length}`;
      const elapsed = Date.now() - lastSpawnTime;

      if (elapsed >= SPAWN_COOLDOWN_MS) {
        cooldownTextEl.textContent = 'Status: Ready to Launch!';
        cooldownTextEl.style.color = '#00ff88';
        cooldownBarEl.style.width = '100%';
        cooldownBarEl.style.background = 'linear-gradient(90deg, #00d2ff, #00ff88)';
      } else {
        const remaining = Math.ceil((SPAWN_COOLDOWN_MS - elapsed) / 100) / 10;
        const progress = (elapsed / SPAWN_COOLDOWN_MS) * 100;
        cooldownTextEl.textContent = `Status: Cooling down (${remaining.toFixed(1)}s)`;
        cooldownTextEl.style.color = '#ff9900';
        cooldownBarEl.style.width = `${progress}%`;
        cooldownBarEl.style.background = '#ff9900';
      }
    }

    // Main Simulation Loop
    function animate() {
      // Clear background
      ctx.fillStyle = '#0b0d1b';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Draw background stars
      bgStars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Corner Portals
      drawPortals();

      // Update & Draw Sparkles
      updateSparkles();
      drawSparkles();

      // Draw Central Stitch Planet
      drawStitchPlanet(stitchCenter.x, stitchCenter.y, STITCH_RADIUS);

      // Update & Draw Balls
      balls.forEach(ball => {
        ball.update();
        ball.draw();
      });

      // Update HUD Status
      updateHUD();

      requestAnimationFrame(animate);
    }

    // Start Simulation
    animate();
  </script>
</body>
</html>
