<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics Baseline</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
      touch-action: none;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ffffff;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-reset {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
    }

    .btn-reset:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #000000;
      border: 1px solid #ffffff;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #888888;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click anywhere on the canvas to launch balls (up to 40 on screen).
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const LAUNCH_VELOCITY = 5; // Fixed velocity on click
    const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
    const MAX_BALLS = 40; // Maximum active balls allowed on screen
    const MAX_NOTE_TRAIL = 25; // Maximum number of music notes stored in trail
    const NOTE_SPACING = 22; // Distance in pixels required between dropped notes
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const MUSIC_NOTES = ['♪', '♫', '♩', '♬']; // Note symbols to cycle through

    // STATE VARIABLES
    let balls = [];

    // Central Gravity Node Definition
    const centralNode = {
      x: 0,
      y: 0,
      radius: 12
    };

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Recenter gravity node dynamically
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Launch Handler: Supports mouse click and touch inputs on Chromebooks
    function handleLaunch(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      launchBall(clickX, clickY);
    }

    canvas.addEventListener('pointerdown', handleLaunch);

    function launchBall(x, y) {
      // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = LAUNCH_VELOCITY * Math.sin(rad); // sin(90°) = 1 -> vx = 5
      const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0 -> vy = 0

      // If screen capacity (40 balls) is reached, remove the oldest ball (FIFO)
      if (balls.length >= MAX_BALLS) {
        balls.shift();
      }

      // Add the new ball to the simulation
      balls.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 4,
        trail: [{
          x: x,
          y: y,
          symbol: MUSIC_NOTES[0]
        }], // Stores history of music note objects {x, y, symbol}
        lastNoteX: x,
        lastNoteY: y,
        noteIndex: 0
      });
    }

    function resetSimulation() {
      balls = [];
    }

    function updatePhysics() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Remove ball if it travels too far off-screen (prevents memory leak)
        const margin = 500;
        if (b.x < -margin || b.x > canvas.width + margin || 
            b.y < -margin || b.y > canvas.height + margin) {
          balls.splice(i, 1);
          continue;
        }

        // Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: ball collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        // Acceleration vector components
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Calculate distance moved since last music note was dropped
        const distSinceLastNote = Math.hypot(b.x - b.lastNoteX, b.y - b.lastNoteY);

        // Drop a new musical note when distance threshold is reached
        if (distSinceLastNote >= NOTE_SPACING) {
          b.noteIndex = (b.noteIndex + 1) % MUSIC_NOTES.length;
          b.trail.push({
            x: b.x,
            y: b.y,
            symbol: MUSIC_NOTES[b.noteIndex]
          });

          b.lastNoteX = b.x;
          b.lastNoteY = b.y;

          if (b.trail.length > MAX_NOTE_TRAIL) {
            b.trail.shift();
          }
        }
      }
    }

    function draw() {
      // Clear canvas background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Central Mass Node
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Center mark on node
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // 2. Draw Ball & Musical Note Trail
      for (const b of balls) {
        // Draw music notes behind the ball
        for (let t = 0; t < b.trail.length; t++) {
          const note = b.trail[t];
          // Calculate opacity fade based on position in trail history (older = fainter)
          const alpha = (t + 1) / b.trail.length;
          
          ctx.font = '16px "Courier New", monospace, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.fillText(note.symbol, note.x, note.y);
        }

        // Draw active ball object
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
