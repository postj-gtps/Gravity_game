<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics - 360° Launch & Portals</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ffffff;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .header-controls {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
    }

    .btn-action:hover, .btn-action.active {
      background: #ffffff;
      color: #000000;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #000000;
      border: 1px solid #ffffff;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #888888;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    <div class="header-controls">
      <button id="wallsToggleBtn" class="btn-action" onclick="toggleBouncyWalls()">Walls: OFF</button>
      <button class="btn-action" onclick="resetSimulation()">Reset</button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Click anywhere to launch 10 balls (1s cooldown). Corner portals teleport balls to random exits!
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const LAUNCH_VELOCITY = 5; // Fixed launch velocity
    const BALL_COUNT = 10; // Number of balls launched per click
    const ANGLE_STEP = 360 / BALL_COUNT; // Equal spacing across 360 degrees (36°)
    const TRAIL_LENGTH = 300; // Historic trail points stored per ball
    const SOFTENING_FACTOR = 400; // Prevents extreme velocity near center
    const PORTAL_RADIUS = 45; // Size of corner portals
    const SPAM_COOLDOWN_MS = 1000; // Spam-click filter: 1 launch per second

    // STATE VARIABLES
    let balls = [];
    let sparkles = [];
    let portals = [];
    let bouncyWallsEnabled = false;
    let lastLaunchTime = 0;

    // Central Gravity Node Definition
    const centralNode = {
      x: 0,
      y: 0,
      radius: 12
    };

    function updatePortalPositions() {
      // Define 4 corner portals and their inward launch directions
      portals = [
        { id: 0, x: 0, y: 0, launchAngle: Math.PI / 4 },                      // Top-Left (45°)
        { id: 1, x: canvas.width, y: 0, launchAngle: (3 * Math.PI) / 4 },       // Top-Right (135°)
        { id: 2, x: canvas.width, y: canvas.height, launchAngle: (5 * Math.PI) / 4 }, // Bottom-Right (225°)
        { id: 3, x: 0, y: canvas.height, launchAngle: (7 * Math.PI) / 4 }      // Bottom-Left (315°)
      ];
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Recenter gravity node dynamically
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;

      // Recalculate portal corner coordinates
      updatePortalPositions();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Toggle Bouncy Walls state & UI button
    function toggleBouncyWalls() {
      bouncyWallsEnabled = !bouncyWallsEnabled;
      const btn = document.getElementById('wallsToggleBtn');
      btn.textContent = `Walls: ${bouncyWallsEnabled ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', bouncyWallsEnabled);
    }

    // Canvas Click Handler with Spam-Click Filter
    canvas.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastLaunchTime < SPAM_COOLDOWN_MS) {
        return; // Filter clicks faster than 1 per second
      }
      lastLaunchTime = now;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      launchBalls(clickX, clickY);
    });

    function launchBalls(x, y) {
      balls = [];

      for (let i = 0; i < BALL_COUNT; i++) {
        const angleDegrees = i * ANGLE_STEP;
        const rad = (angleDegrees * Math.PI) / 180;
        
        const vx = LAUNCH_VELOCITY * Math.sin(rad);
        const vy = -LAUNCH_VELOCITY * Math.cos(rad);

        balls.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          radius: 4,
          trail: []
        });
      }
    }

    function resetSimulation() {
      balls = [];
      sparkles = [];
    }

    function triggerSparkleBurst(x, y) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        sparkles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function updatePhysics() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // 1. Portal Collision Check
        let hitPortal = false;
        for (let pIdx = 0; pIdx < portals.length; pIdx++) {
          const portal = portals[pIdx];
          const pdx = b.x - portal.x;
          const pdy = b.y - portal.y;
          const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

          if (pDist < PORTAL_RADIUS) {
            hitPortal = true;
            // Sparkles at entrance portal
            triggerSparkleBurst(b.x, b.y);

            // Pick a DIFFERENT portal randomly
            const otherPortals = portals.filter(p => p.id !== portal.id);
            const exitPortal = otherPortals[Math.floor(Math.random() * otherPortals.length)];

            // Retain velocity magnitude, ensure minimum speed
            let speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            if (speed < 4) speed = 4;

            // Add slight random spread (+/- 25 degrees) around the inward launch angle
            const angleSpread = (Math.random() - 0.5) * (Math.PI / 3.6);
            const exitAngle = exitPortal.launchAngle + angleSpread;

            // Spawn ball just outside exit portal radius to prevent infinite loops
            const spawnDist = PORTAL_RADIUS + b.radius + 6;
            b.x = exitPortal.x + Math.cos(exitAngle) * spawnDist;
            b.y = exitPortal.y + Math.sin(exitAngle) * spawnDist;

            // Assign new velocity vector pointing into the canvas
            b.vx = Math.cos(exitAngle) * speed;
            b.vy = Math.sin(exitAngle) * speed;

            // Reset trail history to avoid line stretching across canvas
            b.trail = [];

            // Sparkles at exit portal
            triggerSparkleBurst(b.x, b.y);
            break;
          }
        }

        if (hitPortal) continue;

        // 2. Wall Bouncing or Off-screen Cleanup
        if (bouncyWallsEnabled) {
          if (b.x - b.radius < 0) {
            b.x = b.radius;
            b.vx = -b.vx;
          }
          if (b.x + b.radius > canvas.width) {
            b.x = canvas.width - b.radius;
            b.vx = -b.vx;
          }
          if (b.y - b.radius < 0) {
            b.y = b.radius;
            b.vy = -b.vy;
          }
          if (b.y + b.radius > canvas.height) {
            b.y = canvas.height - b.radius;
            b.vy = -b.vy;
          }
        } else {
          const margin = 500;
          if (b.x < -margin || b.x > canvas.width + margin || 
              b.y < -margin || b.y > canvas.height + margin) {
            balls.splice(i, 1);
            continue;
          }
        }

        // 3. Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: ball collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Record position history
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }
    }

    function updateSparkles() {
      // Emit ambient sparkles around portals every frame
      for (const portal of portals) {
        if (Math.random() < 0.5) {
          const offsetAngle = portal.launchAngle + (Math.random() - 0.5) * (Math.PI / 2);
          const r = Math.random() * PORTAL_RADIUS;
          sparkles.push({
            x: portal.x + Math.cos(offsetAngle) * r,
            y: portal.y + Math.sin(offsetAngle) * r,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            size: Math.random() * 2 + 1,
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015
          });
        }
      }

      // Update sparkle life & positions
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= s.decay;

        if (s.alpha <= 0) {
          sparkles.splice(i, 1);
        }
      }
    }

    function draw() {
      // Clear canvas background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Corner Portals
      for (const portal of portals) {
        ctx.beginPath();
        ctx.arc(portal.x, portal.y, PORTAL_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(portal.x, portal.y, PORTAL_RADIUS * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = '#555555';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // 2. Draw Sparkles around Portals
      for (const s of sparkles) {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. Draw Central Mass Node
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // 4. Draw Balls & Trails
      for (const b of balls) {
        if (b.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let t = 1; t < b.trail.length; t++) {
            ctx.lineTo(b.trail[t].x, b.trail[t].y);
          }
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }

    function animate() {
      updatePhysics();
      updateSparkles();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
