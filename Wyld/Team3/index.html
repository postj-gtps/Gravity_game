<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics - Space Rockets & Space Kitties Edition</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #000000;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 1px solid rgba(255, 255, 255, 0.3);
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 }

 .btn-reset {
 background: rgba(255, 255, 255, 0.05);
 color: #ffffff;
 border: 1px solid rgba(255, 255, 255, 0.6);
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 border-radius: 4px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #000000;
 border: 1px solid rgba(255, 255, 255, 0.2);
 border-radius: 6px;
 display: block;
 cursor: crosshair;
 width: 100%;
 height: 100%;
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #aaaaaa;
 text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Gravity Simulation</h1>
 <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 Click or touch to launch a colorful rocket (max 1 launch/sec). Rockets bounce off floating space kitties!
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // Offscreen canvas for rendering space background smoothly on Chromebooks
 const bgCanvas = document.createElement('canvas');
 const bgCtx = bgCanvas.getContext('2d');

 // SIMULATION CONSTANTS
 const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
 const LAUNCH_VELOCITY = 5; // Fixed velocity on click
 const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
 const TRAIL_LENGTH = 300; // Number of historic trail points stored
 const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
 const MAX_BALLS = 20; // Maximum number of concurrent rockets allowed
 const LAUNCH_COOLDOWN_MS = 1000; // Baseline requirement: 1-second spam-click filter

 // COLOR PALETTE FOR ROCKET SHIPS
 const ROCKET_PALETTE = [
 '#ff2a6d', '#05ffa1', '#00f5d4', '#f15bb5', '#fee440', 
 '#9b5de5', '#ff9f1c', '#7000ff', '#00bbf9', '#ff3366'
 ];

 // STATE VARIABLES
 let balls = []; // Holds rocket ships
 let spaceKitties = [];
 let lastLaunchTime = 0;

 // Central Gravity Node Definition
 const centralNode = {
 x: 0,
 y: 0,
 radius: 14
 };

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 // Recenter gravity node dynamically
 centralNode.x = canvas.width / 2;
 centralNode.y = canvas.height / 2;

 // Re-generate procedural space background for current screen resolution
 generateSpaceBackground();

 // Initialize or re-position floating space kitties
 if (spaceKitties.length === 0) {
 initSpaceKitties();
 }
 }

 function initSpaceKitties() {
 spaceKitties = [];
 const numKitties = 7;
 const colors = ['#f97316', '#e2e8f0', '#fbbf24', '#f472b6', '#a855f7', '#38bdf8'];
 
 for (let i = 0; i < numKitties; i++) {
 spaceKitties.push({
 x: Math.random() * (canvas.width - 100) + 50,
 y: Math.random() * (canvas.height - 100) + 50,
 vx: (Math.random() - 0.5) * 1.5,
 vy: (Math.random() - 0.5) * 1.5,
 radius: 18,
 angle: Math.random() * Math.PI * 2,
 spinSpeed: (Math.random() - 0.5) * 0.02,
 furColor: colors[i % colors.length]
 });
 }
 }

 function generateSpaceBackground() {
 bgCanvas.width = canvas.width;
 bgCanvas.height = canvas.height;

 // 1. Deep Space Base
 bgCtx.fillStyle = '#020208';
 bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

 // 2. Multi-colored Glowing Nebulae
 const nebulae = [
 { x: bgCanvas.width * 0.2, y: bgCanvas.height * 0.3, r: bgCanvas.width * 0.4, color: 'rgba(138, 43, 226, 0.18)' },
 { x: bgCanvas.width * 0.8, y: bgCanvas.height * 0.7, r: bgCanvas.width * 0.35, color: 'rgba(0, 191, 255, 0.15)' },
 { x: bgCanvas.width * 0.5, y: bgCanvas.height * 0.8, r: bgCanvas.width * 0.3, color: 'rgba(255, 20, 147, 0.12)' },
 { x: bgCanvas.width * 0.85, y: bgCanvas.height * 0.2, r: bgCanvas.width * 0.25, color: 'rgba(75, 0, 130, 0.2)' }
 ];

 nebulae.forEach(n => {
 const grad = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
 grad.addColorStop(0, n.color);
 grad.addColorStop(0.6, n.color.replace(/[\d\.]+\)$/, '0.05)'));
 grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
 bgCtx.fillStyle = grad;
 bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
 });

 // 3. Dense Starfield
 const numStars = Math.floor((bgCanvas.width * bgCanvas.height) / 2800);
 const colors = ['#ffffff', '#e0f7fa', '#fff9c4', '#ffe0b2', '#f3e5f5'];

 for (let i = 0; i < numStars; i++) {
 const sx = Math.random() * bgCanvas.width;
 const sy = Math.random() * bgCanvas.height;
 const size = Math.random() < 0.88 ? (Math.random() * 1.1 + 0.3) : (Math.random() * 1.8 + 1.2);
 const alpha = Math.random() * 0.7 + 0.3;
 const starColor = colors[Math.floor(Math.random() * colors.length)];

 bgCtx.save();
 bgCtx.globalAlpha = alpha;
 bgCtx.fillStyle = starColor;
 bgCtx.beginPath();
 bgCtx.arc(sx, sy, size, 0, Math.PI * 2);
 bgCtx.fill();

 if (size > 2.0) {
 bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
 bgCtx.lineWidth = 0.5;
 bgCtx.beginPath();
 bgCtx.moveTo(sx - size * 2.5, sy);
 bgCtx.lineTo(sx + size * 2.5, sy);
 bgCtx.moveTo(sx, sy - size * 2.5);
 bgCtx.lineTo(sx, sy + size * 2.5);
 bgCtx.stroke();
 }
 bgCtx.restore();
 }

 // 4. Distant Galaxies
 drawDistantGalaxy(bgCtx, bgCanvas.width * 0.16, bgCanvas.height * 0.22, 40, 0.65, '#c084fc', '#38bdf8');
 drawDistantGalaxy(bgCtx, bgCanvas.width * 0.82, bgCanvas.height * 0.78, -35, 0.5, '#f472b6', '#818cf8');

 // 5. Distant Background Planets
 drawBackgroundPlanet(bgCtx, bgCanvas.width * 0.86, bgCanvas.height * 0.22, 20, '#38bdf8', '#1e3a8a', true);
 drawBackgroundPlanet(bgCtx, bgCanvas.width * 0.11, bgCanvas.height * 0.8, 14, '#f97316', '#7c2d12', false);

 // 6. Cow Jumping Over the Moon
 drawCowAndMoon(bgCtx, bgCanvas.width * 0.22, bgCanvas.height * 0.28);
 }

 function drawCowAndMoon(gCtx, x, y) {
 gCtx.save();
 
 const moonRadius = 32;
 const moonGlow = gCtx.createRadialGradient(x, y, moonRadius * 0.8, x, y, moonRadius * 1.8);
 moonGlow.addColorStop(0, 'rgba(254, 243, 199, 0.35)');
 moonGlow.addColorStop(1, 'rgba(254, 243, 199, 0)');
 
 gCtx.beginPath();
 gCtx.arc(x, y, moonRadius * 1.8, 0, Math.PI * 2);
 gCtx.fillStyle = moonGlow;
 gCtx.fill();

 const moonGrad = gCtx.createRadialGradient(x - 8, y - 8, 4, x, y, moonRadius);
 moonGrad.addColorStop(0, '#fffbeb');
 moonGrad.addColorStop(0.7, '#fde68a');
 moonGrad.addColorStop(1, '#d97706');

 gCtx.beginPath();
 gCtx.arc(x, y, moonRadius, 0, Math.PI * 2);
 gCtx.fillStyle = moonGrad;
 gCtx.fill();

 gCtx.fillStyle = 'rgba(180, 83, 9, 0.18)';
 const craters = [
 { cx: x - 10, cy: y - 6, r: 6 },
 { cx: x + 8, cy: y + 10, r: 8 },
 { cx: x + 12, cy: y - 10, r: 4 },
 { cx: x - 14, cy: y + 12, r: 5 }
 ];
 craters.forEach(c => {
 gCtx.beginPath();
 gCtx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
 gCtx.fill();
 });

 gCtx.beginPath();
 gCtx.ellipse(x, y + 8, 48, 32, -Math.PI / 12, Math.PI * 1.05, Math.PI * 1.88);
 gCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
 gCtx.lineWidth = 1.5;
 gCtx.setLineDash([3, 3]);
 gCtx.stroke();
 gCtx.setLineDash([]);

 const cowX = x + 10;
 const cowY = y - 40;
 
 gCtx.translate(cowX, cowY);
 gCtx.rotate(-15 * Math.PI / 180);

 gCtx.fillStyle = '#ffffff';
 gCtx.beginPath();
 gCtx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = '#111111';
 gCtx.beginPath();
 gCtx.arc(-5, -3, 4, 0, Math.PI * 2);
 gCtx.arc(3, 2, 5, 0, Math.PI * 2);
 gCtx.arc(-2, 4, 3, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = '#ffffff';
 gCtx.beginPath();
 gCtx.arc(-15, -5, 7, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = '#f472b6';
 gCtx.beginPath();
 gCtx.ellipse(-19, -3, 4, 3, 0, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = '#000000';
 gCtx.beginPath();
 gCtx.arc(-15, -7, 1, 0, Math.PI * 2);
 gCtx.arc(-20, -4, 0.7, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = '#fbbf24';
 gCtx.beginPath();
 gCtx.moveTo(-13, -11);
 gCtx.lineTo(-12, -15);
 gCtx.lineTo(-10, -11);
 gCtx.fill();

 gCtx.fillStyle = '#ffffff';
 gCtx.beginPath();
 gCtx.ellipse(-11, -8, 3, 1.8, Math.PI / 4, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.strokeStyle = '#ffffff';
 gCtx.lineWidth = 2.5;
 gCtx.lineCap = 'round';

 gCtx.beginPath();
 gCtx.moveTo(-8, 5);
 gCtx.lineTo(-15, 13);
 gCtx.moveTo(-4, 6);
 gCtx.lineTo(-9, 15);
 gCtx.moveTo(6, 5);
 gCtx.lineTo(15, 12);
 gCtx.moveTo(10, 3);
 gCtx.lineTo(17, 8);
 gCtx.stroke();

 gCtx.fillStyle = '#111111';
 gCtx.beginPath();
 gCtx.arc(-15, 13, 1.5, 0, Math.PI * 2);
 gCtx.arc(-9, 15, 1.5, 0, Math.PI * 2);
 gCtx.arc(15, 12, 1.5, 0, Math.PI * 2);
 gCtx.arc(17, 8, 1.5, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.strokeStyle = '#ffffff';
 gCtx.lineWidth = 1.5;
 gCtx.beginPath();
 gCtx.moveTo(14, -2);
 gCtx.quadraticCurveTo(21, -7, 23, -2);
 gCtx.stroke();

 gCtx.fillStyle = '#111111';
 gCtx.beginPath();
 gCtx.arc(23, -2, 2, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.restore();
 }

 function drawDistantGalaxy(gCtx, x, y, angleDeg, scale, coreColor, armColor) {
 gCtx.save();
 gCtx.translate(x, y);
 gCtx.rotate((angleDeg * Math.PI) / 180);
 gCtx.scale(scale, scale * 0.45);

 const hazeGrad = gCtx.createRadialGradient(0, 0, 4, 0, 0, 60);
 hazeGrad.addColorStop(0, armColor);
 hazeGrad.addColorStop(0.5, 'rgba(168, 85, 247, 0.18)');
 hazeGrad.addColorStop(1, 'transparent');
 gCtx.fillStyle = hazeGrad;
 gCtx.beginPath();
 gCtx.arc(0, 0, 60, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.fillStyle = armColor;
 for (let i = 0; i < 110; i++) {
 const a = i * 0.12;
 const r = 4 + a * 3.8;
 const opacity = Math.max(0, 1 - r / 60);
 gCtx.globalAlpha = opacity * 0.65;

 gCtx.beginPath();
 gCtx.arc(r * Math.cos(a), r * Math.sin(a), Math.random() * 1.8 + 0.8, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.beginPath();
 gCtx.arc(-r * Math.cos(a), -r * Math.sin(a), Math.random() * 1.8 + 0.8, 0, Math.PI * 2);
 gCtx.fill();
 }

 gCtx.globalAlpha = 1.0;
 const coreGrad = gCtx.createRadialGradient(0, 0, 0, 0, 0, 15);
 coreGrad.addColorStop(0, '#ffffff');
 coreGrad.addColorStop(0.4, coreColor);
 coreGrad.addColorStop(1, 'transparent');
 gCtx.fillStyle = coreGrad;
 gCtx.beginPath();
 gCtx.arc(0, 0, 15, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.restore();
 }

 function drawBackgroundPlanet(gCtx, x, y, radius, color1, color2, hasRings) {
 gCtx.save();
 gCtx.translate(x, y);

 if (hasRings) {
 gCtx.save();
 gCtx.rotate((-22 * Math.PI) / 180);
 gCtx.scale(1, 0.28);
 gCtx.beginPath();
 gCtx.arc(0, 0, radius * 2.2, 0, Math.PI * 2);
 gCtx.strokeStyle = 'rgba(216, 180, 254, 0.5)';
 gCtx.lineWidth = radius * 0.45;
 gCtx.stroke();
 gCtx.restore();
 }

 const pGrad = gCtx.createRadialGradient(-radius * 0.35, -radius * 0.35, radius * 0.1, 0, 0, radius);
 pGrad.addColorStop(0, color1);
 pGrad.addColorStop(0.7, color2);
 pGrad.addColorStop(1, '#030308');

 gCtx.fillStyle = pGrad;
 gCtx.beginPath();
 gCtx.arc(0, 0, radius, 0, Math.PI * 2);
 gCtx.fill();

 gCtx.beginPath();
 gCtx.arc(0, 0, radius + 1, 0, Math.PI * 2);
 gCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
 gCtx.lineWidth = 1;
 gCtx.stroke();

 gCtx.restore();
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 // Canvas Click / Touch Handler with 1-second Spam-Click Filter Baseline Requirement
 canvas.addEventListener('pointerdown', (e) => {
 const now = Date.now();
 if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
 return; // Rate-limit launches to no more than 1 per second
 }
 lastLaunchTime = now;

 const rect = canvas.getBoundingClientRect();
 const clickX = e.clientX - rect.left;
 const clickY = e.clientY - rect.top;

 launchBall(clickX, clickY);
 });

 function launchBall(x, y) {
 const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
 const vx = LAUNCH_VELOCITY * Math.sin(rad);
 const vy = -LAUNCH_VELOCITY * Math.cos(rad);

 // Pick a random color for the rocket body
 const randomColor = ROCKET_PALETTE[Math.floor(Math.random() * ROCKET_PALETTE.length)];

 // Remove oldest rocket if capacity reached
 if (balls.length >= MAX_BALLS) {
 balls.shift();
 }

 balls.push({
 x: x,
 y: y,
 vx: vx,
 vy: vy,
 radius: 12,
 color: randomColor,
 trail: []
 });
 }

 function resetSimulation() {
 balls = [];
 initSpaceKitties();
 }

 function updatePhysics() {
 // 1. Update Rocket Physics
 for (let i = balls.length - 1; i >= 0; i--) {
 const b = balls[i];

 const margin = 500;
 if (b.x < -margin || b.x > canvas.width + margin || 
 b.y < -margin || b.y > canvas.height + margin) {
 balls.splice(i, 1);
 continue;
 }

 const dx = centralNode.x - b.x;
 const dy = centralNode.y - b.y;
 const distSq = dx * dx + dy * dy;
 const dist = Math.sqrt(distSq);

 if (dist < centralNode.radius + b.radius) {
 balls.splice(i, 1);
 continue;
 }

 const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

 const ax = acceleration * (dx / dist);
 const ay = acceleration * (dy / dist);

 b.vx += ax;
 b.vy += ay;
 b.x += b.vx;
 b.y += b.vy;

 b.trail.push({ x: b.x, y: b.y });
 if (b.trail.length > TRAIL_LENGTH) {
 b.trail.shift();
 }
 }

 // 2. Update Space Kitties position and floating bounds
 for (const k of spaceKitties) {
 k.x += k.vx;
 k.y += k.vy;
 k.angle += k.spinSpeed;

 // Soft wrap-around boundaries for continuous floating
 const margin = 40;
 if (k.x < -margin) k.x = canvas.width + margin;
 if (k.x > canvas.width + margin) k.x = -margin;
 if (k.y < -margin) k.y = canvas.height + margin;
 if (k.y > canvas.height + margin) k.y = -margin;
 }

 // 3. Rocket <-> Space Kitty Collision Detection & Bouncing Physics
 for (const r of balls) {
 for (const k of spaceKitties) {
 const dx = k.x - r.x;
 const dy = k.y - r.y;
 const dist = Math.hypot(dx, dy);
 const minDist = r.radius + k.radius;

 if (dist < minDist && dist > 0) {
 // Normal collision vector
 const nx = dx / dist;
 const ny = dy / dist;

 // Relative velocity
 const rvx = r.vx - k.vx;
 const rvy = r.vy - k.vy;

 // Velocity along normal vector
 const velAlongNormal = rvx * nx + rvy * ny;

 // Check if moving towards each other
 if (velAlongNormal > 0) {
 const e = 0.9; // Bounciness elasticity factor
 const mRocket = 1.0;
 const mKitty = 1.5;

 const j = (1 + e) * velAlongNormal / (1 / mRocket + 1 / mKitty);

 // Apply bounce impulses
 r.vx -= (1 / mRocket) * j * nx;
 r.vy -= (1 / mRocket) * j * ny;

 k.vx += (1 / mKitty) * j * nx;
 k.vy += (1 / mKitty) * j * ny;

 // Positional adjustment to prevent overlap
 const overlap = minDist - dist;
 r.x -= nx * (overlap * 0.5);
 r.y -= ny * (overlap * 0.5);
 k.x += nx * (overlap * 0.5);
 k.y += ny * (overlap * 0.5);
 }
 }
 }
 }
 }

 // Draw Rocket Ship
 function drawRocket(r) {
 ctx.save();
 ctx.translate(r.x, r.y);

 // Point in movement direction
 const angle = Math.atan2(r.vy, r.vx);
 ctx.rotate(angle);

 // Animated Thruster Flame
 const flameLength = 10 + Math.random() * 8;
 const flameGrad = ctx.createLinearGradient(-10, 0, -10 - flameLength, 0);
 flameGrad.addColorStop(0, '#ffee55');
 flameGrad.addColorStop(0.5, '#ff7700');
 flameGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');

 ctx.beginPath();
 ctx.moveTo(-8, -4);
 ctx.lineTo(-10 - flameLength, 0);
 ctx.lineTo(-8, 4);
 ctx.closePath();
 ctx.fillStyle = flameGrad;
 ctx.fill();

 // Tail Fins
 ctx.fillStyle = '#475569';
 ctx.beginPath();
 ctx.moveTo(-8, -3);
 ctx.lineTo(-14, -9);
 ctx.lineTo(-4, -3);
 ctx.closePath();
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(-8, 3);
 ctx.lineTo(-14, 9);
 ctx.lineTo(-4, 3);
 ctx.closePath();
 ctx.fill();

 // Rocket Body Cylinder
 ctx.fillStyle = '#e2e8f0';
 ctx.beginPath();
 ctx.ellipse(-1, 0, 9, 5, 0, 0, Math.PI * 2);
 ctx.fill();

 // Colorful Rocket Nose Cone
 ctx.fillStyle = r.color;
 ctx.beginPath();
 ctx.moveTo(4, -5);
 ctx.quadraticCurveTo(15, 0, 4, 5);
 ctx.closePath();
 ctx.fill();

 // Window / Cockpit Glass
 ctx.fillStyle = '#38bdf8';
 ctx.beginPath();
 ctx.arc(1, -1, 3, 0, Math.PI * 2);
 ctx.fill();
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 0.8;
 ctx.stroke();

 ctx.restore();
 }

 // Draw Floating Space Kitty
 function drawSpaceKitty(k) {
 ctx.save();
 ctx.translate(k.x, k.y);
 ctx.rotate(k.angle);

 const r = k.radius;

 // Space Helmet Outer Bubble
 const helmetGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, r + 4);
 helmetGrad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
 helmetGrad.addColorStop(0.7, 'rgba(56, 189, 248, 0.2)');
 helmetGrad.addColorStop(1, 'rgba(255, 255, 255, 0.5)');

 ctx.beginPath();
 ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
 ctx.fillStyle = helmetGrad;
 ctx.fill();
 ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
 ctx.lineWidth = 1;
 ctx.stroke();

 // Kitty Ears
 ctx.fillStyle = k.furColor;
 ctx.beginPath();
 ctx.moveTo(-10, -10);
 ctx.lineTo(-5, -19);
 ctx.lineTo(-1, -11);
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(1, -11);
 ctx.lineTo(5, -19);
 ctx.lineTo(10, -10);
 ctx.fill();

 // Pink Inner Ears
 ctx.fillStyle = '#f472b6';
 ctx.beginPath();
 ctx.moveTo(-8, -11);
 ctx.lineTo(-5, -16);
 ctx.lineTo(-3, -11);
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(3, -11);
 ctx.lineTo(5, -16);
 ctx.lineTo(8, -11);
 ctx.fill();

 // Kitty Head
 ctx.fillStyle = k.furColor;
 ctx.beginPath();
 ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
 ctx.fill();

 // Eyes
 ctx.fillStyle = '#0f172a';
 ctx.beginPath();
 ctx.arc(-5, -3, 2.2, 0, Math.PI * 2);
 ctx.arc(5, -3, 2.2, 0, Math.PI * 2);
 ctx.fill();

 // Eye shine
 ctx.fillStyle = '#ffffff';
 ctx.beginPath();
 ctx.arc(-5.8, -3.8, 0.8, 0, Math.PI * 2);
 ctx.arc(4.2, -3.8, 0.8, 0, Math.PI * 2);
 ctx.fill();

 // Pink Nose
 ctx.fillStyle = '#f472b6';
 ctx.beginPath();
 ctx.polygon = [0, 1, -2, -1, 2, -1];
 ctx.moveTo(0, 1);
 ctx.lineTo(-2, -1);
 ctx.lineTo(2, -1);
 ctx.closePath();
 ctx.fill();

 // Whiskers
 ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
 ctx.lineWidth = 0.8;
 ctx.beginPath();
 ctx.moveTo(-4, 1); ctx.lineTo(-13, -1);
 ctx.moveTo(-4, 2); ctx.lineTo(-13, 3);
 ctx.moveTo(4, 1); ctx.lineTo(13, -1);
 ctx.moveTo(4, 2); ctx.lineTo(13, 3);
 ctx.stroke();

 ctx.restore();
 }

 function draw() {
 // 1. Draw Pre-rendered Space Background
 ctx.drawImage(bgCanvas, 0, 0);

 // 2. Draw Central Mass Node (Glowing Sun)
 ctx.save();
 const sunGlow = ctx.createRadialGradient(
 centralNode.x, centralNode.y, centralNode.radius * 0.5,
 centralNode.x, centralNode.y, centralNode.radius * 2.5
 );
 sunGlow.addColorStop(0, 'rgba(255, 255, 255, 1)');
 sunGlow.addColorStop(0.4, 'rgba(255, 200, 100, 0.6)');
 sunGlow.addColorStop(1, 'rgba(255, 150, 0, 0)');

 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 2.5, 0, Math.PI * 2);
 ctx.fillStyle = sunGlow;
 ctx.fill();

 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
 ctx.fillStyle = '#ffffff';
 ctx.fill();

 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
 ctx.fillStyle = '#000000';
 ctx.fill();
 ctx.restore();

 // 3. Draw Space Kitties
 for (const k of spaceKitties) {
 drawSpaceKitty(k);
 }

 // 4. Draw Orbit Trail & Colorful Rockets
 for (const b of balls) {
 if (b.trail.length > 1) {
 ctx.beginPath();
 ctx.moveTo(b.trail[0].x, b.trail[0].y);
 for (let t = 1; t < b.trail.length; t++) {
 ctx.lineTo(b.trail[t].x, b.trail[t].y);
 }
 ctx.strokeStyle = b.color + 'aa';
 ctx.lineWidth = 1.5;
 ctx.stroke();
 }

 drawRocket(b);
 }
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 animate();
 };
 </script>
</body>
