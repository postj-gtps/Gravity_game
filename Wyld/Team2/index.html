<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics - Fireball Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #800000 0%, #300000 45%, #000000 90%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ff3333;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      color: #ff4d4d;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slider-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ff3333;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #ff9999;
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
    }

    .slider-control label {
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .slider-control span {
      color: #ffffaa;
      font-size: 13px;
      display: inline-block;
      min-width: 20px;
      text-align: right;
    }

    .slider-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 6px;
      background: #400000;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .slider-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff3333;
      cursor: pointer;
      box-shadow: 0 0 8px #ff6600;
      transition: transform 0.15s;
    }

    .slider-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #ff6600;
    }

    .btn-control {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 1px solid #ff3333;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
    }

    .btn-control:hover {
      background: #ff3333;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
    }

    .btn-control.active {
      border-color: #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
      color: #00ff66;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      border: 2px solid #ff3333;
      border-radius: 6px;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none; /* Prevents touchscreen scrolling on Chromebooks */
      box-shadow: 0 0 20px rgba(180, 0, 0, 0.5);
    }

    .instructions {
      margin-top: 8px;
      font-size: 12px;
      color: #ff9999;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    <div class="controls">
      <div class="slider-control">
        <label for="ball-slider">Launch Burst: <span id="ball-count-val">10</span></label>
        <input type="range" id="ball-slider" min="1" max="30" value="10" oninput="document.getElementById('ball-count-val').innerText = this.value">
      </div>
      <button id="wall-toggle" class="btn-control active" onclick="toggleBouncyWalls()">Bouncy Walls: ON</button>
      <button class="btn-control" onclick="resetSimulation()">Reset</button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click anywhere to launch a burst of fireballs! (1s launch delay)
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull
    const LAUNCH_VELOCITY = 5; // Radial launch speed
    const TRAIL_LENGTH = 150; // Trail points stored
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const RESTITUTION = 0.85; // Energy retained after wall bounce
    const LAUNCH_COOLDOWN_MS = 1000; // Spam-click filter (1s limit)

    // STATE VARIABLES
    let balls = [];
    let bouncyWalls = true;
    let tieDyePattern = null;
    let lastLaunchTime = 0;

    // Central Gravity Node Definition
    const centralNode = {
      x: 0,
      y: 0,
      radius: 14
    };

    function toggleBouncyWalls() {
      bouncyWalls = !bouncyWalls;
      const btn = document.getElementById('wall-toggle');
      btn.innerText = `Bouncy Walls: ${bouncyWalls ? 'ON' : 'OFF'}`;
      if (bouncyWalls) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    // Procedural Red and Black Tie-Dye Canvas Background
    function createTieDyePattern() {
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = canvas.width;
      bgCanvas.height = canvas.height;
      const bgCtx = bgCanvas.getContext('2d');

      const cx = bgCanvas.width / 2;
      const cy = bgCanvas.height / 2;
      const maxRadius = Math.sqrt(cx * cx + cy * cy);

      // Base black fill
      bgCtx.fillStyle = '#050000';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Organic tie-dye swirls with varying crimson & black rings
      const ringCount = 18;
      for (let i = ringCount; i > 0; i--) {
        const r = (maxRadius / ringCount) * i;
        const grad = bgCtx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
        
        const isRed = i % 2 === 0;
        const redHue = 340 + (i * 7) % 30; // Deep crimson to bright red
        const lightness = isRed ? (22 + (i % 5) * 7) : (2 + (i % 3) * 3);

        grad.addColorStop(0, `hsl(${redHue}, 100%, ${lightness}%)`);
        grad.addColorStop(0.5, `hsl(${redHue - 10}, 90%, ${Math.max(0, lightness - 10)}%)`);
        grad.addColorStop(1, '#000000');

        bgCtx.save();
        bgCtx.translate(cx, cy);
        bgCtx.rotate((i * 0.35)); // Organic spiral rotation offset
        bgCtx.scale(1 + (i % 3) * 0.15, 1 - (i % 2) * 0.1); // Distort circle into tie-dye fluid shape
        bgCtx.beginPath();
        bgCtx.arc(0, 0, r, 0, Math.PI * 2);
        bgCtx.fillStyle = grad;
        bgCtx.globalAlpha = 0.75;
        bgCtx.fill();
        bgCtx.restore();
      }

      // Layered subtle spiral splash highlights
      bgCtx.save();
      bgCtx.globalCompositeOperation = 'screen';
      for (let a = 0; a < Math.PI * 4; a += 0.25) {
        const sr = (a / (Math.PI * 4)) * maxRadius;
        const sx = cx + Math.cos(a * 2.5) * sr;
        const sy = cy + Math.sin(a * 2.5) * sr;
        const radG = bgCtx.createRadialGradient(sx, sy, 0, sx, sy, 70);
        radG.addColorStop(0, 'rgba(230, 0, 38, 0.35)');
        radG.addColorStop(1, 'rgba(0, 0, 0, 0)');
        bgCtx.fillStyle = radG;
        bgCtx.beginPath();
        bgCtx.arc(sx, sy, 70, 0, Math.PI * 2);
        bgCtx.fill();
      }
      bgCtx.restore();

      tieDyePattern = bgCanvas;
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;

      createTieDyePattern();
    }

    window.addEventListener('resize', resizeCanvas);

    // Launch Handler with 1-second spam-click filter
    function handleLaunch(e) {
      const now = Date.now();
      if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
        return; // Spam filter: ignore clicks within 1s window
      }

      const rect = canvas.getBoundingClientRect();
      let clickX, clickY;

      if (e.touches && e.touches.length > 0) {
        clickX = e.touches[0].clientX - rect.left;
        clickY = e.touches[0].clientY - rect.top;
      } else if (e.clientX !== undefined) {
        clickX = e.clientX - rect.left;
        clickY = e.clientY - rect.top;
      } else {
        return;
      }

      lastLaunchTime = now;
      launchFireballs(clickX, clickY);
    }

    canvas.addEventListener('click', handleLaunch);

    function launchFireballs(x, y) {
      const countInput = document.getElementById('ball-slider');
      const ballCount = Math.min(30, Math.max(1, parseInt(countInput.value, 10) || 1));
      const angleStep = (Math.PI * 2) / ballCount;
      const startAngle = Math.random() * Math.PI * 2; // Dynamic rotational offset

      for (let i = 0; i < ballCount; i++) {
        const angle = startAngle + i * angleStep;
        const vx = LAUNCH_VELOCITY * Math.cos(angle);
        const vy = LAUNCH_VELOCITY * Math.sin(angle);

        balls.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          radius: 11,
          flickerPhase: Math.random() * Math.PI * 2,
          trail: []
        });
      }

      // Safety cap on active balls in play for Chromebook performance
      if (balls.length > 200) {
        balls.splice(0, balls.length - 200);
      }
    }

    function resetSimulation() {
      balls = [];
    }

    function updatePhysics() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: fireball collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // WALL BOUNCE PHYSICS TOGGLE
        if (bouncyWalls) {
          // Left & Right Wall Collisions
          if (b.x - b.radius < 0) {
            b.x = b.radius;
            b.vx = -b.vx * RESTITUTION;
          } else if (b.x + b.radius > canvas.width) {
            b.x = canvas.width - b.radius;
            b.vx = -b.vx * RESTITUTION;
          }

          // Top & Bottom Wall Collisions
          if (b.y - b.radius < 0) {
            b.y = b.radius;
            b.vy = -b.vy * RESTITUTION;
          } else if (b.y + b.radius > canvas.height) {
            b.y = canvas.height - b.radius;
            b.vy = -b.vy * RESTITUTION;
          }
        } else {
          // Bouncy Walls OFF: Clean up ball when it flies far off screen
          const margin = 400;
          if (b.x < -margin || b.x > canvas.width + margin || 
              b.y < -margin || b.y > canvas.height + margin) {
            balls.splice(i, 1);
            continue;
          }
        }

        // Record position history for fireball trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }
    }

    // Render Fireball with Flaming Trail & Dynamic Glow Core
    function drawFireball(ctx, b) {
      // 1. Draw Fiery Trail
      if (b.trail.length > 1) {
        ctx.save();
        for (let t = 1; t < b.trail.length; t++) {
          const p1 = b.trail[t - 1];
          const p2 = b.trail[t];
          const progress = t / b.trail.length;
          
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(255, ${Math.floor(60 + progress * 140)}, 0, ${progress * 0.8})`;
          ctx.lineWidth = progress * (b.radius * 1.5);
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.restore();
      }

      // 2. Draw Fireball Head & Flickering Tail
      ctx.save();
      ctx.translate(b.x, b.y);

      const moveAngle = Math.atan2(b.vy, b.vx);
      const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      const flicker = Math.sin(Date.now() * 0.02 + b.flickerPhase) * 2.5;
      const flameLen = b.radius * (1.8 + Math.min(speed * 0.08, 1.4)) + flicker;

      ctx.rotate(moveAngle);

      // Outer Flickering Flame Plume (trails behind movement)
      ctx.beginPath();
      ctx.moveTo(b.radius * 0.5, 0);
      ctx.quadraticCurveTo(-b.radius * 0.8, b.radius * 1.1, -flameLen, 0);
      ctx.quadraticCurveTo(-b.radius * 0.8, -b.radius * 1.1, b.radius * 0.5, 0);
      ctx.fillStyle = 'rgba(255, 50, 0, 0.8)';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 10;
      ctx.fill();

      // Inner Hot Flame Core
      ctx.beginPath();
      ctx.moveTo(b.radius * 0.4, 0);
      ctx.quadraticCurveTo(-b.radius * 0.5, b.radius * 0.6, -flameLen * 0.6, 0);
      ctx.quadraticCurveTo(-b.radius * 0.5, -b.radius * 0.6, b.radius * 0.4, 0);
      ctx.fillStyle = 'rgba(255, 190, 0, 0.95)';
      ctx.fill();

      // Radial Glowing Head
      const radG = ctx.createRadialGradient(0, 0, 0, 0, 0, b.radius * 1.2);
      radG.addColorStop(0, '#ffffff'); // White hot core
      radG.addColorStop(0.35, '#ffea00'); // Intense yellow
      radG.addColorStop(0.7, '#ff4400'); // Vibrant red-orange
      radG.addColorStop(1, 'rgba(180, 0, 0, 0)'); // Soft edge glow

      ctx.beginPath();
      ctx.arc(0, 0, b.radius * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = radG;
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      // 1. Draw Tie-Dye Canvas Background
      if (tieDyePattern) {
        ctx.drawImage(tieDyePattern, 0, 0);
      } else {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Draw Central Mass Node
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius + 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 51, 51, 0.4)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ff0000';
      ctx.fill();

      // 3. Draw Fireballs
      for (const b of balls) {
        drawFireball(ctx, b);
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      resizeCanvas();
      animate();
    };
  </script>
</body>
</html>
