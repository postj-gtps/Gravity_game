<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #000000;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 1px solid #ffffff;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #000000;
 border: 1px solid #ffffff;
 display: block;
 cursor: crosshair;
 width: 100%;
 height: 100%;
 touch-action: none; /* Prevents touch scrolling on Chromebook touchscreens */
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #888888;
 text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Gravity Simulation</h1>
 <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 Click or tap anywhere on the canvas to launch a ball.
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // SIMULATION CONSTANTS
 const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
 const LAUNCH_VELOCITY = 5; // Fixed velocity on click
 const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
 const TRAIL_LENGTH = 300; // Number of historic trail points stored
 const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
 const RESTITUTION = 0.85; // Energy retained after wall bounce (0.85 = 85%)

 // STATE VARIABLES
 let balls = [];

 // Central Gravity Node Definition
 const centralNode = {
 x: 0,
 y: 0,
 radius: 12
 };

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 // Recenter gravity node dynamically
 centralNode.x = canvas.width / 2;
 centralNode.y = canvas.height / 2;
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 // Universal Click / Touch Handler for Launching
 function handleLaunch(e) {
 const rect = canvas.getBoundingClientRect();
 const clickX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
 const clickY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

 launchBall(clickX, clickY);
 }

 canvas.addEventListener('click', handleLaunch);

 function launchBall(x, y) {
 // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
 const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
 const vx = LAUNCH_VELOCITY * Math.sin(rad); 
 const vy = -LAUNCH_VELOCITY * Math.cos(rad); 

 // Overwrite existing array to strictly maintain a single ball on screen
 balls = [{
 x: x,
 y: y,
 vx: vx,
 vy: vy,
 radius: 12, // Ball radius
 angle: 0, // Dynamic rotation angle in radians
 trail: [] // Stores history of past {x, y} coordinates
 }];
 }

 function resetSimulation() {
 balls = [];
 }

 function updatePhysics() {
 for (let i = balls.length - 1; i >= 0; i--) {
 const b = balls[i];

 // Distance vector to central gravity node
 const dx = centralNode.x - b.x;
 const dy = centralNode.y - b.y;
 const distSq = dx * dx + dy * dy;
 const dist = Math.sqrt(distSq);

 // Absorption check: ball collides with central mass
 if (dist < centralNode.radius + b.radius) {
 balls.splice(i, 1);
 continue;
 }

 // Inverse square law gravity acceleration
 const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

 // Acceleration vector components
 const ax = acceleration * (dx / dist);
 const ay = acceleration * (dy / dist);

 // Update velocity and position
 b.vx += ax;
 b.vy += ay;
 b.x += b.vx;
 b.y += b.vy;

 // WALL BOUNCE PHYSICS
 // Left & Right Wall Collisions
 if (b.x - b.radius < 0) {
 b.x = b.radius;
 b.vx = -b.vx * RESTITUTION;
 } else if (b.x + b.radius > canvas.width) {
 b.x = canvas.width - b.radius;
 b.vx = -b.vx * RESTITUTION;
 }

 // Top & Bottom Wall Collisions
 if (b.y - b.radius < 0) {
 b.y = b.radius;
 b.vy = -b.vy * RESTITUTION;
 } else if (b.y + b.radius > canvas.height) {
 b.y = canvas.height - b.radius;
 b.vy = -b.vy * RESTITUTION;
 }

 // Rotate ball dynamically based on current speed
 const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
 b.angle += speed * 0.04;

 // Record position history for path trail
 b.trail.push({ x: b.x, y: b.y });
 if (b.trail.length > TRAIL_LENGTH) {
 b.trail.shift();
 }
 }
 }

 // Procedural Vector Soccer Ball Drawing Function
 function drawSoccerBall(ctx, x, y, r, angle) {
 ctx.save();
 ctx.translate(x, y);
 ctx.rotate(angle);

 // 1. Base white sphere
 ctx.beginPath();
 ctx.arc(0, 0, r, 0, Math.PI * 2);
 ctx.fillStyle = '#ffffff';
 ctx.fill();
 ctx.lineWidth = Math.max(1, r * 0.1);
 ctx.strokeStyle = '#000000';
 ctx.stroke();

 // Clip panel patterns strictly within the ball boundary
 ctx.beginPath();
 ctx.arc(0, 0, r, 0, Math.PI * 2);
 ctx.clip();

 const innerR = r * 0.38;
 const lineR = r * 0.72;

 // 2. Central black pentagon
 ctx.beginPath();
 for (let i = 0; i < 5; i++) {
 const a = (i * 2 * Math.PI) / 5 - Math.PI / 2;
 const px = innerR * Math.cos(a);
 const py = innerR * Math.sin(a);
 if (i === 0) ctx.moveTo(px, py);
 else ctx.lineTo(px, py);
 }
 ctx.closePath();
 ctx.fillStyle = '#000000';
 ctx.fill();

 // 3. Radial seam lines and surrounding edge pentagon patches
 for (let i = 0; i < 5; i++) {
 const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
 const a2 = ((i + 1) * 2 * Math.PI) / 5 - Math.PI / 2;

 const p1x = innerR * Math.cos(a1);
 const p1y = innerR * Math.sin(a1);
 const s1x = lineR * Math.cos(a1);
 const s1y = lineR * Math.sin(a1);
 const s2x = lineR * Math.cos(a2);
 const s2y = lineR * Math.sin(a2);

 // Seam line extending outward from central pentagon vertex
 ctx.beginPath();
 ctx.moveTo(p1x, p1y);
 ctx.lineTo(s1x, s1y);
 ctx.strokeStyle = '#000000';
 ctx.lineWidth = Math.max(1, r * 0.08);
 ctx.stroke();

 // Outer black patch
 const edge1X = r * 1.2 * Math.cos(a1 + 0.25);
 const edge1Y = r * 1.2 * Math.sin(a1 + 0.25);
 const edge2X = r * 1.2 * Math.cos(a2 - 0.25);
 const edge2Y = r * 1.2 * Math.sin(a2 - 0.25);

 ctx.beginPath();
 ctx.moveTo(s1x, s1y);
 ctx.lineTo(edge1X, edge1Y);
 ctx.lineTo(edge2X, edge2Y);
 ctx.lineTo(s2x, s2y);
 ctx.closePath();
 ctx.fillStyle = '#000000';
 ctx.fill();
 ctx.stroke();
 }

 ctx.restore();
 }

 function draw() {
 // Clear canvas background
 ctx.fillStyle = '#000000';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 // 1. Draw Central Mass Node
 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
 ctx.fillStyle = '#ffffff';
 ctx.fill();

 // Center mark on node
 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
 ctx.fillStyle = '#000000';
 ctx.fill();

 // 2. Draw Ball & Trail
 for (const b of balls) {
 // Draw path line
 if (b.trail.length > 1) {
 ctx.beginPath();
 ctx.moveTo(b.trail[0].x, b.trail[0].y);
 for (let t = 1; t < b.trail.length; t++) {
 ctx.lineTo(b.trail[t].x, b.trail[t].y);
 }
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1.2;
 ctx.stroke();
 }

 // Draw vector soccer ball
 drawSoccerBall(ctx, b.x, b.y, b.radius, b.angle);
 }
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 animate();
 };
 </script>
</body>
</html>
