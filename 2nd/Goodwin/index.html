<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline - Rocket Squad</title>
 <style>
 * {
   box-sizing: border-box;
   user-select: none;
   margin: 0;
   padding: 0;
   font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
   background-color: #050510;
   color: #ffffff;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: flex-start;
   height: 100vh;
   overflow: hidden;
   padding: 16px;
 }

 /* Top Header Bar */
 #header {
   display: flex;
   justify-content: space-between;
   align-items: center;
   width: 100%;
   max-width: 1100px;
   margin-bottom: 12px;
   padding-bottom: 8px;
   border-bottom: 1px solid #334466;
 }

 .header-left {
   display: flex;
   align-items: center;
   gap: 16px;
 }

 h1 {
   font-size: 18px;
   letter-spacing: 2px;
   text-transform: uppercase;
   font-weight: bold;
   color: #ffd700;
   text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
 }

 /* Cooldown Badge */
 #cooldown-status {
   font-size: 12px;
   font-weight: bold;
   padding: 4px 10px;
   border-radius: 12px;
   text-transform: uppercase;
   letter-spacing: 1px;
   background: rgba(0, 230, 118, 0.2);
   color: #00e676;
   border: 1px solid #00e676;
   transition: all 0.2s ease;
 }

 #cooldown-status.cooldown-active {
   background: rgba(255, 23, 68, 0.2);
   color: #ff1744;
   border-color: #ff1744;
 }

 .btn-reset {
   background: rgba(255, 255, 255, 0.1);
   color: #ffffff;
   border: 1px solid #ffd700;
   padding: 6px 16px;
   font-size: 14px;
   font-weight: bold;
   cursor: pointer;
   text-transform: uppercase;
   letter-spacing: 1px;
   transition: all 0.15s ease-in-out;
   border-radius: 4px;
 }

 .btn-reset:hover {
   background: #ffd700;
   color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
   position: relative;
   width: 100%;
   max-width: 1100px;
   flex-grow: 1;
   display: flex;
   justify-content: center;
   align-items: center;
 }

 canvas {
   background-color: #050510;
   border: 1px solid #334466;
   display: block;
   cursor: crosshair;
   width: 100%;
   height: 100%;
   border-radius: 8px;
   touch-action: none;
 }

 .instructions {
   margin-top: 8px;
   font-size: 12px;
   color: #aaaacc;
   text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
   <div class="header-left">
     <h1>Gravity Simulation</h1>
     <div id="cooldown-status">READY</div>
   </div>
   <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
   <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
   Click & Drag to aim & set power, then release to launch 360° rocket bursts! (Max 1 launch per sec)
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');
 const cooldownStatusEl = document.getElementById('cooldown-status');

 // SIMULATION CONSTANTS
 const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
 const SOFTENING_FACTOR = 400;  // Prevents infinite velocity near center
 const LAUNCH_COOLDOWN_MS = 1000; // Spam-click filter (1 second delay)

 // STATE VARIABLES
 let ships = [];
 let stars = [];
 let nebulas = [];
 let planets = [];
 let asteroids = [];
 let explosionParticles = [];
 let fireParticles = [];
 let lastLaunchTime = 0;

 // Slingshot Drag Control State
 let isDragging = false;
 let dragStart = { x: 0, y: 0 };
 let dragCurrent = { x: 0, y: 0 };

 // Central Gravity Node Definition (Yellow Sun)
 const centralNode = {
   x: 0,
   y: 0,
   radius: 18
 };

 function generateSpaceBackground() {
   stars = [];
   const starCount = Math.floor((canvas.width * canvas.height) / 2500);
   for (let i = 0; i < starCount; i++) {
     stars.push({
       x: Math.random() * canvas.width,
       y: Math.random() * canvas.height,
       radius: Math.random() * 1.6 + 0.4,
       alpha: Math.random() * 0.8 + 0.2,
       color: ['#ffffff', '#aadbff', '#ffe3a0', '#ffb3d9', '#b3ffee'][Math.floor(Math.random() * 5)]
     });
   }

   nebulas = [
     { x: canvas.width * 0.15, y: canvas.height * 0.25, radius: Math.max(canvas.width, canvas.height) * 0.4, color: 'rgba(150, 30, 220, 0.28)' },
     { x: canvas.width * 0.85, y: canvas.height * 0.75, radius: Math.max(canvas.width, canvas.height) * 0.45, color: 'rgba(0, 180, 216, 0.25)' },
     { x: canvas.width * 0.5, y: canvas.height * 0.85, radius: Math.max(canvas.width, canvas.height) * 0.35, color: 'rgba(247, 37, 133, 0.22)' }
   ];

   planets = [
     {
       x: canvas.width * 0.15,
       y: canvas.height * 0.72,
       radius: 28,
       color1: '#4cc9f0',
       color2: '#4361ee',
       hasRing: true,
       ringColor: 'rgba(76, 201, 240, 0.5)'
     },
     {
       x: canvas.width * 0.82,
       y: canvas.height * 0.25,
       radius: 22,
       color1: '#ff4d6d',
       color2: '#800f2f',
       hasRing: false
     }
   ];

   generateAsteroids();
 }

 function generateAsteroids() {
   asteroids = [];
   const count = 5;
   for (let i = 0; i < count; i++) {
     let ax, ay;
     do {
       ax = Math.random() * canvas.width;
       ay = Math.random() * canvas.height;
     } while (Math.hypot(ax - centralNode.x, ay - centralNode.y) < 160);

     const radius = Math.random() * 14 + 16;
     const vertCount = Math.floor(Math.random() * 4) + 7;
     const vertOffsets = [];
     for (let v = 0; v < vertCount; v++) {
       vertOffsets.push(0.8 + Math.random() * 0.4);
     }

     asteroids.push({
       x: ax,
       y: ay,
       vx: (Math.random() - 0.5) * 1.2,
       vy: (Math.random() - 0.5) * 1.2,
       radius: radius,
       angle: Math.random() * Math.PI * 2,
       spin: (Math.random() - 0.5) * 0.03,
       vertCount: vertCount,
       vertOffsets: vertOffsets
     });
   }
 }

 function resizeCanvas() {
   const wrapper = document.getElementById('canvas-wrapper');
   canvas.width = wrapper.clientWidth;
   canvas.height = wrapper.clientHeight;
   
   centralNode.x = canvas.width / 2;
   centralNode.y = canvas.height / 2;

   generateSpaceBackground();
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 // SPAM-CLICK FILTER & POINTER EVENTS
 canvas.addEventListener('pointerdown', (e) => {
   const now = Date.now();
   // Spam Filter: Reject input if cooldown has not elapsed
   if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
     return;
   }

   const rect = canvas.getBoundingClientRect();
   dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
   dragCurrent = { ...dragStart };
   isDragging = true;
   canvas.setPointerCapture(e.pointerId);
 });

 canvas.addEventListener('pointermove', (e) => {
   if (!isDragging) return;
   const rect = canvas.getBoundingClientRect();
   dragCurrent = { x: e.clientX - rect.left, y: e.clientY - rect.top };
 });

 canvas.addEventListener('pointerup', (e) => {
   if (!isDragging) return;
   isDragging = false;

   const now = Date.now();
   // Spam Filter Check on launch release
   if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) return;

   const dx = dragStart.x - dragCurrent.x;
   const dy = dragStart.y - dragCurrent.y;
   const dragDistance = Math.hypot(dx, dy);

   if (dragDistance > 6) {
     const baseSpeed = Math.min(dragDistance * 0.07, 12);
     const baseAngle = Math.atan2(dy, dx);
     launchShips360(dragStart.x, dragStart.y, baseAngle, baseSpeed);
     lastLaunchTime = now; // Record launch timestamp for spam filter
   }
 });

 canvas.addEventListener('pointercancel', () => { isDragging = false; });

 function updateCooldownUI() {
   const elapsed = Date.now() - lastLaunchTime;
   if (elapsed < LAUNCH_COOLDOWN_MS) {
     const remainingSec = ((LAUNCH_COOLDOWN_MS - elapsed) / 1000).toFixed(1);
     cooldownStatusEl.textContent = `RECHARGING (${remainingSec}s)`;
     cooldownStatusEl.classList.add('cooldown-active');
   } else {
     cooldownStatusEl.textContent = 'READY';
     cooldownStatusEl.classList.remove('cooldown-active');
   }
 }

 function launchShips360(x, y, baseAngle, launchSpeed) {
   const shipCount = 5;
   const angleStep = (Math.PI * 2) / shipCount;
   const colors = ['#00e5ff', '#ff3366', '#76ff03', '#ffea00', '#d500f9'];

   for (let i = 0; i < shipCount; i++) {
     const currentAngle = baseAngle + (i * angleStep);
     const vx = launchSpeed * Math.cos(currentAngle);
     const vy = launchSpeed * Math.sin(currentAngle);

     ships.push({
       x: x,
       y: y,
       vx: vx,
       vy: vy,
       radius: 6,
       color: colors[i % colors.length],
       designType: Math.floor(Math.random() * 4)
     });
   }
 }

 function triggerExplosion(x, y, color) {
   const particleCount = 24;
   for (let i = 0; i < particleCount; i++) {
     const angle = Math.random() * Math.PI * 2;
     const speed = Math.random() * 4.5 + 1;
     explosionParticles.push({
       x: x,
       y: y,
       vx: Math.cos(angle) * speed,
       vy: Math.sin(angle) * speed,
       radius: Math.random() * 3 + 1.5,
       color: Math.random() > 0.4 ? color : (Math.random() > 0.5 ? '#ffcc00' : '#ffffff'),
       alpha: 1.0,
       life: 0,
       maxLife: Math.floor(Math.random() * 20 + 20)
     });
   }
 }

 function triggerBounceSparks(x, y, nx, ny) {
   for (let i = 0; i < 8; i++) {
     const spreadAngle = Math.atan2(ny, nx) + (Math.random() - 0.5);
     const speed = Math.random() * 3 + 1;
     explosionParticles.push({
       x: x,
       y: y,
       vx: Math.cos(spreadAngle) * speed,
       vy: Math.sin(spreadAngle) * speed,
       radius: Math.random() * 2 + 1,
       color: '#ffea00',
       alpha: 1.0,
       life: 0,
       maxLife: 12
     });
   }
 }

 function resetSimulation() {
   ships = [];
   explosionParticles = [];
   fireParticles = [];
   generateAsteroids();
 }

 function updatePhysics() {
   // Asteroids
   for (const ast of asteroids) {
     ast.x += ast.vx;
     ast.y += ast.vy;
     ast.angle += ast.spin;

     if (ast.x < -ast.radius) ast.x = canvas.width + ast.radius;
     if (ast.x > canvas.width + ast.radius) ast.x = -ast.radius;
     if (ast.y < -ast.radius) ast.y = canvas.height + ast.radius;
     if (ast.y > canvas.height + ast.radius) ast.y = -ast.radius;
   }

   // Explosions
   for (let i = explosionParticles.length - 1; i >= 0; i--) {
     const p = explosionParticles[i];
     p.x += p.vx;
     p.y += p.vy;
     p.vx *= 0.96;
     p.vy *= 0.96;
     p.life++;
     p.alpha = 1 - (p.life / p.maxLife);

     if (p.life >= p.maxLife) {
       explosionParticles.splice(i, 1);
     }
   }

   // Thruster Trails
   for (let i = fireParticles.length - 1; i >= 0; i--) {
     const fp = fireParticles[i];
     fp.x += fp.vx;
     fp.y += fp.vy;
     fp.radius *= 0.92;
     fp.life++;
     fp.alpha = 1 - (fp.life / fp.maxLife);

     if (fp.life >= fp.maxLife || fp.radius < 0.3) {
       fireParticles.splice(i, 1);
     }
   }

   // Rockets
   for (let i = ships.length - 1; i >= 0; i--) {
     const s = ships[i];

     const margin = 500;
     if (s.x < -margin || s.x > canvas.width + margin || 
         s.y < -margin || s.y > canvas.height + margin) {
       ships.splice(i, 1);
       continue;
     }

     const dx = centralNode.x - s.x;
     const dy = centralNode.y - s.y;
     const distSq = dx * dx + dy * dy;
     const dist = Math.sqrt(distSq);

     if (dist < centralNode.radius + s.radius) {
       triggerExplosion(s.x, s.y, s.color);
       ships.splice(i, 1);
       continue;
     }

     for (const ast of asteroids) {
       const adx = s.x - ast.x;
       const ady = s.y - ast.y;
       const adist = Math.hypot(adx, ady);
       const minDist = s.radius + ast.radius;

       if (adist < minDist && adist > 0) {
         const nx = adx / adist;
         const ny = ady / adist;

         const dot = s.vx * nx + s.vy * ny;
         if (dot < 0) {
           s.vx = s.vx - 2 * dot * nx;
           s.vy = s.vy - 2 * dot * ny;

           s.x = ast.x + nx * (minDist + 1);
           s.y = ast.y + ny * (minDist + 1);

           triggerBounceSparks(s.x, s.y, nx, ny);
         }
       }
     }

     const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
     s.vx += acceleration * (dx / dist);
     s.vy += acceleration * (dy / dist);

     s.x += s.vx;
     s.y += s.vy;

     const shipAngle = Math.atan2(s.vy, s.vx);
     const tailX = s.x - Math.cos(shipAngle) * 8;
     const tailY = s.y - Math.sin(shipAngle) * 8;

     for (let f = 0; f < 2; f++) {
       fireParticles.push({
         x: tailX + (Math.random() - 0.5) * 3,
         y: tailY + (Math.random() - 0.5) * 3,
         vx: -s.vx * 0.15 + (Math.random() - 0.5) * 0.8,
         vy: -s.vy * 0.15 + (Math.random() - 0.5) * 0.8,
         radius: Math.random() * 3.5 + 2,
         color: ['#ff4400', '#ff8800', '#ffea00', '#ffffff'][Math.floor(Math.random() * 4)],
         alpha: 1.0,
         life: 0,
         maxLife: Math.floor(Math.random() * 12 + 10)
       });
     }
   }
 }

 function drawBackground() {
   ctx.fillStyle = '#050512';
   ctx.fillRect(0, 0, canvas.width, canvas.height);

   for (const neb of nebulas) {
     const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
     grad.addColorStop(0, neb.color);
     grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
     ctx.fillStyle = grad;
     ctx.fillRect(0, 0, canvas.width, canvas.height);
   }

   for (const p of planets) {
     ctx.save();
     if (p.hasRing) {
       ctx.save();
       ctx.translate(p.x, p.y);
       ctx.rotate(-Math.PI / 6);
       ctx.scale(1, 0.3);
       ctx.beginPath();
       ctx.arc(0, 0, p.radius * 2.2, 0, Math.PI * 2);
       ctx.strokeStyle = p.ringColor;
       ctx.lineWidth = 5;
       ctx.stroke();
       ctx.restore();
     }

     const planetGrad = ctx.createRadialGradient(
       p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.1,
       p.x, p.y, p.radius
     );
     planetGrad.addColorStop(0, p.color1);
     planetGrad.addColorStop(1, p.color2);

     ctx.fillStyle = planetGrad;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }

   for (const star of stars) {
     ctx.save();
     ctx.globalAlpha = star.alpha;
     ctx.fillStyle = star.color;
     ctx.beginPath();
     ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawAsteroids() {
   for (const ast of asteroids) {
     ctx.save();
     ctx.translate(ast.x, ast.y);
     ctx.rotate(ast.angle);

     ctx.beginPath();
     for (let i = 0; i < ast.vertCount; i++) {
       const a = (i * Math.PI * 2) / ast.vertCount;
       const r = ast.radius * ast.vertOffsets[i];
       const vx = Math.cos(a) * r;
       const vy = Math.sin(a) * r;
       if (i === 0) ctx.moveTo(vx, vy);
       else ctx.lineTo(vx, vy);
     }
     ctx.closePath();

     ctx.fillStyle = '#3a3a4d';
     ctx.fill();
     ctx.lineWidth = 2;
     ctx.strokeStyle = '#686882';
     ctx.stroke();

     ctx.restore();
   }
 }

 function drawSun() {
   const sunGlow = ctx.createRadialGradient(
     centralNode.x, centralNode.y, centralNode.radius * 0.5,
     centralNode.x, centralNode.y, centralNode.radius * 3.5
   );
   sunGlow.addColorStop(0, 'rgba(255, 220, 50, 0.8)');
   sunGlow.addColorStop(0.5, 'rgba(255, 140, 0, 0.25)');
   sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');

   ctx.fillStyle = sunGlow;
   ctx.beginPath();
   ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 3.5, 0, Math.PI * 2);
   ctx.fill();

   const sunBody = ctx.createRadialGradient(
     centralNode.x - centralNode.radius * 0.3, centralNode.y - centralNode.radius * 0.3, 2,
     centralNode.x, centralNode.y, centralNode.radius
   );
   sunBody.addColorStop(0, '#ffffff');
   sunBody.addColorStop(0.3, '#fff066');
   sunBody.addColorStop(0.8, '#ffcc00');
   sunBody.addColorStop(1, '#ff8800');

   ctx.fillStyle = sunBody;
   ctx.beginPath();
   ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
   ctx.fill();
 }

 function drawRocket(s) {
   const angle = Math.atan2(s.vy, s.vx);

   ctx.save();
   ctx.translate(s.x, s.y);
   ctx.rotate(angle);

   switch (s.designType) {
     case 0:
       ctx.fillStyle = s.color;
       ctx.beginPath();
       ctx.moveTo(11, 0);
       ctx.lineTo(-6, -6);
       ctx.lineTo(-4, 0);
       ctx.lineTo(-6, 6);
       ctx.closePath();
       ctx.fill();

       ctx.fillStyle = '#ffffff';
       ctx.beginPath();
       ctx.moveTo(11, 0);
       ctx.lineTo(3, -3);
       ctx.lineTo(3, 3);
       ctx.fill();

       ctx.fillStyle = '#003366';
       ctx.beginPath();
       ctx.arc(1, 0, 2, 0, Math.PI * 2);
       ctx.fill();
       break;

     case 1:
       ctx.fillStyle = s.color;
       ctx.beginPath();
       ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2);
       ctx.fill();

       ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
       ctx.beginPath();
       ctx.arc(0, -2, 4, Math.PI, 0);
       ctx.fill();
       break;

     case 2:
       ctx.fillStyle = s.color;
       ctx.beginPath();
       ctx.moveTo(12, 0);
       ctx.lineTo(-8, -9);
       ctx.lineTo(-4, 0);
       ctx.lineTo(-8, 9);
       ctx.closePath();
       ctx.fill();

       ctx.fillStyle = '#111122';
       ctx.beginPath();
       ctx.moveTo(5, 0);
       ctx.lineTo(-2, -3);
       ctx.lineTo(-2, 3);
       ctx.closePath();
       ctx.fill();
       break;

     case 3:
       ctx.fillStyle = s.color;
       ctx.beginPath();
       ctx.roundRect(-7, -5, 14, 10, 3);
       ctx.fill();

       ctx.fillStyle = '#ffffff';
       ctx.fillRect(2, -4, 4, 8);

       ctx.fillStyle = '#00e5ff';
       ctx.fillRect(-2, -3, 3, 6);
       break;
   }

   ctx.restore();
 }

 function drawFireParticles() {
   for (const fp of fireParticles) {
     ctx.save();
     ctx.globalAlpha = Math.max(0, fp.alpha);
     ctx.fillStyle = fp.color;
     ctx.beginPath();
     ctx.arc(fp.x, fp.y, fp.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawExplosionParticles() {
   for (const p of explosionParticles) {
     ctx.save();
     ctx.globalAlpha = Math.max(0, p.alpha);
     ctx.fillStyle = p.color;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawSlingshotUI() {
   if (!isDragging) return;

   const dx = dragStart.x - dragCurrent.x;
   const dy = dragStart.y - dragCurrent.y;
   const dist = Math.hypot(dx, dy);

   if (dist < 5) return;

   ctx.save();
   ctx.beginPath();
   ctx.moveTo(dragStart.x, dragStart.y);
   ctx.lineTo(dragCurrent.x, dragCurrent.y);
   ctx.strokeStyle = '#ffd700';
   ctx.lineWidth = 2;
   ctx.setLineDash([4, 4]);
   ctx.stroke();

   ctx.beginPath();
   ctx.arc(dragStart.x, dragStart.y, 6, 0, Math.PI * 2);
   ctx.fillStyle = '#ffd700';
   ctx.fill();

   const angle = Math.atan2(dy, dx);
   const aimLength = Math.min(dist, 100);
   const aimX = dragStart.x + Math.cos(angle) * aimLength;
   const aimY = dragStart.y + Math.sin(angle) * aimLength;

   ctx.beginPath();
   ctx.moveTo(dragStart.x, dragStart.y);
   ctx.lineTo(aimX, aimY);
   ctx.strokeStyle = 'rgba(0, 229, 255, 0.8)';
   ctx.lineWidth = 3;
   ctx.setLineDash([]);
   ctx.stroke();

   ctx.restore();
 }

 function draw() {
   drawBackground();
   drawAsteroids();
   drawSun();
   drawFireParticles();

   for (const s of ships) {
     drawRocket(s);
   }

   drawExplosionParticles();
   drawSlingshotUI();
 }

 function animate() {
   updatePhysics();
   updateCooldownUI();
   draw();
   requestAnimationFrame(animate);
 }

 window.onload = function() {
   animate();
 };
 </script>
</body>
</html>
