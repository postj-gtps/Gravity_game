<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline - Rocket Squad</title>
 <style>
 * {
   box-sizing: border-box;
   user-select: none;
   margin: 0;
   padding: 0;
   font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
   background-color: #050510;
   color: #ffffff;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: flex-start;
   height: 100vh;
   overflow: hidden;
   padding: 16px;
 }

 /* Top Header Bar */
 #header {
   display: flex;
   justify-content: space-between;
   align-items: center;
   width: 100%;
   max-width: 1100px;
   margin-bottom: 12px;
   padding-bottom: 8px;
   border-bottom: 1px solid #334466;
 }

 h1 {
   font-size: 18px;
   letter-spacing: 2px;
   text-transform: uppercase;
   font-weight: bold;
   color: #ffd700;
   text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
 }

 .btn-reset {
   background: rgba(255, 255, 255, 0.1);
   color: #ffffff;
   border: 1px solid #ffd700;
   padding: 6px 16px;
   font-size: 14px;
   font-weight: bold;
   cursor: pointer;
   text-transform: uppercase;
   letter-spacing: 1px;
   transition: all 0.15s ease-in-out;
   border-radius: 4px;
 }

 .btn-reset:hover {
   background: #ffd700;
   color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
   position: relative;
   width: 100%;
   max-width: 1100px;
   flex-grow: 1;
   display: flex;
   justify-content: center;
   align-items: center;
 }

 canvas {
   background-color: #050510;
   border: 1px solid #334466;
   display: block;
   cursor: crosshair;
   width: 100%;
   height: 100%;
   border-radius: 8px;
   touch-action: none;
 }

 .instructions {
   margin-top: 8px;
   font-size: 12px;
   color: #aaaacc;
   text-align: center;
   font-weight: bold;
 }

 .status-ready {
   color: #76ff03;
 }

 .status-cooldown {
   color: #ff9900;
 }

 .status-paused {
   color: #ff3366;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
   <h1>Gravity Simulation</h1>
   <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
   <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions" id="status-text">
   Status: <span class="status-ready">READY TO LAUNCH</span> | Press [SPACE] to Pause
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');
 const statusText = document.getElementById('status-text');

 // SIMULATION CONSTANTS
 const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
 const LAUNCH_VELOCITY = 5; // Fixed velocity on click
 const FIXED_LAUNCH_ANGLE = 90; // Base direction in degrees (90° = straight right)
 const TRAIL_LENGTH = 300; // Number of historic trail points stored
 const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
 const MAX_SHIPS = 20; // Upper limit of active rocketships
 const LAUNCH_COOLDOWN_MS = 1000; // 1-second spam-click filter limit (max 1 launch per sec)

 // STATE VARIABLES
 let ships = [];
 let stars = [];
 let nebulas = [];
 let planets = [];
 let asteroids = [];
 let particles = []; // Explosion particle effects
 let lastLaunchTime = 0;
 let isPaused = false;

 // Central Gravity Node Definition (Yellow Sun)
 const centralNode = {
   x: 0,
   y: 0,
   radius: 18
 };

 function generateSpaceBackground() {
   stars = [];
   const starCount = Math.floor((canvas.width * canvas.height) / 3000);
   for (let i = 0; i < starCount; i++) {
     stars.push({
       x: Math.random() * canvas.width,
       y: Math.random() * canvas.height,
       radius: Math.random() * 1.5 + 0.5,
       alpha: Math.random() * 0.8 + 0.2,
       color: ['#ffffff', '#aadbff', '#ffe3a0', '#ffb3d9'][Math.floor(Math.random() * 4)]
     });
   }

   nebulas = [
     { x: canvas.width * 0.2, y: canvas.height * 0.3, radius: Math.max(canvas.width, canvas.height) * 0.35, color: 'rgba(120, 40, 200, 0.22)' },
     { x: canvas.width * 0.8, y: canvas.height * 0.7, radius: Math.max(canvas.width, canvas.height) * 0.4, color: 'rgba(30, 100, 220, 0.22)' },
     { x: canvas.width * 0.5, y: canvas.height * 0.8, radius: Math.max(canvas.width, canvas.height) * 0.3, color: 'rgba(220, 50, 120, 0.15)' }
   ];
 }

 function generatePlanets() {
   planets = [];
   const planetCount = 4;
   const planetStyles = [
     { main: '#33ffaa', shadow: '#007744' },
     { main: '#ff9933', shadow: '#883300', ring: true },
     { main: '#ff55aa', shadow: '#880044', ring: false },
     { main: '#33ccff', shadow: '#0055aa', ring: true }
   ];

   for (let i = 0; i < planetCount; i++) {
     let px, py, distToSun;
     let isValidPosition = false;
     let attempts = 0;
     const radius = 16 + Math.random() * 12;

     while (!isValidPosition && attempts < 100) {
       px = 80 + Math.random() * (canvas.width - 160);
       py = 80 + Math.random() * (canvas.height - 160);

       const dx = px - centralNode.x;
       const dy = py - centralNode.y;
       distToSun = Math.sqrt(dx * dx + dy * dy);

       if (distToSun > 130) {
         isValidPosition = true;
         for (const existing of planets) {
           const edx = px - existing.x;
           const edy = py - existing.y;
           if (Math.sqrt(edx * edx + edy * edy) < radius + existing.radius + 50) {
             isValidPosition = false;
             break;
           }
         }
       }
       attempts++;
     }

     const style = planetStyles[i % planetStyles.length];
     planets.push({
       x: px,
       y: py,
       radius: radius,
       mainColor: style.main,
       shadowColor: style.shadow,
       hasRing: style.ring || false
     });
   }
 }

 function generateAsteroids() {
   asteroids = [];
   const asteroidCount = 6;

   for (let i = 0; i < asteroidCount; i++) {
     const radius = 12 + Math.random() * 10;
     
     // Random jagged polygon points for unique asteroid shape
     const points = [];
     const numVerts = 7 + Math.floor(Math.random() * 4);
     for (let v = 0; v < numVerts; v++) {
       const angle = (v / numVerts) * Math.PI * 2;
       const variance = 0.7 + Math.random() * 0.6;
       points.push({ angle, rRatio: variance });
     }

     asteroids.push({
       x: Math.random() * canvas.width,
       y: Math.random() * canvas.height,
       vx: (Math.random() - 0.5) * 1.5,
       vy: (Math.random() - 0.5) * 1.5,
       radius: radius,
       rotation: Math.random() * Math.PI * 2,
       rotSpeed: (Math.random() - 0.5) * 0.03,
       points: points
     });
   }
 }

 function resizeCanvas() {
   const wrapper = document.getElementById('canvas-wrapper');
   canvas.width = wrapper.clientWidth;
   canvas.height = wrapper.clientHeight;
   
   centralNode.x = canvas.width / 2;
   centralNode.y = canvas.height / 2;

   generateSpaceBackground();
   generatePlanets();
   generateAsteroids();
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 // Pause Toggle Listener (Spacebar)
 window.addEventListener('keydown', (e) => {
   if (e.code === 'Space') {
     e.preventDefault();
     isPaused = !isPaused;
   }
 });

 // Touch & Click Handler with Cooldown Filter (1x per second)
 canvas.addEventListener('pointerdown', (e) => {
   if (isPaused) return;

   const now = Date.now();
   if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
     return;
   }

   const rect = canvas.getBoundingClientRect();
   const clickX = e.clientX - rect.left;
   const clickY = e.clientY - rect.top;

   launchShips(clickX, clickY);
   lastLaunchTime = now;
 });

 function launchShips(x, y) {
   const shipCount = 5;
   const totalSpreadDeg = 30;
   const startAngle = FIXED_LAUNCH_ANGLE - (totalSpreadDeg / 2); 
   const angleStep = totalSpreadDeg / (shipCount - 1); 

   const colors = ['#00e5ff', '#ff3366', '#76ff03', '#ffea00', '#d500f9'];

   for (let i = 0; i < shipCount; i++) {
     const currentAngleDeg = startAngle + (i * angleStep);
     const rad = (currentAngleDeg * Math.PI) / 180;
     const vx = LAUNCH_VELOCITY * Math.sin(rad);
     const vy = -LAUNCH_VELOCITY * Math.cos(rad);

     ships.push({
       x: x,
       y: y,
       vx: vx,
       vy: vy,
       radius: 6,
       color: colors[i % colors.length],
       trail: []
     });
   }

   while (ships.length > MAX_SHIPS) {
     ships.shift();
   }
 }

 function createExplosion(x, y, color) {
   const particleCount = 20;
   for (let i = 0; i < particleCount; i++) {
     const angle = Math.random() * Math.PI * 2;
     const speed = 1 + Math.random() * 4;
     particles.push({
       x: x,
       y: y,
       vx: Math.cos(angle) * speed,
       vy: Math.sin(angle) * speed,
       life: 1.0,
       color: Math.random() > 0.5 ? '#ff4400' : (color || '#ffea00'),
       size: 2 + Math.random() * 3
     });
   }
 }

 function resetSimulation() {
   ships = [];
   particles = [];
   lastLaunchTime = 0;
   generatePlanets();
   generateAsteroids();
 }

 function updatePhysics() {
   // Update explosion particles
   for (let i = particles.length - 1; i >= 0; i--) {
     const p = particles[i];
     p.x += p.vx;
     p.y += p.vy;
     p.life -= 0.03;
     if (p.life <= 0) {
       particles.splice(i, 1);
     }
   }

   // Update asteroids position & screen wrap
   for (const a of asteroids) {
     a.x += a.vx;
     a.y += a.vy;
     a.rotation += a.rotSpeed;

     if (a.x < -a.radius) a.x = canvas.width + a.radius;
     if (a.x > canvas.width + a.radius) a.x = -a.radius;
     if (a.y < -a.radius) a.y = canvas.height + a.radius;
     if (a.y > canvas.height + a.radius) a.y = -a.radius;
   }

   // Ship-to-ship collisions (combine overlapping ships)
   for (let i = 0; i < ships.length; i++) {
     for (let j = i + 1; j < ships.length; j++) {
       const s1 = ships[i];
       const s2 = ships[j];

       const dx = s2.x - s1.x;
       const dy = s2.y - s1.y;
       const dist = Math.sqrt(dx * dx + dy * dy);

       if (dist < s1.radius + s2.radius) {
         // Combine mass (proportional to radius^2)
         const m1 = s1.radius * s1.radius;
         const m2 = s2.radius * s2.radius;
         const totalM = m1 + m2;

         // Conservation of linear momentum
         s1.vx = (s1.vx * m1 + s2.vx * m2) / totalM;
         s1.vy = (s1.vy * m1 + s2.vy * m2) / totalM;

         // Grow ship size (capped at radius 24)
         s1.radius = Math.min(24, Math.sqrt(m1 + m2));

         // Spawn merge effect and remove s2
         createExplosion((s1.x + s2.x) / 2, (s1.y + s2.y) / 2, '#ffffff');
         ships.splice(j, 1);
         j--;
       }
     }
   }

   // Update ship movement and environment interactions
   for (let i = ships.length - 1; i >= 0; i--) {
     const s = ships[i];

     const margin = 500;
     if (s.x < -margin || s.x > canvas.width + margin || 
         s.y < -margin || s.y > canvas.height + margin) {
       ships.splice(i, 1);
       continue;
     }

     // Sun gravity interaction
     const dx = centralNode.x - s.x;
     const dy = centralNode.y - s.y;
     const distSq = dx * dx + dy * dy;
     const dist = Math.sqrt(distSq);

     if (dist < centralNode.radius + s.radius) {
       createExplosion(s.x, s.y, s.color);
       ships.splice(i, 1);
       continue;
     }

     // Asteroid collision check -> SHIP EXPLODES!
     let shipExploded = false;
     for (const a of asteroids) {
       const adx = s.x - a.x;
       const ady = s.y - a.y;
       const aDist = Math.sqrt(adx * adx + ady * ady);

       if (aDist < a.radius + s.radius) {
         createExplosion(s.x, s.y, s.color);
         ships.splice(i, 1);
         shipExploded = true;
         break;
       }
     }
     if (shipExploded) continue;

     // Planet Collision -> Bounce Physics
     for (const p of planets) {
       const pdx = s.x - p.x;
       const pdy = s.y - p.y;
       const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

       if (pDist < p.radius + s.radius) {
         const nx = pdx / pDist;
         const ny = pdy / pDist;
         const dotProduct = s.vx * nx + s.vy * ny;

         if (dotProduct < 0) {
           const bounceDamping = 0.9;
           s.vx = (s.vx - 2 * dotProduct * nx) * bounceDamping;
           s.vy = (s.vy - 2 * dotProduct * ny) * bounceDamping;
         }

         const overlap = (p.radius + s.radius) - pDist;
         s.x += nx * overlap;
         s.y += ny * overlap;
       }
     }

     // Sun Gravity Acceleration
     const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
     const ax = acceleration * (dx / dist);
     const ay = acceleration * (dy / dist);

     s.vx += ax;
     s.vy += ay;
     s.x += s.vx;
     s.y += s.vy;

     s.trail.push({ x: s.x, y: s.y });
     if (s.trail.length > TRAIL_LENGTH) {
       s.trail.shift();
     }
   }
 }

 function updateUI() {
   if (isPaused) {
     statusText.innerHTML = `Status: <span class="status-paused">PAUSED</span> | Press [SPACE] to Resume`;
     return;
   }

   const now = Date.now();
   const timeElapsed = now - lastLaunchTime;

   if (timeElapsed < LAUNCH_COOLDOWN_MS) {
     const remainingSec = ((LAUNCH_COOLDOWN_MS - timeElapsed) / 1000).toFixed(1);
     statusText.innerHTML = `Status: <span class="status-cooldown">RELOADING (${remainingSec}s)...</span> | [SPACE] to Pause`;
   } else {
     statusText.innerHTML = `Status: <span class="status-ready">READY TO LAUNCH</span> | [SPACE] to Pause`;
   }
 }

 function drawBackground() {
   ctx.fillStyle = '#050512';
   ctx.fillRect(0, 0, canvas.width, canvas.height);

   for (const neb of nebulas) {
     const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
     grad.addColorStop(0, neb.color);
     grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
     ctx.fillStyle = grad;
     ctx.fillRect(0, 0, canvas.width, canvas.height);
   }

   for (const star of stars) {
     ctx.save();
     ctx.globalAlpha = star.alpha;
     ctx.fillStyle = star.color;
     ctx.beginPath();
     ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawSun() {
   const sunGlow = ctx.createRadialGradient(
     centralNode.x, centralNode.y, centralNode.radius * 0.5,
     centralNode.x, centralNode.y, centralNode.radius * 3.5
   );
   sunGlow.addColorStop(0, 'rgba(255, 220, 50, 0.8)');
   sunGlow.addColorStop(0.5, 'rgba(255, 140, 0, 0.25)');
   sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');

   ctx.fillStyle = sunGlow;
   ctx.beginPath();
   ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 3.5, 0, Math.PI * 2);
   ctx.fill();

   const sunBody = ctx.createRadialGradient(
     centralNode.x - centralNode.radius * 0.3, centralNode.y - centralNode.radius * 0.3, 2,
     centralNode.x, centralNode.y, centralNode.radius
   );
   sunBody.addColorStop(0, '#ffffff');
   sunBody.addColorStop(0.3, '#fff066');
   sunBody.addColorStop(0.8, '#ffcc00');
   sunBody.addColorStop(1, '#ff8800');

   ctx.fillStyle = sunBody;
   ctx.beginPath();
   ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
   ctx.fill();
 }

 function drawPlanets() {
   for (const p of planets) {
     ctx.save();

     if (p.hasRing) {
       ctx.save();
       ctx.translate(p.x, p.y);
       ctx.rotate(-Math.PI / 6);
       ctx.beginPath();
       ctx.ellipse(0, 0, p.radius * 1.8, p.radius * 0.4, 0, 0, Math.PI * 2);
       ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
       ctx.lineWidth = 3;
       ctx.stroke();
       ctx.restore();
     }

     const pGrad = ctx.createRadialGradient(
       p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.1,
       p.x, p.y, p.radius
     );
     pGrad.addColorStop(0, '#ffffff');
     pGrad.addColorStop(0.35, p.mainColor);
     pGrad.addColorStop(1, p.shadowColor);

     ctx.fillStyle = pGrad;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
     ctx.fill();

     ctx.restore();
   }
 }

 function drawAsteroids() {
   for (const a of asteroids) {
     ctx.save();
     ctx.translate(a.x, a.y);
     ctx.rotate(a.rotation);

     ctx.beginPath();
     for (let i = 0; i < a.points.length; i++) {
       const pt = a.points[i];
       const r = a.radius * pt.rRatio;
       const px = Math.cos(pt.angle) * r;
       const py = Math.sin(pt.angle) * r;
       if (i === 0) ctx.moveTo(px, py);
       else ctx.lineTo(px, py);
     }
     ctx.closePath();

     ctx.fillStyle = '#666677';
     ctx.fill();
     ctx.strokeStyle = '#9999bb';
     ctx.lineWidth = 1.5;
     ctx.stroke();

     ctx.restore();
   }
 }

 function drawParticles() {
   for (const p of particles) {
     ctx.save();
     ctx.globalAlpha = p.life;
     ctx.fillStyle = p.color;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawRocket(s) {
   const angle = Math.atan2(s.vy, s.vx);
   const scale = s.radius / 6; // Dynamic visual scale based on ship size

   ctx.save();
   ctx.translate(s.x, s.y);
   ctx.rotate(angle);
   ctx.scale(scale, scale);

   // Animated Exhaust Flame
   ctx.fillStyle = '#ff4400';
   ctx.beginPath();
   ctx.moveTo(-8, -3);
   ctx.lineTo(-14 - Math.random() * 5, 0);
   ctx.lineTo(-8, 3);
   ctx.closePath();
   ctx.fill();

   ctx.fillStyle = '#ffea00';
   ctx.beginPath();
   ctx.moveTo(-8, -1.5);
   ctx.lineTo(-11 - Math.random() * 3, 0);
   ctx.lineTo(-8, 1.5);
   ctx.closePath();
   ctx.fill();

   // Ship body
   ctx.fillStyle = s.color;
   ctx.beginPath();
   ctx.moveTo(11, 0);
   ctx.lineTo(-6, -6);
   ctx.lineTo(-4, 0);
   ctx.lineTo(-6, 6);
   ctx.closePath();
   ctx.fill();

   ctx.fillStyle = '#ffffff';
   ctx.beginPath();
   ctx.moveTo(11, 0);
   ctx.lineTo(3, -3);
   ctx.lineTo(3, 3);
   ctx.closePath();
   ctx.fill();

   ctx.fillStyle = '#003366';
   ctx.beginPath();
   ctx.arc(1, 0, 2, 0, Math.PI * 2);
   ctx.fill();

   ctx.restore();
 }

 function drawPauseOverlay() {
   ctx.save();
   ctx.fillStyle = 'rgba(5, 5, 16, 0.5)';
   ctx.fillRect(0, 0, canvas.width, canvas.height);

   ctx.font = 'bold 32px "Courier New", monospace';
   ctx.fillStyle = '#ffd700';
   ctx.textAlign = 'center';
   ctx.textBaseline = 'middle';
   ctx.shadowColor = 'rgba(255, 215, 0, 0.6)';
   ctx.shadowBlur = 12;
   ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 10);

   ctx.font = '14px "Courier New", monospace';
   ctx.fillStyle = '#ffffff';
   ctx.shadowBlur = 0;
   ctx.fillText('Press [SPACE] to Resume', canvas.width / 2, canvas.height / 2 + 25);
   ctx.restore();
 }

 function draw() {
   drawBackground();
   drawPlanets();
   drawAsteroids();
   drawSun();
   drawParticles();

   for (const s of ships) {
     if (s.trail.length > 1) {
       ctx.beginPath();
       ctx.moveTo(s.trail[0].x, s.trail[0].y);
       for (let t = 1; t < s.trail.length; t++) {
         ctx.lineTo(s.trail[t].x, s.trail[t].y);
       }
       ctx.strokeStyle = s.color;
       ctx.globalAlpha = 0.45;
       ctx.lineWidth = Math.min(4, 1.5 * (s.radius / 6));
       ctx.stroke();
       ctx.globalAlpha = 1.0;
     }

     drawRocket(s);
   }

   if (isPaused) {
     drawPauseOverlay();
   }
 }

 function animate() {
   if (!isPaused) {
     updatePhysics();
   }
   updateUI();
   draw();
   requestAnimationFrame(animate);
 }

 window.onload = function() {
   animate();
 };
 </script>
</body>
</html>
