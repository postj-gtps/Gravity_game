<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Gravity Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #03030b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: #70d6ff;
            text-shadow: 0 0 8px rgba(112, 214, 255, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-size: 13px;
            letter-spacing: 1px;
            color: #ff70a6;
            font-weight: bold;
        }

        select {
            background: #0f1026;
            color: #ffd670;
            border: 1px solid #70d6ff;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        select:hover, select:focus {
            border-color: #ff70a6;
            box-shadow: 0 0 8px rgba(255, 112, 166, 0.5);
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #020208;
            border: 1px solid rgba(112, 214, 255, 0.4);
            box-shadow: 0 0 20px rgba(112, 214, 255, 0.15);
            border-radius: 6px;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #a0a5c0;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #cooldown-status {
            font-weight: bold;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Galaxy Gravity Simulator</h1>
        <div class="controls">
            <label for="center-object">Center Mass:</label>
            <select id="center-object" onchange="changeCenterObject(this.value)">
                <option value="sun">Sun (Massive)</option>
                <option value="jupiter">Jupiter (Very Large)</option>
                <option value="saturn">Saturn (Large)</option>
                <option value="uranus">Uranus (Medium-Large)</option>
                <option value="neptune">Neptune (Medium-Large)</option>
                <option value="earth">Earth (Medium)</option>
                <option value="venus">Venus (Medium-Small)</option>
                <option value="mars">Mars (Small)</option>
                <option value="mercury">Mercury (Tiny)</option>
            </select>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click canvas to launch 10 rockets outward! Max 50 rockets. <span id="cooldown-status" style="color:#70d6ff;">Ready to Launch</span>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const cooldownStatus = document.getElementById('cooldown-status');

        // SIMULATION CONSTANTS
        const LAUNCH_SPEED = 4.5;         // Velocity of radiating rockets
        const TRAIL_LENGTH = 150;         // Orbit trail length
        const SOFTENING_FACTOR = 400;     // Softening factor for gravity calculations
        const MAX_ROCKETS = 50;           // Maximum allowed rockets on screen
        const COOLDOWN_MS = 1000;         // 1-second spam filter

        // CELESTIAL OBJECT DEFINITIONS (Gravity scales with relative size)
        const CELESTIAL_BODY_DATA = {
            sun: { name: 'Sun', radius: 26, gravity: 3200, color: '#ffcc00', glow: '#ff6600', detail: 'sun' },
            jupiter: { name: 'Jupiter', radius: 20, gravity: 2200, color: '#d8ca9d', detail: 'jupiter' },
            saturn: { name: 'Saturn', radius: 17, gravity: 1800, color: '#e4d191', detail: 'saturn' },
            uranus: { name: 'Uranus', radius: 14, gravity: 1400, color: '#7de3e4', detail: 'uranus' },
            neptune: { name: 'Neptune', radius: 13, gravity: 1300, color: '#4b70dd', detail: 'neptune' },
            earth: { name: 'Earth', radius: 10, gravity: 1000, color: '#2b82c9', detail: 'earth' },
            venus: { name: 'Venus', radius: 9, gravity: 850, color: '#e3bb76', detail: 'venus' },
            mars: { name: 'Mars', radius: 7, gravity: 600, color: '#c1440e', detail: 'mars' },
            mercury: { name: 'Mercury', radius: 5, gravity: 350, color: '#8c8c8c', detail: 'mercury' }
        };

        // STATE VARIABLES
        let rockets = [];
        let stars = [];
        let nebulae = [];
        let flameParticles = [];
        let lastLaunchTime = 0;

        // Central Object State
        const centralNode = {
            x: 0,
            y: 0,
            type: 'sun',
            radius: CELESTIAL_BODY_DATA.sun.radius,
            gravity: CELESTIAL_BODY_DATA.sun.gravity,
            color: CELESTIAL_BODY_DATA.sun.color
        };

        // Generate Galaxy Background (Twinkling Stars & Deep Space Nebulae)
        function initGalaxyBackground() {
            stars = [];
            nebulae = [];

            // Background Stars
            const numStars = Math.floor((canvas.width * canvas.height) / 3500);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.8 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.03 + 0.005,
                    color: ['#ffffff', '#a0c4ff', '#ffc6ff', '#ffd6a5', '#caffbf'][Math.floor(Math.random() * 5)]
                });
            }

            // Cosmic Gas Clouds (Nebulae)
            const nebulaColors = [
                { r: 138, g: 43, b: 226, a: 0.12 },  // Deep Purple
                { r: 0, g: 180, b: 216, a: 0.10 },   // Electric Cyan
                { r: 247, g: 37, b: 133, a: 0.08 },  // Magenta
                { r: 72, g: 12, b: 168, a: 0.15 }    // Indigo
            ];

            for (let i = 0; i < 5; i++) {
                const color = nebulaColors[i % nebulaColors.length];
                nebulae.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 250 + 150,
                    color: color
                });
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter gravity node
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            initGalaxyBackground();
        }

        window.addEventListener('resize', resizeCanvas);

        function changeCenterObject(key) {
            const data = CELESTIAL_BODY_DATA[key];
            centralNode.type = key;
            centralNode.radius = data.radius;
            centralNode.gravity = data.gravity;
            centralNode.color = data.color;
        }

        // Canvas Click Handler with 1-second Spam Click Filter
        canvas.addEventListener('click', (e) => {
            const now = Date.now();
            if (now - lastLaunchTime < COOLDOWN_MS) {
                return; // Enforce 1x per second spam restriction
            }

            lastLaunchTime = now;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            launchRocketBurst(clickX, clickY);
        });

        function launchRocketBurst(x, y) {
            const ROCKET_COUNT = 10;
            const baseAngle = Math.random() * Math.PI * 2;

            // Strict maximum of 50 rockets on screen at a time
            while (rockets.length + ROCKET_COUNT > MAX_ROCKETS) {
                rockets.shift();
            }

            // Spawn 10 rockets radiating outward in 360 degrees
            for (let i = 0; i < ROCKET_COUNT; i++) {
                const angle = baseAngle + (i * Math.PI * 2) / ROCKET_COUNT;
                const hue = Math.floor(Math.random() * 360);

                rockets.push({
                    x: x,
                    y: y,
                    vx: LAUNCH_SPEED * Math.cos(angle),
                    vy: LAUNCH_SPEED * Math.sin(angle),
                    hue: hue,
                    color: `hsl(${hue}, 85%, 60%)`,
                    trailColor: `hsla(${hue}, 85%, 60%, 0.4)`,
                    radius: 5,
                    trail: []
                });
            }
        }

        function resetSimulation() {
            rockets = [];
            flameParticles = [];
        }

        function updatePhysics() {
            // Update Cooldown Status Indicator
            const timeRemaining = COOLDOWN_MS - (Date.now() - lastLaunchTime);
            if (timeRemaining <= 0) {
                cooldownStatus.textContent = 'Ready to Launch';
                cooldownStatus.style.color = '#70d6ff';
            } else {
                cooldownStatus.textContent = `Cooldown (${(timeRemaining / 1000).toFixed(1)}s)`;
                cooldownStatus.style.color = '#ff9770';
            }

            // Update Rocket Motion
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];

                // Remove rockets travelling far off-screen
                const margin = 400;
                if (r.x < -margin || r.x > canvas.width + margin ||
                    r.y < -margin || r.y > canvas.height + margin) {
                    rockets.splice(i, 1);
                    continue;
                }

                // Distance to central gravity mass
                const dx = centralNode.x - r.x;
                const dy = centralNode.y - r.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Collision with central celestial body
                if (dist < centralNode.radius + r.radius) {
                    createExplosionParticles(r.x, r.y, r.hue);
                    rockets.splice(i, 1);
                    continue;
                }

                // Inverse square law gravity acceleration
                const acceleration = centralNode.gravity / (distSq + SOFTENING_FACTOR);

                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                r.vx += ax;
                r.vy += ay;
                r.x += r.vx;
                r.y += r.vy;

                // Path trail updates
                r.trail.push({ x: r.x, y: r.y });
                if (r.trail.length > TRAIL_LENGTH) {
                    r.trail.shift();
                }

                // Flame exhaust particle generation behind rocket
                const speed = Math.hypot(r.vx, r.vy);
                if (speed > 0.1) {
                    const normVx = r.vx / speed;
                    const normVy = r.vy / speed;

                    flameParticles.push({
                        x: r.x - normVx * 8,
                        y: r.y - normVy * 8,
                        vx: -normVx * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.5,
                        vy: -normVy * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 3 + 2,
                        life: 1.0,
                        decay: Math.random() * 0.08 + 0.04,
                        hue: (r.hue + (Math.random() * 40 - 20) + 360) % 360
                    });
                }
            }

            // Update Exhaust Flame Particles
            for (let i = flameParticles.length - 1; i >= 0; i--) {
                const p = flameParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.size *= 0.94;

                if (p.life <= 0 || p.size < 0.3) {
                    flameParticles.splice(i, 1);
                }
            }
        }

        function createExplosionParticles(x, y, hue) {
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 3 + 1;
                flameParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    size: Math.random() * 4 + 3,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.03,
                    hue: hue
                });
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#03030b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Nebulae
            nebulae.forEach(neb => {
                const grad = ctx.createRadialGradient(neb.x, neb.y, 10, neb.x, neb.y, neb.radius);
                grad.addColorStop(0, `rgba(${neb.color.r}, ${neb.color.g}, ${neb.color.b}, ${neb.color.a})`);
                grad.addColorStop(1, 'rgba(3, 3, 11, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(neb.x, neb.y, neb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render Twinkling Stars
            stars.forEach(star => {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.2) star.twinkleSpeed = -star.twinkleSpeed;

                ctx.fillStyle = star.color;
                ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawCentralObject() {
            const data = CELESTIAL_BODY_DATA[centralNode.type];
            const x = centralNode.x;
            const y = centralNode.y;
            const r = centralNode.radius;

            // Outer Atmospheric Glow
            const glowGrad = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 2.5);
            glowGrad.addColorStop(0, data.glow || data.color);
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Ring rendering (Saturn & Uranus)
            if (data.detail === 'saturn') {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1.8, 0.5);
                ctx.beginPath();
                ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(228, 209, 145, 0.7)';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            } else if (data.detail === 'uranus') {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(Math.PI / 4);
                ctx.scale(1.6, 0.4);
                ctx.beginPath();
                ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(125, 227, 228, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            // Main Sphere Shading
            const bodyGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
            bodyGrad.addColorStop(0, '#ffffff');
            bodyGrad.addColorStop(0.4, data.color);
            bodyGrad.addColorStop(1, '#000000');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            // Planet Visual Details (Jupiter bands, Earth continents)
            if (data.detail === 'jupiter') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = 'rgba(140, 80, 40, 0.4)';
                ctx.fillRect(x - r, y - r * 0.3, r * 2, r * 0.25);
                ctx.fillRect(x - r, y + r * 0.1, r * 2, r * 0.2);
                ctx.fillStyle = '#b03a2e';
                ctx.beginPath();
                ctx.ellipse(x + r * 0.3, y + r * 0.2, r * 0.25, r * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (data.detail === 'earth') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = '#27ae60';
                ctx.beginPath();
                ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.5, 0, Math.PI * 2);
                ctx.arc(x + r * 0.3, y + r * 0.3, r * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawRockets() {
            // Draw Flame Exhaust Trail Particles
            flameParticles.forEach(p => {
                ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Orbit Trails & Rocket Models
            rockets.forEach(r => {
                if (r.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(r.trail[0].x, r.trail[0].y);
                    for (let t = 1; t < r.trail.length; t++) {
                        ctx.lineTo(r.trail[t].x, r.trail[t].y);
                    }
                    ctx.strokeStyle = r.trailColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                // Direction heading angle from velocity vector
                const angle = Math.atan2(r.vy, r.vx);

                ctx.save();
                ctx.translate(r.x, r.y);
                ctx.rotate(angle);

                // Main Rocket Body
                ctx.fillStyle = r.color;
                ctx.beginPath();
                ctx.moveTo(10, 0);          // Nose tip
                ctx.lineTo(-6, -5);         // Upper fin
                ctx.lineTo(-3, 0);          // Tail notch
                ctx.lineTo(-6, 5);          // Lower fin
                ctx.closePath();
                ctx.fill();

                // Rocket Porthole
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(2, 0, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Active Engine Thrust Flame
                const flameLength = Math.random() * 8 + 6;
                ctx.fillStyle = `hsl(${(r.hue + 30) % 360}, 100%, 55%)`;
                ctx.beginPath();
                ctx.moveTo(-3, 0);
                ctx.lineTo(-3 - flameLength, -2.5);
                ctx.lineTo(-3 - flameLength * 1.3, 0);
                ctx.lineTo(-3 - flameLength, 2.5);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            });
        }

        function draw() {
            drawBackground();
            drawCentralObject();
            drawRockets();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
