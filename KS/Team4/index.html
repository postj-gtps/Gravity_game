<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics Simulation - Rocket Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #020208;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 10;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .btn-reset {
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
      border-radius: 4px;
    }

    .btn-reset:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none; /* Prevents Chromebook touchscreen gestures from scrolling */
    }

    canvas {
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation - Rocket Edition</h1>
    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click anywhere to launch a rocket ship! Watch out for corner asteroids! (1 launch per second max)
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Offscreen background canvas to pre-render space, Sun, planets & astronauts once for smooth Chromebook performance
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const LAUNCH_VELOCITY = 5; // Fixed velocity on click
    const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
    const TRAIL_LENGTH = 300; // Number of historic trail points stored
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const MAX_ASTEROIDS = 6; // Initial active asteroids on screen
    const LAUNCH_COOLDOWN_MS = 1000; // Spam-click filter (max 1 launch per second)

    // STATE VARIABLES
    let balls = [];
    let asteroids = [];
    let sparks = [];
    let lastLaunchTime = 0;

    // Central Gravity Node Definition (Sun)
    const centralNode = {
      x: 0,
      y: 0,
      radius: 18
    };

    // Helper function to render a background astronaut
    function drawAstronaut(targetCtx, x, y, scale, rotation) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.rotate(rotation);
      targetCtx.scale(scale, scale);

      // Life support backpack
      targetCtx.fillStyle = '#b0b0c0';
      targetCtx.fillRect(-10, -12, 20, 24);

      // Suit Body
      targetCtx.fillStyle = '#e6e6f0';
      targetCtx.beginPath();
      targetCtx.arc(0, -2, 7, Math.PI, 0);
      targetCtx.rect(-7, -2, 14, 14);
      targetCtx.fill();

      // Arms (floating/waving pose)
      targetCtx.lineWidth = 4;
      targetCtx.strokeStyle = '#e6e6f0';
      targetCtx.lineCap = 'round';
      
      // Left arm
      targetCtx.beginPath();
      targetCtx.moveTo(-7, -2);
      targetCtx.lineTo(-14, -8);
      targetCtx.lineTo(-12, -16);
      targetCtx.stroke();

      // Right arm
      targetCtx.beginPath();
      targetCtx.moveTo(7, -2);
      targetCtx.lineTo(14, 4);
      targetCtx.stroke();

      // Legs
      targetCtx.beginPath();
      targetCtx.moveTo(-4, 12);
      targetCtx.lineTo(-8, 22);
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.moveTo(4, 12);
      targetCtx.lineTo(7, 20);
      targetCtx.stroke();

      // Helmet
      targetCtx.fillStyle = '#ffffff';
      targetCtx.beginPath();
      targetCtx.arc(0, -12, 8, 0, Math.PI * 2);
      targetCtx.fill();

      // Gold Visor Shine
      targetCtx.fillStyle = '#ffb703';
      targetCtx.beginPath();
      targetCtx.arc(2, -12, 5, 0, Math.PI * 2);
      targetCtx.fill();

      // Visor Glare
      targetCtx.fillStyle = '#ffffff';
      targetCtx.beginPath();
      targetCtx.arc(3, -14, 1.5, 0, Math.PI * 2);
      targetCtx.fill();

      // Mission Patches (Red & Blue)
      targetCtx.fillStyle = '#e63946';
      targetCtx.fillRect(-4, -4, 3, 3);
      targetCtx.fillStyle = '#1d3557';
      targetCtx.fillRect(1, -4, 3, 3);

      // Tether line fading into deep space
      targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      targetCtx.lineWidth = 1;
      targetCtx.beginPath();
      targetCtx.moveTo(0, 0);
      targetCtx.bezierCurveTo(-20, 30, -50, 20, -80, 60);
      targetCtx.stroke();

      targetCtx.restore();
    }

    // Pre-rendered Milky Way + Solar System Generator
    function renderGalacticBackground() {
      bgCanvas.width = canvas.width;
      bgCanvas.height = canvas.height;

      const w = bgCanvas.width;
      const h = bgCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // Deep space baseline
      bgCtx.fillStyle = '#03030c';
      bgCtx.fillRect(0, 0, w, h);

      // Faint background starfield across entire view
      const numDistStars = Math.floor((w * h) / 1200);
      for (let i = 0; i < numDistStars; i++) {
        const sx = Math.random() * w;
        const sy = Math.random() * h;
        const size = Math.random() * 1.2;
        const alpha = Math.random() * 0.7 + 0.2;
        bgCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        bgCtx.fillRect(sx, sy, size, size);
      }

      // Milky Way Galactic Band
      bgCtx.save();
      bgCtx.translate(cx, cy);
      bgCtx.rotate(-Math.PI / 6); // -30 degree angle

      const bandWidth = Math.max(w, h) * 1.5;
      const bandHeight = Math.min(w, h) * 0.55;

      const drawNebulaGlow = (offX, offY, rX, rY, colorStops) => {
        bgCtx.save();
        bgCtx.translate(offX, offY);
        bgCtx.scale(1, rY / rX);
        const grad = bgCtx.createRadialGradient(0, 0, 0, 0, 0, rX);
        colorStops.forEach(cs => grad.addColorStop(cs.stop, cs.color));
        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(0, 0, rX, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      };

      // Outer galactic halo / cosmic clouds
      drawNebulaGlow(0, 0, bandWidth * 0.5, bandHeight * 0.8, [
        { stop: 0, color: 'rgba(140, 110, 190, 0.28)' },
        { stop: 0.4, color: 'rgba(70, 50, 130, 0.18)' },
        { stop: 0.7, color: 'rgba(20, 30, 80, 0.08)' },
        { stop: 1, color: 'rgba(0, 0, 0, 0)' }
      ]);

      // Bright galactic core bloom
      drawNebulaGlow(0, 0, bandWidth * 0.2, bandHeight * 0.4, [
        { stop: 0, color: 'rgba(255, 240, 210, 0.35)' },
        { stop: 0.3, color: 'rgba(230, 170, 210, 0.20)' },
        { stop: 0.6, color: 'rgba(120, 80, 180, 0.10)' },
        { stop: 1, color: 'rgba(0, 0, 0, 0)' }
      ]);

      // Dense star cluster concentrated along galactic plane
      const numMilkyStars = Math.floor((w * h) / 400);
      for (let i = 0; i < numMilkyStars; i++) {
        const u1 = Math.random();
        const u2 = Math.random();
        const randStdNorm = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        
        const sx = (Math.random() - 0.5) * bandWidth;
        const sy = randStdNorm * (bandHeight * 0.22);

        if (Math.abs(sx) < bandWidth / 2 && Math.abs(sy) < bandHeight / 2) {
          const size = Math.random() < 0.95 ? Math.random() * 1.5 + 0.5 : Math.random() * 2.2 + 1;
          const bright = Math.random();
          let starColor;

          if (bright > 0.85) starColor = `rgba(255, 230, 190, ${Math.random() * 0.8 + 0.2})`;
          else if (bright > 0.6) starColor = `rgba(190, 220, 255, ${Math.random() * 0.8 + 0.2})`;
          else starColor = `rgba(255, 255, 255, ${Math.random() * 0.6 + 0.2})`;

          bgCtx.fillStyle = starColor;
          bgCtx.beginPath();
          bgCtx.arc(sx, sy, size / 2, 0, Math.PI * 2);
          bgCtx.fill();
        }
      }

      bgCtx.restore();

      // --- 3 BACKGROUND ASTRONAUTS ---
      drawAstronaut(bgCtx, w * 0.18, h * 0.22, 0.9, -0.35); // Top-left astronaut
      drawAstronaut(bgCtx, w * 0.82, h * 0.38, 1.1, 0.55);  // Mid-right astronaut
      drawAstronaut(bgCtx, w * 0.28, h * 0.78, 0.75, 0.20); // Bottom-left astronaut

      // --- SOLAR SYSTEM BACKGROUND ART ---
      const planets = [
        { name: 'Mercury', dist: 42, size: 3.5, angle: 0.4, color: '#b5a397' },
        { name: 'Venus', dist: 65, size: 5.5, angle: 2.1, color: '#e3bb76' },
        { name: 'Earth', dist: 95, size: 6.5, angle: 4.2, color: '#4b9cd3', hasMoon: true },
        { name: 'Mars', dist: 130, size: 5.0, angle: 1.1, color: '#e25822' },
        { name: 'Jupiter', dist: 175, size: 13.0, angle: 5.5, color: '#d8ca9d', hasBands: true },
        { name: 'Saturn', dist: 230, size: 10.0, angle: 3.3, color: '#ead6b8', hasRings: true },
        { name: 'Uranus', dist: 280, size: 7.5, angle: 0.8, color: '#7bf0ff' },
        { name: 'Neptune', dist: 325, size: 7.0, angle: 2.7, color: '#2b65ec' }
      ];

      // Sun Corona Flare Glow
      const sunGlow = bgCtx.createRadialGradient(cx, cy, 10, cx, cy, 75);
      sunGlow.addColorStop(0, 'rgba(255, 220, 80, 0.65)');
      sunGlow.addColorStop(0.3, 'rgba(255, 140, 0, 0.35)');
      sunGlow.addColorStop(0.7, 'rgba(255, 60, 0, 0.12)');
      sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      bgCtx.fillStyle = sunGlow;
      bgCtx.beginPath();
      bgCtx.arc(cx, cy, 75, 0, Math.PI * 2);
      bgCtx.fill();

      // Sun Sphere Body
      const sunGradient = bgCtx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, centralNode.radius);
      sunGradient.addColorStop(0, '#ffffff');
      sunGradient.addColorStop(0.4, '#ffea00');
      sunGradient.addColorStop(0.8, '#ff8000');
      sunGradient.addColorStop(1, '#cc3300');
      bgCtx.fillStyle = sunGradient;
      bgCtx.beginPath();
      bgCtx.arc(cx, cy, centralNode.radius, 0, Math.PI * 2);
      bgCtx.fill();

      // Render Planet Orbits and Planets
      planets.forEach(p => {
        // Orbital Track Line
        bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        bgCtx.lineWidth = 1;
        bgCtx.setLineDash([3, 5]);
        bgCtx.beginPath();
        bgCtx.arc(cx, cy, p.dist, 0, Math.PI * 2);
        bgCtx.stroke();
        bgCtx.setLineDash([]);

        // Calculate planet position
        const px = cx + Math.cos(p.angle) * p.dist;
        const py = cy + Math.sin(p.angle) * p.dist;

        // Draw Saturn's Rings
        if (p.hasRings) {
          bgCtx.save();
          bgCtx.translate(px, py);
          bgCtx.rotate(Math.PI / 6);
          bgCtx.scale(1, 0.35);
          bgCtx.strokeStyle = 'rgba(210, 180, 140, 0.75)';
          bgCtx.lineWidth = 4;
          bgCtx.beginPath();
          bgCtx.arc(0, 0, p.size * 1.85, 0, Math.PI * 2);
          bgCtx.stroke();
          bgCtx.restore();
        }

        // Draw Planet Body
        bgCtx.fillStyle = p.color;
        bgCtx.beginPath();
        bgCtx.arc(px, py, p.size, 0, Math.PI * 2);
        bgCtx.fill();

        // Planet Details
        if (p.name === 'Earth') {
          // Green continent accent
          bgCtx.fillStyle = '#3a9d23';
          bgCtx.beginPath();
          bgCtx.arc(px - 1.5, py - 1, p.size * 0.45, 0, Math.PI * 2);
          bgCtx.fill();

          // Earth's Moon
          bgCtx.fillStyle = '#dddddd';
          bgCtx.beginPath();
          bgCtx.arc(px + 10, py - 4, 1.8, 0, Math.PI * 2);
          bgCtx.fill();
        } else if (p.hasBands) {
          // Jupiter stripes & Red spot
          bgCtx.fillStyle = '#b08b59';
          bgCtx.fillRect(px - p.size * 0.8, py - 2.5, p.size * 1.6, 2);
          bgCtx.fillRect(px - p.size * 0.8, py + 1.5, p.size * 1.6, 2);

          bgCtx.fillStyle = '#c0392b';
          bgCtx.beginPath();
          bgCtx.arc(px + 3, py + 2.5, 2.5, 0, Math.PI * 2);
          bgCtx.fill();
        }
      });
    }

    // ASTEROID GENERATION LOGIC
    function createAsteroid(fromEdge = true) {
      const radius = Math.random() * 14 + 14;
      let x, y;

      if (fromEdge) {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { x = -radius; y = Math.random() * canvas.height; }
        else if (edge === 1) { x = canvas.width + radius; y = Math.random() * canvas.height; }
        else if (edge === 2) { x = Math.random() * canvas.width; y = -radius; }
        else { x = Math.random() * canvas.width; y = canvas.height + radius; }
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() * canvas.height;
        if (Math.hypot(x - centralNode.x, y - centralNode.y) < 160) {
          x += 200;
        }
      }

      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 1.2 + 0.6;

      const numPoints = Math.floor(Math.random() * 4) + 7;
      const vertices = [];
      for (let i = 0; i < numPoints; i++) {
        const a = (i / numPoints) * Math.PI * 2;
        const offset = Math.random() * 0.35 + 0.8;
        vertices.push({ angle: a, offset: offset });
      }

      return {
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: radius,
        vertices: vertices,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.02
      };
    }

    // Corner Asteroid Spawner (Spawns 1 asteroid from a specific corner within its 90 degree inward arc)
    function createCornerAsteroid(cornerIndex) {
      const radius = Math.random() * 14 + 12;
      let x, y, minAngle, maxAngle;

      if (cornerIndex === 0) {
        // Top-Left corner: angle 0 to 90 degrees (0 to PI/2)
        x = 0;
        y = 0;
        minAngle = 0;
        maxAngle = Math.PI / 2;
      } else if (cornerIndex === 1) {
        // Top-Right corner: angle 90 to 180 degrees (PI/2 to PI)
        x = canvas.width;
        y = 0;
        minAngle = Math.PI / 2;
        maxAngle = Math.PI;
      } else if (cornerIndex === 2) {
        // Bottom-Right corner: angle 180 to 270 degrees (PI to 3*PI/2)
        x = canvas.width;
        y = canvas.height;
        minAngle = Math.PI;
        maxAngle = (3 * Math.PI) / 2;
      } else {
        // Bottom-Left corner: angle 270 to 360 degrees (3*PI/2 to 2*PI)
        x = 0;
        y = canvas.height;
        minAngle = (3 * Math.PI) / 2;
        maxAngle = Math.PI * 2;
      }

      const angle = minAngle + Math.random() * (maxAngle - minAngle);
      const speed = Math.random() * 1.8 + 0.8;

      const numPoints = Math.floor(Math.random() * 4) + 7;
      const vertices = [];
      for (let i = 0; i < numPoints; i++) {
        const a = (i / numPoints) * Math.PI * 2;
        const offset = Math.random() * 0.35 + 0.8;
        vertices.push({ angle: a, offset: offset });
      }

      return {
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: radius,
        vertices: vertices,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.03
      };
    }

    function spawnCornerAsteroids() {
      for (let i = 0; i < 4; i++) {
        asteroids.push(createCornerAsteroid(i));
      }
    }

    function initAsteroids() {
      asteroids = [];
      for (let i = 0; i < MAX_ASTEROIDS; i++) {
        asteroids.push(createAsteroid(false));
      }
    }

    // SPARK PARTICLES FOR COLLISION IMPACTS
    function createSparks(x, y, nx, ny) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.atan2(ny, nx) + (Math.random() - 0.5) * 1.5;
        const speed = Math.random() * 3 + 1;
        sparks.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0
        });
      }
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;

      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;

      renderGalacticBackground();
      if (asteroids.length === 0) initAsteroids();
    }

    window.addEventListener('resize', resizeCanvas);

    // Pointer Launch Event Handler with Spam-Click Filter
    function handlePointerLaunch(e) {
      e.preventDefault();

      // Spam-click rate limit filter (1 launch max per second)
      const now = Date.now();
      if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
        return;
      }
      lastLaunchTime = now;

      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const launchX = clientX - rect.left;
      const launchY = clientY - rect.top;

      launchBall(launchX, launchY);
    }

    canvas.addEventListener('click', handlePointerLaunch);
    canvas.addEventListener('touchstart', handlePointerLaunch, { passive: false });

    function launchBall(x, y) {
      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = LAUNCH_VELOCITY * Math.sin(rad);
      const vy = -LAUNCH_VELOCITY * Math.cos(rad);

      balls = [{
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 8, // Outer collision bounding radius
        trail: []
      }];

      // Simultaneously spawn an asteroid from each corner on launch
      spawnCornerAsteroids();
    }

    function resetSimulation() {
      balls = [];
      initAsteroids();
      sparks = [];
    }

    function updatePhysics() {
      // 1. UPDATE ASTEROIDS & BOUNCE COLLISIONS
      for (let i = 0; i < asteroids.length; i++) {
        const ast = asteroids[i];
        ast.x += ast.vx;
        ast.y += ast.vy;
        ast.rotation += ast.vRot;

        const pad = ast.radius + 80;
        if (ast.x < -pad || ast.x > canvas.width + pad ||
            ast.y < -pad || ast.y > canvas.height + pad) {
          asteroids.splice(i, 1);
          i--;
          continue;
        }

        for (const b of balls) {
          const dx = b.x - ast.x;
          const dy = b.y - ast.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b.radius + ast.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            const overlap = minDist - dist;
            b.x += nx * overlap;
            b.y += ny * overlap;

            const relVx = b.vx - ast.vx;
            const relVy = b.vy - ast.vy;
            const velAlongNormal = relVx * nx + relVy * ny;

            if (velAlongNormal < 0) {
              const restitution = 0.88;
              const impulse = -(1 + restitution) * velAlongNormal;

              b.vx += impulse * nx;
              b.vy += impulse * ny;

              createSparks(b.x, b.y, nx, ny);
            }
          }
        }
      }

      // 2. UPDATE SPARKS
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.04;
        if (s.life <= 0) sparks.splice(i, 1);
      }

      // 3. UPDATE PROBE PHYSICS & GRAVITY
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        const margin = 500;
        if (b.x < -margin || b.x > canvas.width + margin || 
            b.y < -margin || b.y > canvas.height + margin) {
          balls.splice(i, 1);
          continue;
        }

        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }
    }

    function draw() {
      // 1. Draw Pre-rendered Galaxy, Solar System & Astronaut Background
      ctx.drawImage(bgCanvas, 0, 0);

      // 2. Draw Asteroids
      for (const ast of asteroids) {
        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.rotation);

        ctx.beginPath();
        for (let i = 0; i < ast.vertices.length; i++) {
          const v = ast.vertices[i];
          const r = ast.radius * v.offset;
          const vx = r * Math.cos(v.angle);
          const vy = r * Math.sin(v.angle);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.closePath();

        ctx.fillStyle = '#3a3a4c';
        ctx.fill();
        ctx.strokeStyle = '#8b8ba8';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-ast.radius * 0.3, -ast.radius * 0.2, ast.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(20, 20, 30, 0.4)';
        ctx.fill();

        ctx.restore();
      }

      // 3. Draw Impact Sparks
      for (const s of sparks) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 220, 120, ${s.life})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 4. Draw Rocket Probes & Orbit Trails
      for (const b of balls) {
        // Glowing cyan path line
        if (b.trail.length > 1) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let t = 1; t < b.trail.length; t++) {
            ctx.lineTo(b.trail[t].x, b.trail[t].y);
          }
          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 6;
          ctx.stroke();
          ctx.restore();
        }

        // Draw Detailed Vector Rocket Ship
        ctx.save();
        ctx.translate(b.x, b.y);

        // Rotate rocket body to align with its directional velocity angle
        const angle = Math.atan2(b.vy, b.vx);
        ctx.rotate(angle + Math.PI / 2);

        // Thruster Flame (animated flicker)
        const flameLen = 8 + Math.random() * 7;
        ctx.beginPath();
        ctx.moveTo(-3, 10);
        ctx.lineTo(0, 10 + flameLen);
        ctx.lineTo(3, 10);
        ctx.fillStyle = Math.random() > 0.5 ? '#ff4500' : '#ffaa00';
        ctx.fill();

        // Inner flame core
        ctx.beginPath();
        ctx.moveTo(-1.5, 10);
        ctx.lineTo(0, 10 + flameLen * 0.6);
        ctx.lineTo(1.5, 10);
        ctx.fillStyle = '#ffff00';
        ctx.fill();

        // Rocket Side Fins
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(-4, 2);
        ctx.lineTo(-8, 10);
        ctx.lineTo(-4, 9);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(4, 2);
        ctx.lineTo(8, 10);
        ctx.lineTo(4, 9);
        ctx.fill();

        // Main Hull Body
        ctx.fillStyle = '#f1faee';
        ctx.beginPath();
        ctx.rect(-4, -6, 8, 15);
        ctx.fill();

        // Rocket Nose Cone
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(-4, -6);
        ctx.lineTo(0, -14);
        ctx.lineTo(4, -6);
        ctx.closePath();
        ctx.fill();

        // Porthole Window
        ctx.fillStyle = '#a8dadc';
        ctx.beginPath();
        ctx.arc(0, -2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1d3557';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      resizeCanvas();
      animate();
    };
  </script>
</body>
</html>
