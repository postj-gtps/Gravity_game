<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline - Milky Way Edition</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #020208;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 1px solid rgba(255, 255, 255, 0.4);
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 text-shadow: 0 0 10px rgba(180, 200, 255, 0.5);
 }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #020208;
 border: 1px solid rgba(255, 255, 255, 0.3);
 border-radius: 4px;
 display: block;
 cursor: crosshair;
 width: 100%;
 height: 100%;
 touch-action: none;
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #aaaabb;
 text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Gravity Simulation</h1>
 <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 Tap or click anywhere on the canvas to launch a ball into orbit.
 </div>

 bgCtx.fillStyle = coreGlow;
 bgCtx.scale(2.2, 0.55); // Flatten radial glow into an elliptical galaxy disk
 bgCtx.beginPath();
 bgCtx.arc(0, 0, bandLength / 2, 0, Math.PI * 2);
 bgCtx.fill();
 bgCtx.restore();

 // Dense Star Dust along the Galactic Plane
 bgCtx.save();
 bgCtx.translate(bgCanvas.width / 2, bgCanvas.height / 2);

 const starSize = Math.random() * 1.4 + 0.3;
 const alpha = Math.random() * 0.75 + 0.2;

 bgCtx.fillStyle = `rgba(225, 235, 255, ${alpha})`;
 bgCtx.beginPath();
 bgCtx.arc(distAlongPlane, distFromPlane, starSize, 0, Math.PI * 2);
 bgCtx.fill();
 }
 bgCtx.restore();

 // Scattered Field Stars across the full canvas
 const numFieldStars = 220;
 const starColors = ['#ffffff', '#dbe6ff', '#ffe8d6', '#cce0ff'];
 for (let i = 0; i < numFieldStars; i++) {
 const x = Math.random() * bgCanvas.width;
 const y = Math.random() * bgCanvas.height;
 const size = Math.random() * 1.2 + 0.2;
 const alpha = Math.random() * 0.8 + 0.2;

 bgCtx.fillStyle = starColors[Math.floor(Math.random() * starColors.length)];
 bgCtx.globalAlpha = alpha;
 bgCtx.beginPath();
 bgCtx.arc(x, y, size, 0, Math.PI * 2);
 bgCtx.fill();
 }
 bgCtx.globalAlpha = 1.0;
 }

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 // Recenter gravity node dynamically
 centralNode.x = canvas.width / 2;
 centralNode.y = canvas.height / 2;

 // Re-render galaxy background texture for new dimensions
 generateMilkyWay();
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 launchBall(clickX, clickY);
 }

 canvas.addEventListener('click', (e) => {
 handleInput(e.clientX, e.clientY);
 });
