<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics Baseline - Space Theme</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #030308;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Speed Control Container */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .controls span {
      color: #00e5ff;
      min-width: 24px;
      display: inline-block;
      text-align: right;
    }

    /* Custom Touch-Friendly Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 130px;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff;
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }

    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff;
      border: none;
    }

    .btn-reset {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
      border-radius: 4px;
    }

    .btn-reset:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #03030a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      touch-action: none; /* Prevents default touch scrolling on Chromebooks */
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    
    <!-- Dynamic Launch Speed Slider -->
    <div class="controls">
      <label for="speedSlider">Speed: <span id="speedValue">5</span></label>
      <input type="range" id="speedSlider" min="1" max="15" value="5" step="0.5" oninput="updateSpeed(this.value)">
    </div>

    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click anywhere on the canvas to launch a rocket.
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Off-screen canvas for pre-rendering space background (Optimized for Chromebook performance)
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
    const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
    const TRAIL_LENGTH = 300;     // Number of historic trail points stored
    const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
    const LAUNCH_COOLDOWN_MS = 1000; // Baseline requirement: Spam-click filter (1s cooldown)

    // DYNAMIC STATE VARIABLES
    let launchVelocity = 5;       // Adjustable launch speed setting
    let lastLaunchTime = 0;       // Timestamp tracking for 1s click filter
    let balls = [];

    // Central Gravity Node Definition (Earthlike Object)
    const centralNode = {
      x: 0,
      y: 0,
      radius: 18
    };

    function updateSpeed(value) {
      launchVelocity = parseFloat(value);
      document.getElementById('speedValue').textContent = value;
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Recenter gravity node dynamically
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;

      // Re-render the space background when canvas dimensions change
      generateSpaceBackground();
    }

    /* -------------------------------------------------------------------------
       COSMIC BACKGROUND GENERATOR (Nebulae, Galaxies, Stars)
       ------------------------------------------------------------------------- */
    function generateSpaceBackground() {
      bgCanvas.width = canvas.width;
      bgCanvas.height = canvas.height;

      const w = bgCanvas.width;
      const h = bgCanvas.height;

      // 1. Deep Space Base
      bgCtx.fillStyle = '#03030a';
      bgCtx.fillRect(0, 0, w, h);

      // 2. Procedural Nebulae (Soft, overlapping radial gradients)
      const nebulaColors = [
        'rgba(138, 43, 226, ',  // Blue Violet
        'rgba(0, 191, 255, ',   // Deep Sky Blue
        'rgba(255, 20, 147, ',  // Deep Pink
        'rgba(75, 0, 130, '     // Indigo
      ];

      const numNebulae = 4;
      for (let i = 0; i < numNebulae; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const radius = Math.min(w, h) * (0.25 + Math.random() * 0.35);

        const grad = bgCtx.createRadialGradient(x, y, 0, x, y, radius);
        const color = nebulaColors[i % nebulaColors.length];

        grad.addColorStop(0, color + '0.18)');
        grad.addColorStop(0.5, color + '0.07)');
        grad.addColorStop(1, 'transparent');

        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(x, y, radius, 0, Math.PI * 2);
        bgCtx.fill();
      }

      // 3. Spiral & Elliptical Galaxies
      drawGalaxy(bgCtx, w * 0.2, h * 0.3, 70, '#a6c8ff', -0.4);
      drawGalaxy(bgCtx, w * 0.8, h * 0.75, 90, '#ffc8e2', 0.6);

      // 4. Starfield (Varied sizes, opacities, and light hues)
      const numStars = Math.floor((w * h) / 2200); // Dynamic density based on screen size
      const starColors = ['#ffffff', '#ffffff', '#d0e7ff', '#ffecd0', '#e3d0ff'];

      for (let i = 0; i < numStars; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const size = Math.random() < 0.9 ? (Math.random() * 1.2 + 0.4) : (Math.random() * 2.2 + 1.2);
        const alpha = Math.random() * 0.7 + 0.3;
        const color = starColors[Math.floor(Math.random() * starColors.length)];

        bgCtx.beginPath();
        bgCtx.arc(x, y, size, 0, Math.PI * 2);
        bgCtx.fillStyle = color;
        bgCtx.globalAlpha = alpha;
        bgCtx.fill();

        // Subtle 4-point lens flare on larger bright stars
        if (size > 2.5 && Math.random() > 0.4) {
          bgCtx.strokeStyle = color;
          bgCtx.lineWidth = 0.5;
          bgCtx.beginPath();
          bgCtx.moveTo(x - size * 3, y);
          bgCtx.lineTo(x + size * 3, y);
          bgCtx.moveTo(x, y - size * 3);
          bgCtx.lineTo(x, y + size * 3);
          bgCtx.stroke();
        }
      }
      bgCtx.globalAlpha = 1.0; // Reset opacity
    }

    // Helper function to render distant spiral galaxies
    function drawGalaxy(targetCtx, x, y, radius, tintColor, rotationAngle) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.rotate(rotationAngle);

      // Glowing Core
      const coreGrad = targetCtx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.4);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.3, tintColor);
      coreGrad.addColorStop(1, 'transparent');

      targetCtx.fillStyle = coreGrad;
      targetCtx.beginPath();
      targetCtx.ellipse(0, 0, radius * 0.4, radius * 0.2, 0, 0, Math.PI * 2);
      targetCtx.fill();

      // Spiral Arm Particles
      const particles = 180;
      targetCtx.fillStyle = tintColor;

      for (let i = 0; i < particles; i++) {
        const distance = (i / particles) * radius;
        const angle = (i / particles) * Math.PI * 5; // Spiral tightness
        
        // Arm 1
        const px1 = Math.cos(angle) * distance + (Math.random() - 0.5) * 8;
        const py1 = (Math.sin(angle) * distance) * 0.4 + (Math.random() - 0.5) * 8;
        const pSize1 = Math.random() * 1.2 + 0.3;
        targetCtx.globalAlpha = (1 - distance / radius) * 0.6;
        targetCtx.beginPath();
        targetCtx.arc(px1, py1, pSize1, 0, Math.PI * 2);
        targetCtx.fill();

        // Arm 2 (Symmetrical opposite)
        const px2 = -Math.cos(angle) * distance + (Math.random() - 0.5) * 8;
        const py2 = -(Math.sin(angle) * distance) * 0.4 + (Math.random() - 0.5) * 8;
        targetCtx.beginPath();
        targetCtx.arc(px2, py2, pSize1, 0, Math.PI * 2);
        targetCtx.fill();
      }

      targetCtx.restore();
      targetCtx.globalAlpha = 1.0;
    }

    /* -------------------------------------------------------------------------
       INPUT HANDLING (Mouse & Chromebook Touchscreen Support with Spam Filter)
       ------------------------------------------------------------------------- */
    function handlePointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      
      // Extract coordinates from mouse or touch event
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);

      if (clientX !== undefined && clientY !== undefined) {
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;
        launchBall(clickX, clickY);
      }
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchBall(x, y) {
      // Spam-click filter: enforces 1 second cooldown between launches
      const now = Date.now();
      if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
        return;
      }
      lastLaunchTime = now;

      // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = launchVelocity * Math.sin(rad);  // Uses current speed slider value
      const vy = -launchVelocity * Math.cos(rad); 

      // Overwrite existing array to strictly maintain a single ball on screen
      balls = [{
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: 5,
        trail: [] // Stores history of past {x, y} coordinates
      }];
    }

    function resetSimulation() {
      balls = [];
    }

    /* -------------------------------------------------------------------------
       PHYSICS & ANIMATION LOOP
       ------------------------------------------------------------------------- */
    function updatePhysics() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Remove ball if it travels too far off-screen (prevents memory leak)
        const margin = 500;
        if (b.x < -margin || b.x > canvas.width + margin || 
            b.y < -margin || b.y > canvas.height + margin) {
          balls.splice(i, 1);
          continue;
        }

        // Distance vector to central gravity node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Absorption check: ball collides with central mass
        if (dist < centralNode.radius + b.radius) {
          balls.splice(i, 1);
          continue;
        }

        // Inverse square law gravity acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

        // Acceleration vector components
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Record position history for line trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }
    }

    function draw() {
      // 1. Draw Pre-rendered Space Background
      ctx.drawImage(bgCanvas, 0, 0);

      // 2. Draw Central Mass Node (Earthlike Globe: Blue Oceans & Green Landmasses)
      // Atmosphere Glow
      const atmosphereGlow = ctx.createRadialGradient(
        centralNode.x, centralNode.y, centralNode.radius * 0.8,
        centralNode.x, centralNode.y, centralNode.radius * 2.2
      );
      atmosphereGlow.addColorStop(0, 'rgba(0, 200, 255, 0.45)');
      atmosphereGlow.addColorStop(0.5, 'rgba(0, 150, 255, 0.18)');
      atmosphereGlow.addColorStop(1, 'rgba(0, 100, 255, 0)');

      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = atmosphereGlow;
      ctx.fill();

      // Earth Body (Clipped inside centralNode sphere)
      ctx.save();
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.clip();

      // Deep Blue Ocean Gradient
      const oceanGrad = ctx.createRadialGradient(
        centralNode.x - centralNode.radius * 0.3,
        centralNode.y - centralNode.radius * 0.3,
        centralNode.radius * 0.1,
        centralNode.x,
        centralNode.y,
        centralNode.radius
      );
      oceanGrad.addColorStop(0, '#1da1f2');
      oceanGrad.addColorStop(0.6, '#0f52ba');
      oceanGrad.addColorStop(1, '#082567');

      ctx.fillStyle = oceanGrad;
      ctx.fillRect(centralNode.x - centralNode.radius, centralNode.y - centralNode.radius, centralNode.radius * 2, centralNode.radius * 2);

      // Green Continents / Landmasses
      ctx.fillStyle = '#2e8b57';
      ctx.beginPath();
      ctx.ellipse(centralNode.x - centralNode.radius * 0.3, centralNode.y - centralNode.radius * 0.25, centralNode.radius * 0.45, centralNode.radius * 0.3, 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3cb371';
      ctx.beginPath();
      ctx.ellipse(centralNode.x + centralNode.radius * 0.35, centralNode.y + centralNode.radius * 0.1, centralNode.radius * 0.5, centralNode.radius * 0.35, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#228b22';
      ctx.beginPath();
      ctx.ellipse(centralNode.x - centralNode.radius * 0.2, centralNode.y + centralNode.radius * 0.4, centralNode.radius * 0.3, centralNode.radius * 0.2, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Polar Ice Cap
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y - centralNode.radius * 0.7, centralNode.radius * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // 3D Spherical Shading Overlay
      const shadowGrad = ctx.createRadialGradient(
        centralNode.x - centralNode.radius * 0.3, centralNode.y - centralNode.radius * 0.3, centralNode.radius * 0.2,
        centralNode.x, centralNode.y, centralNode.radius
      );
      shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
      shadowGrad.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
      shadowGrad.addColorStop(1, 'rgba(0, 10, 30, 0.65)');

      ctx.fillStyle = shadowGrad;
      ctx.fillRect(centralNode.x - centralNode.radius, centralNode.y - centralNode.radius, centralNode.radius * 2, centralNode.radius * 2);

      ctx.restore();

      // 3. Draw Launched Object & Rainbow Rocket Trail
      for (const b of balls) {
        // Draw segment-by-segment rainbow trajectory line
        if (b.trail.length > 1) {
          for (let t = 0; t < b.trail.length - 1; t++) {
            const p1 = b.trail[t];
            const p2 = b.trail[t + 1];

            // Hue rotates smoothly across full rainbow spectrum along trail length
            const hue = Math.floor((t / b.trail.length) * 360);
            const alpha = Math.min(1, (t / b.trail.length) + 0.15);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
        }

        // Draw launched object
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow blur for optimal Chromebook FPS
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
