<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics - Astronaut Auto-Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #030308;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Control Containers */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .controls span {
      color: #00e5ff;
      min-width: 20px;
      display: inline-block;
      text-align: right;
    }

    /* Touch-Friendly Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      width: 100px;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff;
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }

    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff;
      border: none;
    }

    .btn-reset {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
      border-radius: 4px;
    }

    .btn-reset:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #03030a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      touch-action: none;
    }

    .instructions {
      margin-top: 8px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    
    <div class="controls-group">
      <!-- Speed Slider -->
      <div class="controls">
        <label for="speedSlider">Speed: <span id="speedValue">5</span></label>
        <input type="range" id="speedSlider" min="1" max="15" value="5" step="0.5" oninput="updateSpeed(this.value)">
      </div>

      <!-- Max Astronauts Slider (Hard capped at 50) -->
      <div class="controls">
        <label for="maxSlider">Max Astronauts: <span id="maxValue">10</span></label>
        <input type="range" id="maxSlider" min="1" max="50" value="10" step="1" oninput="updateMaxAstronauts(this.value)">
      </div>
    </div>

    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="instructions">
    Tap or click on the canvas to set an active launch pad. Astronauts will auto-launch max 1x per second!
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Off-screen canvas for background rendering optimization
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');

    // SIMULATION CONSTANTS
    const GRAVITY_CONSTANT = 1800;
    const FIXED_LAUNCH_ANGLE = 90; // 90° = Rightward launch direction
    const TRAIL_LENGTH = 200;
    const SOFTENING_FACTOR = 400;
    const ABSOLUTE_MAX_CAP = 50;   // Hard limit enforced across simulation
    const SPAM_COOLDOWN_MS = 1000;  // Spam-click filter limit: max 1 launch per second

    // DYNAMIC STATE VARIABLES
    let launchVelocity = 5;
    let maxAstronauts = 10;        // Adjustable via slider (1 to 50)
    let astronauts = [];
    let launchPoint = null;        // Active auto-clicker location {x, y}
    let autoLauncherTimer = null;
    let lastSpawnTime = 0;         // Timestamp tracking for spam-click filter

    // Central Gravity Node (Earth)
    const centralNode = {
      x: 0,
      y: 0,
      radius: 18
    };

    function updateSpeed(value) {
      launchVelocity = parseFloat(value);
      document.getElementById('speedValue').textContent = value;
    }

    function updateMaxAstronauts(value) {
      maxAstronauts = Math.min(parseInt(value, 10), ABSOLUTE_MAX_CAP);
      document.getElementById('maxValue').textContent = maxAstronauts;
    }

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;

      generateSpaceBackground();
    }

    /* -------------------------------------------------------------------------
       COSMIC BACKGROUND GENERATOR
       ------------------------------------------------------------------------- */
    function generateSpaceBackground() {
      bgCanvas.width = canvas.width;
      bgCanvas.height = canvas.height;

      const w = bgCanvas.width;
      const h = bgCanvas.height;

      bgCtx.fillStyle = '#03030a';
      bgCtx.fillRect(0, 0, w, h);

      const nebulaColors = [
        'rgba(138, 43, 226, ',
        'rgba(0, 191, 255, ',
        'rgba(255, 20, 147, ',
        'rgba(75, 0, 130, '
      ];

      for (let i = 0; i < 4; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const radius = Math.min(w, h) * (0.25 + Math.random() * 0.35);

        const grad = bgCtx.createRadialGradient(x, y, 0, x, y, radius);
        const color = nebulaColors[i % nebulaColors.length];

        grad.addColorStop(0, color + '0.18)');
        grad.addColorStop(0.5, color + '0.07)');
        grad.addColorStop(1, 'transparent');

        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(x, y, radius, 0, Math.PI * 2);
        bgCtx.fill();
      }

      const numStars = Math.floor((w * h) / 2200);
      const starColors = ['#ffffff', '#ffffff', '#d0e7ff', '#ffecd0', '#e3d0ff'];

      for (let i = 0; i < numStars; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const size = Math.random() < 0.9 ? (Math.random() * 1.2 + 0.4) : (Math.random() * 2.2 + 1.2);
        const alpha = Math.random() * 0.7 + 0.3;
        const color = starColors[Math.floor(Math.random() * starColors.length)];

        bgCtx.beginPath();
        bgCtx.arc(x, y, size, 0, Math.PI * 2);
        bgCtx.fillStyle = color;
        bgCtx.globalAlpha = alpha;
        bgCtx.fill();
      }
      bgCtx.globalAlpha = 1.0;
    }

    /* -------------------------------------------------------------------------
       AUTO-CLICKER & INPUT HANDLING WITH SPAM-CLICK FILTER
       ------------------------------------------------------------------------- */
    function handlePointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);

      if (clientX !== undefined && clientY !== undefined) {
        launchPoint = {
          x: clientX - rect.left,
          y: clientY - rect.top
        };

        // Attempt launch on click (throttled by spam filter)
        spawnAstronaut();

        // Ensure auto-launcher loop runs every 100ms to spawn when 1 second elapses
        if (!autoLauncherTimer) {
          autoLauncherTimer = setInterval(spawnAstronaut, 100);
        }
      }
    }

    function spawnAstronaut() {
      if (!launchPoint) return;

      const now = Date.now();

      // SPAM-CLICK FILTER: Block spawns if less than 1000ms has elapsed
      if (now - lastSpawnTime < SPAM_COOLDOWN_MS) {
        return;
      }

      // Strict enforcement: slider ceiling & absolute max 50 onscreen limit
      const currentLimit = Math.min(maxAstronauts, ABSOLUTE_MAX_CAP);
      if (astronauts.length >= currentLimit) {
        return;
      }

      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = launchVelocity * Math.sin(rad);
      const vy = -launchVelocity * Math.cos(rad);

      astronauts.push({
        x: launchPoint.x,
        y: launchPoint.y,
        vx: vx,
        vy: vy,
        radius: 11,
        rotation: (Math.random() - 0.5) * 0.5,
        rotSpeed: (Math.random() - 0.5) * 0.03,
        trail: []
      });

      lastSpawnTime = now;
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function resetSimulation() {
      astronauts = [];
      launchPoint = null;
      lastSpawnTime = 0;
      if (autoLauncherTimer) {
        clearInterval(autoLauncherTimer);
        autoLauncherTimer = null;
      }
    }

    /* -------------------------------------------------------------------------
       PHYSICS & RENDER LOOP
       ------------------------------------------------------------------------- */
    function updatePhysics() {
      for (let i = astronauts.length - 1; i >= 0; i--) {
        const a = astronauts[i];

        // Offscreen cleanup
        const margin = 500;
        if (a.x < -margin || a.x > canvas.width + margin || 
            a.y < -margin || a.y > canvas.height + margin) {
          astronauts.splice(i, 1);
          continue;
        }

        // Distance vector to central gravity node
        const dx = centralNode.x - a.x;
        const dy = centralNode.y - a.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Collision check with central mass
        if (dist < centralNode.radius + a.radius) {
          astronauts.splice(i, 1);
          continue;
        }

        // Gravitational acceleration
        const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        a.vx += ax;
        a.vy += ay;
        a.x += a.vx;
        a.y += a.vy;

        // Tumble rotation in zero gravity
        a.rotation += a.rotSpeed;

        // Record tail trajectory
        a.trail.push({ x: a.x, y: a.y });
        if (a.trail.length > TRAIL_LENGTH) {
          a.trail.shift();
        }
      }
    }

    /* Helper: Custom Canvas Render for Astronaut Figure */
    function drawAstronautGraphic(a) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rotation);

      const r = a.radius;

      // Backpack / Life Support Pack
      ctx.fillStyle = '#b0bec5';
      ctx.fillRect(-r * 0.9, -r * 0.7, r * 0.45, r * 1.4);

      // White Spacesuit Body
      ctx.fillStyle = '#eceff1';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
      ctx.fill();

      // Helmet Visor
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.ellipse(r * 0.15, 0, r * 0.5, r * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Visor Glare / Reflection
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.beginPath();
      ctx.ellipse(r * 0.28, -r * 0.12, r * 0.18, r * 0.08, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Mission Patch Accent
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(-r * 0.3, r * 0.2, r * 0.25, r * 0.12);

      ctx.restore();
    }

    function draw() {
      // 1. Render Background
      ctx.drawImage(bgCanvas, 0, 0);

      // 2. Render Target Launch Indicator
      if (launchPoint) {
        ctx.beginPath();
        ctx.arc(launchPoint.x, launchPoint.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(launchPoint.x, launchPoint.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#00e5ff';
        ctx.fill();
      }

      // 3. Render Earth Mass Node
      const atmosphereGlow = ctx.createRadialGradient(
        centralNode.x, centralNode.y, centralNode.radius * 0.8,
        centralNode.x, centralNode.y, centralNode.radius * 2.2
      );
      atmosphereGlow.addColorStop(0, 'rgba(0, 200, 255, 0.45)');
      atmosphereGlow.addColorStop(0.5, 'rgba(0, 150, 255, 0.18)');
      atmosphereGlow.addColorStop(1, 'rgba(0, 100, 255, 0)');

      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = atmosphereGlow;
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.clip();

      const oceanGrad = ctx.createRadialGradient(
        centralNode.x - centralNode.radius * 0.3,
        centralNode.y - centralNode.radius * 0.3,
        centralNode.radius * 0.1,
        centralNode.x,
        centralNode.y,
        centralNode.radius
      );
      oceanGrad.addColorStop(0, '#1da1f2');
      oceanGrad.addColorStop(0.6, '#0f52ba');
      oceanGrad.addColorStop(1, '#082567');

      ctx.fillStyle = oceanGrad;
      ctx.fillRect(centralNode.x - centralNode.radius, centralNode.y - centralNode.radius, centralNode.radius * 2, centralNode.radius * 2);

      // Continents
      ctx.fillStyle = '#2e8b57';
      ctx.beginPath();
      ctx.ellipse(centralNode.x - centralNode.radius * 0.3, centralNode.y - centralNode.radius * 0.25, centralNode.radius * 0.45, centralNode.radius * 0.3, 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3cb371';
      ctx.beginPath();
      ctx.ellipse(centralNode.x + centralNode.radius * 0.35, centralNode.y + centralNode.radius * 0.1, centralNode.radius * 0.5, centralNode.radius * 0.35, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 4. Render Astronauts and Rainbow Orbit Trails
      for (const a of astronauts) {
        if (a.trail.length > 1) {
          for (let t = 0; t < a.trail.length - 1; t++) {
            const p1 = a.trail[t];
            const p2 = a.trail[t + 1];

            const hue = Math.floor((t / a.trail.length) * 360);
            const alpha = Math.min(1, (t / a.trail.length) + 0.15);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }

        drawAstronautGraphic(a);
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
