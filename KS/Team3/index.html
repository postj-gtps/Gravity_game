<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline - Rocket Squad</title>
 <style>
 * {
   box-sizing: border-box;
   user-select: none;
   margin: 0;
   padding: 0;
   font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
   background-color: #050510;
   color: #ffffff;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: flex-start;
   height: 100vh;
   overflow: hidden;
   padding: 12px;
 }

 /* Top Header Bar */
 #header {
   display: flex;
   flex-wrap: wrap;
   justify-content: space-between;
   align-items: center;
   gap: 12px;
   width: 100%;
   max-width: 1100px;
   margin-bottom: 8px;
   padding-bottom: 8px;
   border-bottom: 1px solid #334466;
 }

 h1 {
   font-size: 18px;
   letter-spacing: 2px;
   text-transform: uppercase;
   font-weight: bold;
   color: #ffd700;
   text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
 }

 .controls-group {
   display: flex;
   align-items: center;
   gap: 14px;
   flex-wrap: wrap;
 }

 .control-item {
   display: flex;
   align-items: center;
   gap: 8px;
   font-size: 13px;
   color: #ffd700;
   font-weight: bold;
 }

 select, input[type="range"] {
   background: #101528;
   color: #ffffff;
   border: 1px solid #ffd700;
   padding: 4px 8px;
   border-radius: 4px;
   font-family: inherit;
   font-size: 13px;
   outline: none;
   cursor: pointer;
 }

 input[type="range"] {
   accent-color: #ffd700;
   width: 100px;
 }

 .btn-reset {
   background: rgba(255, 255, 255, 0.1);
   color: #ffffff;
   border: 1px solid #ffd700;
   padding: 6px 14px;
   font-size: 13px;
   font-weight: bold;
   cursor: pointer;
   text-transform: uppercase;
   letter-spacing: 1px;
   transition: all 0.15s ease-in-out;
   border-radius: 4px;
 }

 .btn-reset:hover {
   background: #ffd700;
   color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
   position: relative;
   width: 100%;
   max-width: 1100px;
   flex-grow: 1;
   display: flex;
   justify-content: center;
   align-items: center;
 }

 canvas {
   background-color: #050510;
   border: 1px solid #334466;
   display: block;
   cursor: crosshair;
   width: 100%;
   height: 100%;
   border-radius: 8px;
   touch-action: none;
 }

 .instructions {
   margin-top: 6px;
   font-size: 12px;
   color: #aaaacc;
   text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
   <h1>Gravity Simulation</h1>
   
   <div class="controls-group">
     <div class="control-item">
       <label for="centralSelect">Center Body:</label>
       <select id="centralSelect" onchange="updateCentralObject()">
         <option value="sun" selected>Sun (Super Heavy)</option>
         <option value="jupiter">Jupiter (Very Heavy)</option>
         <option value="saturn">Saturn (Heavy)</option>
         <option value="neptune">Neptune (Medium Heavy)</option>
         <option value="uranus">Uranus (Medium Heavy)</option>
         <option value="earth">Earth (Medium)</option>
         <option value="venus">Venus (Medium)</option>
         <option value="mars">Mars (Light)</option>
         <option value="mercury">Mercury (Very Light)</option>
       </select>
     </div>

     <div class="control-item">
       <label for="speedSlider">Launch Speed:</label>
       <input type="range" id="speedSlider" min="1" max="15" value="5" step="0.5" oninput="updateLaunchSpeed(this.value)">
       <span id="speedValue">5</span>
     </div>

     <button class="btn-reset" onclick="resetSimulation()">Reset</button>
   </div>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
   <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
   Tap or click anywhere to launch rockets! (1 launch per sec max | Max 20 ships)
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // SIMULATION DATA & PRESETS
 const CENTRAL_BODIES = {
   sun:     { name: 'Sun',     gravity: 3600, radius: 24, type: 'sun' },
   jupiter: { name: 'Jupiter', gravity: 2800, radius: 22, type: 'jupiter' },
   saturn:  { name: 'Saturn',  gravity: 2200, radius: 20, type: 'saturn' },
   neptune: { name: 'Neptune', gravity: 1700, radius: 18, type: 'neptune' },
   uranus:  { name: 'Uranus',  gravity: 1600, radius: 18, type: 'uranus' },
   earth:   { name: 'Earth',   gravity: 1300, radius: 16, type: 'earth' },
   venus:   { name: 'Venus',   gravity: 1200, radius: 15, type: 'venus' },
   mars:    { name: 'Mars',    gravity: 750,  radius: 13, type: 'mars' },
   mercury: { name: 'Mercury', gravity: 450,  radius: 11, type: 'mercury' }
 };

 // STATE VARIABLES
 let currentLaunchSpeed = 5;
 let gravityConstant = CENTRAL_BODIES.sun.gravity;
 const FIXED_LAUNCH_ANGLE = 90; // Base direction in degrees (90° = straight right)
 const TRAIL_LENGTH = 300; // Number of historic trail points stored
 const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center
 const MAX_SHIPS = 20; // Upper limit of active rocketships
 const LAUNCH_COOLDOWN_MS = 1000; // 1 second spam-click prevention filter

 let lastLaunchTime = 0;
 let cooldownMessageTimer = 0;

 let ships = [];
 let stars = [];
 let nebulas = [];
 let planets = [];

 // Central Gravity Node Definition
 const centralNode = {
   x: 0,
   y: 0,
   radius: CENTRAL_BODIES.sun.radius,
   type: 'sun',
   name: 'Sun'
 };

 function updateCentralObject() {
   const select = document.getElementById('centralSelect');
   const key = select.value;
   const body = CENTRAL_BODIES[key] || CENTRAL_BODIES.sun;

   centralNode.radius = body.radius;
   centralNode.type = body.type;
   centralNode.name = body.name;
   gravityConstant = body.gravity;
 }

 function updateLaunchSpeed(val) {
   currentLaunchSpeed = parseFloat(val);
   document.getElementById('speedValue').innerText = currentLaunchSpeed;
 }

 function generateSpaceBackground() {
   stars = [];
   const starCount = Math.floor((canvas.width * canvas.height) / 3000);
   for (let i = 0; i < starCount; i++) {
     stars.push({
       x: Math.random() * canvas.width,
       y: Math.random() * canvas.height,
       radius: Math.random() * 1.5 + 0.5,
       alpha: Math.random() * 0.8 + 0.2,
       color: ['#ffffff', '#aadbff', '#ffe3a0', '#ffb3d9'][Math.floor(Math.random() * 4)]
     });
   }

   nebulas = [
     { x: canvas.width * 0.2, y: canvas.height * 0.3, radius: Math.max(canvas.width, canvas.height) * 0.35, color: 'rgba(120, 40, 200, 0.22)' },
     { x: canvas.width * 0.8, y: canvas.height * 0.7, radius: Math.max(canvas.width, canvas.height) * 0.4, color: 'rgba(30, 100, 220, 0.22)' },
     { x: canvas.width * 0.5, y: canvas.height * 0.8, radius: Math.max(canvas.width, canvas.height) * 0.3, color: 'rgba(220, 50, 120, 0.15)' }
   ];
 }

 function generatePlanets() {
   planets = [];
   const planetCount = 4;
   const planetStyles = [
     { main: '#33ffaa', shadow: '#007744', name: 'Emerald' },
     { main: '#ff9933', shadow: '#883300', ring: true },
     { main: '#ff55aa', shadow: '#880044', ring: false },
     { main: '#33ccff', shadow: '#0055aa', ring: true }
   ];

   for (let i = 0; i < planetCount; i++) {
     let px, py, distToCenter;
     let isValidPosition = false;
     let attempts = 0;
     const radius = 16 + Math.random() * 12;

     while (!isValidPosition && attempts < 100) {
       px = 80 + Math.random() * (canvas.width - 160);
       py = 80 + Math.random() * (canvas.height - 160);

       const dx = px - centralNode.x;
       const dy = py - centralNode.y;
       distToCenter = Math.sqrt(dx * dx + dy * dy);

       if (distToCenter > 140) {
         isValidPosition = true;
         for (const existing of planets) {
           const edx = px - existing.x;
           const edy = py - existing.y;
           if (Math.sqrt(edx * edx + edy * edy) < radius + existing.radius + 50) {
             isValidPosition = false;
             break;
           }
         }
       }
       attempts++;
     }

     const style = planetStyles[i % planetStyles.length];
     planets.push({
       x: px,
       y: py,
       radius: radius,
       mainColor: style.main,
       shadowColor: style.shadow,
       hasRing: style.ring || false
     });
   }
 }

 function resizeCanvas() {
   const wrapper = document.getElementById('canvas-wrapper');
   canvas.width = wrapper.clientWidth;
   canvas.height = wrapper.clientHeight;
   
   centralNode.x = canvas.width / 2;
   centralNode.y = canvas.height / 2;

   generateSpaceBackground();
   generatePlanets();
 }

 window.addEventListener('resize', resizeCanvas);

 // Touch & Click Handler with 1-Second Spam-Click Filter
 canvas.addEventListener('pointerdown', (e) => {
   const now = Date.now();
   if (now - lastLaunchTime < LAUNCH_COOLDOWN_MS) {
     cooldownMessageTimer = 45; // Display warning frame counter
     return;
   }
   lastLaunchTime = now;

   const rect = canvas.getBoundingClientRect();
   const clickX = e.clientX - rect.left;
   const clickY = e.clientY - rect.top;

   launchShips(clickX, clickY);
 });

 function launchShips(x, y) {
   const shipCount = 5;
   const totalSpreadDeg = 30;
   const startAngle = FIXED_LAUNCH_ANGLE - (totalSpreadDeg / 2); 
   const angleStep = totalSpreadDeg / (shipCount - 1); 

   const colors = ['#00e5ff', '#ff3366', '#76ff03', '#ffea00', '#d500f9'];

   for (let i = 0; i < shipCount; i++) {
     const currentAngleDeg = startAngle + (i * angleStep);
     const rad = (currentAngleDeg * Math.PI) / 180;
     const vx = currentLaunchSpeed * Math.sin(rad);
     const vy = -currentLaunchSpeed * Math.cos(rad);

     ships.push({
       x: x,
       y: y,
       vx: vx,
       vy: vy,
       radius: 6,
       color: colors[i % colors.length],
       trail: []
     });
   }

   while (ships.length > MAX_SHIPS) {
     ships.shift();
   }
 }

 function resetSimulation() {
   ships = [];
   generatePlanets();
 }

 function updatePhysics() {
   for (let i = ships.length - 1; i >= 0; i--) {
     const s = ships[i];

     const margin = 500;
     if (s.x < -margin || s.x > canvas.width + margin || 
         s.y < -margin || s.y > canvas.height + margin) {
       ships.splice(i, 1);
       continue;
     }

     const dx = centralNode.x - s.x;
     const dy = centralNode.y - s.y;
     const distSq = dx * dx + dy * dy;
     const dist = Math.sqrt(distSq);

     if (dist < centralNode.radius + s.radius) {
       ships.splice(i, 1);
       continue;
     }

     for (const p of planets) {
       const pdx = s.x - p.x;
       const pdy = s.y - p.y;
       const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

       if (pDist < p.radius + s.radius) {
         const nx = pdx / pDist;
         const ny = pdy / pDist;
         const dotProduct = s.vx * nx + s.vy * ny;

         if (dotProduct < 0) {
           const bounceDamping = 0.9;
           s.vx = (s.vx - 2 * dotProduct * nx) * bounceDamping;
           s.vy = (s.vy - 2 * dotProduct * ny) * bounceDamping;
         }

         const overlap = (p.radius + s.radius) - pDist;
         s.x += nx * overlap;
         s.y += ny * overlap;
       }
     }

     const acceleration = gravityConstant / (distSq + SOFTENING_FACTOR);
     const ax = acceleration * (dx / dist);
     const ay = acceleration * (dy / dist);

     s.vx += ax;
     s.vy += ay;
     s.x += s.vx;
     s.y += s.vy;

     s.trail.push({ x: s.x, y: s.y });
     if (s.trail.length > TRAIL_LENGTH) {
       s.trail.shift();
     }
   }
 }

 function drawBackground() {
   ctx.fillStyle = '#050512';
   ctx.fillRect(0, 0, canvas.width, canvas.height);

   for (const neb of nebulas) {
     const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
     grad.addColorStop(0, neb.color);
     grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
     ctx.fillStyle = grad;
     ctx.fillRect(0, 0, canvas.width, canvas.height);
   }

   for (const star of stars) {
     ctx.save();
     ctx.globalAlpha = star.alpha;
     ctx.fillStyle = star.color;
     ctx.beginPath();
     ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
     ctx.fill();
     ctx.restore();
   }
 }

 function drawCentralObject() {
   const x = centralNode.x;
   const y = centralNode.y;
   const r = centralNode.radius;

   ctx.save();

   if (centralNode.type === 'sun') {
     const sunGlow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3.5);
     sunGlow.addColorStop(0, 'rgba(255, 220, 50, 0.8)');
     sunGlow.addColorStop(0.5, 'rgba(255, 140, 0, 0.25)');
     sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');

     ctx.fillStyle = sunGlow;
     ctx.beginPath();
     ctx.arc(x, y, r * 3.5, 0, Math.PI * 2);
     ctx.fill();

     const sunBody = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
     sunBody.addColorStop(0, '#ffffff');
     sunBody.addColorStop(0.3, '#fff066');
     sunBody.addColorStop(0.8, '#ffcc00');
     sunBody.addColorStop(1, '#ff8800');

     ctx.fillStyle = sunBody;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'jupiter') {
     const jGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     jGrad.addColorStop(0, '#ffe8d0');
     jGrad.addColorStop(0.5, '#d88b48');
     jGrad.addColorStop(1, '#683010');

     ctx.fillStyle = jGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

     // Stripes
     ctx.strokeStyle = 'rgba(100, 40, 10, 0.4)';
     ctx.lineWidth = 3;
     ctx.beginPath();
     ctx.arc(x, y, r * 0.8, -0.4, 0.4);
     ctx.stroke();
     ctx.beginPath();
     ctx.arc(x, y, r * 0.8, 2.7, 3.5);
     ctx.stroke();

     // Great Red Spot
     ctx.fillStyle = '#cc3311';
     ctx.beginPath();
     ctx.ellipse(x + r * 0.4, y + r * 0.2, r * 0.3, r * 0.2, 0, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'saturn') {
     // Rings behind body
     ctx.save();
     ctx.translate(x, y);
     ctx.rotate(-Math.PI / 7);
     ctx.beginPath();
     ctx.ellipse(0, 0, r * 2.2, r * 0.5, 0, 0, Math.PI * 2);
     ctx.strokeStyle = 'rgba(230, 200, 140, 0.7)';
     ctx.lineWidth = 5;
     ctx.stroke();
     ctx.restore();

     const sGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     sGrad.addColorStop(0, '#fff5d0');
     sGrad.addColorStop(0.5, '#e0c080');
     sGrad.addColorStop(1, '#705830');

     ctx.fillStyle = sGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'earth') {
     const eGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     eGrad.addColorStop(0, '#66ccff');
     eGrad.addColorStop(0.5, '#2266cc');
     eGrad.addColorStop(1, '#001144');

     ctx.fillStyle = eGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

     // Continents
     ctx.fillStyle = '#44aa44';
     ctx.beginPath();
     ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.4, 0, Math.PI * 2);
     ctx.fill();
     ctx.beginPath();
     ctx.arc(x + r * 0.3, y + r * 0.3, r * 0.35, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'mars') {
     const mGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     mGrad.addColorStop(0, '#ff9966');
     mGrad.addColorStop(0.5, '#cc3300');
     mGrad.addColorStop(1, '#550000');

     ctx.fillStyle = mGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'venus') {
     const vGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     vGrad.addColorStop(0, '#ffeedd');
     vGrad.addColorStop(0.5, '#e6b800');
     vGrad.addColorStop(1, '#805d00');

     ctx.fillStyle = vGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'mercury') {
     const mercGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     mercGrad.addColorStop(0, '#dddddd');
     mercGrad.addColorStop(0.5, '#888888');
     mercGrad.addColorStop(1, '#333333');

     ctx.fillStyle = mercGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'uranus') {
     const uGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     uGrad.addColorStop(0, '#e0ffff');
     uGrad.addColorStop(0.5, '#66ccaa');
     uGrad.addColorStop(1, '#115544');

     ctx.fillStyle = uGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();

   } else if (centralNode.type === 'neptune') {
     const nGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
     nGrad.addColorStop(0, '#99bbff');
     nGrad.addColorStop(0.5, '#2244cc');
     nGrad.addColorStop(1, '#051144');

     ctx.fillStyle = nGrad;
     ctx.beginPath();
     ctx.arc(x, y, r, 0, Math.PI * 2);
     ctx.fill();
   }

   // Center Body Name Label
   ctx.fillStyle = '#ffffff';
   ctx.font = 'bold 11px sans-serif';
   ctx.textAlign = 'center';
   ctx.fillText(centralNode.name, x, y + r + 15);

   ctx.restore();
 }

 function drawPlanets() {
   for (const p of planets) {
     ctx.save();

     if (p.hasRing) {
       ctx.save();
       ctx.translate(p.x, p.y);
       ctx.rotate(-Math.PI / 6);
       ctx.beginPath();
       ctx.ellipse(0, 0, p.radius * 1.8, p.radius * 0.4, 0, 0, Math.PI * 2);
       ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
       ctx.lineWidth = 3;
       ctx.stroke();
       ctx.restore();
     }

     const pGrad = ctx.createRadialGradient(
       p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.1,
       p.x, p.y, p.radius
     );
     pGrad.addColorStop(0, '#ffffff');
     pGrad.addColorStop(0.35, p.mainColor);
     pGrad.addColorStop(1, p.shadowColor);

     ctx.fillStyle = pGrad;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
     ctx.fill();

     ctx.restore();
   }
 }

 function drawRocket(s) {
   const angle = Math.atan2(s.vy, s.vx);

   ctx.save();
   ctx.translate(s.x, s.y);
   ctx.rotate(angle);

   // Flame
   ctx.fillStyle = '#ff4400';
   ctx.beginPath();
   ctx.moveTo(-8, -3);
   ctx.lineTo(-14 - Math.random() * 5, 0);
   ctx.lineTo(-8, 3);
   ctx.closePath();
   ctx.fill();

   ctx.fillStyle = '#ffea00';
   ctx.beginPath();
   ctx.moveTo(-8, -1.5);
   ctx.lineTo(-11 - Math.random() * 3, 0);
   ctx.lineTo(-8, 1.5);
   ctx.closePath();
   ctx.fill();

   // Body
   ctx.fillStyle = s.color;
   ctx.beginPath();
   ctx.moveTo(11, 0);
   ctx.lineTo(-6, -6);
   ctx.lineTo(-4, 0);
   ctx.lineTo(-6, 6);
   ctx.closePath();
   ctx.fill();

   // Nose Cap
   ctx.fillStyle = '#ffffff';
   ctx.beginPath();
   ctx.moveTo(11, 0);
   ctx.lineTo(3, -3);
   ctx.lineTo(3, 3);
   ctx.closePath();
   ctx.fill();

   // Window
   ctx.fillStyle = '#003366';
   ctx.beginPath();
   ctx.arc(1, 0, 2, 0, Math.PI * 2);
   ctx.fill();

   ctx.restore();
 }

 function drawCooldownNotice() {
   if (cooldownMessageTimer > 0) {
     ctx.save();
     ctx.fillStyle = '#ff4444';
     ctx.font = 'bold 14px sans-serif';
     ctx.textAlign = 'center';
     ctx.fillText('Wait 1 second between launches!', canvas.width / 2, 30);
     ctx.restore();
     cooldownMessageTimer--;
   }
 }

 function draw() {
   drawBackground();
   drawPlanets();
   drawCentralObject();

   // Draw Ships & Trails
   for (const s of ships) {
     if (s.trail.length > 1) {
       ctx.beginPath();
       ctx.moveTo(s.trail[0].x, s.trail[0].y);
       for (let t = 1; t < s.trail.length; t++) {
         ctx.lineTo(s.trail[t].x, s.trail[t].y);
       }
       ctx.strokeStyle = s.color;
       ctx.globalAlpha = 0.45;
       ctx.lineWidth = 1.5;
       ctx.stroke();
       ctx.globalAlpha = 1.0;
     }

     drawRocket(s);
   }

   drawCooldownNotice();
 }

 function animate() {
   updatePhysics();
   draw();
   requestAnimationFrame(animate);
 }

 window.onload = function() {
   resizeCanvas();
   updateCentralObject();
   animate();
 };
 </script>
</body>
</html>
