<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gravity Physics Baseline</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #000000;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 1px solid #ffffff;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #000000;
 border: 1px solid #ffffff;
 display: block;
 cursor: crosshair;
 width: 100%;
 height: 100%;
 touch-action: none; /* Prevents unwanted browser gestures on touchscreens */
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #888888;
 text-align: center;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Gravity Simulation</h1>
 <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 Click or tap anywhere on the canvas to launch a ball (up to 20 balls at once).
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // SIMULATION CONSTANTS
 const MAX_BALLS = 20; // Maximum active balls allowed on screen
 const GRAVITY_CONSTANT = 1800; // Strength of gravitational pull (G)
 const LAUNCH_VELOCITY = 5; // Fixed velocity on click
 const FIXED_LAUNCH_ANGLE = 90; // Fixed direction in degrees (90° = straight right)
 const TRAIL_LENGTH = 300; // Number of historic trail points stored
 const SOFTENING_FACTOR = 400; // Prevents infinite velocity near center

 // STATE VARIABLES
 let balls = [];

 // Central Gravity Node Definition
 const centralNode = {
 x: 0,
 y: 0,
 radius: 12
 };

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 // Recenter gravity node dynamically
 centralNode.x = canvas.width / 2;
 centralNode.y = canvas.height / 2;
 }

 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 // Pointer Handler: Supports both mouse clicks and touchscreen taps
 canvas.addEventListener('pointerdown', (e) => {
 const rect = canvas.getBoundingClientRect();
 const clickX = e.clientX - rect.left;
 const clickY = e.clientY - rect.top;

 launchBall(clickX, clickY);
 });

 function launchBall(x, y) {
 // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
 const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
 const vx = LAUNCH_VELOCITY * Math.sin(rad); // sin(90°) = 1 -> vx = 5
 const vy = -LAUNCH_VELOCITY * Math.cos(rad); // cos(90°) = 0 -> vy = 0

 // FIFO Management: Remove the oldest ball if cap is reached
 if (balls.length >= MAX_BALLS) {
 balls.shift();
 }

 // Add new ball to array
 balls.push({
 x: x,
 y: y,
 vx: vx,
 vy: vy,
 radius: 4,
 trail: [] // Stores history of past {x, y} coordinates
 });
 }

 function resetSimulation() {
 balls = [];
 }

 function updatePhysics() {
 for (let i = balls.length - 1; i >= 0; i--) {
 const b = balls[i];

 // Remove ball if it travels too far off-screen (prevents memory leak)
 const margin = 500;
 if (b.x < -margin || b.x > canvas.width + margin || 
 b.y < -margin || b.y > canvas.height + margin) {
 balls.splice(i, 1);
 continue;
 }

 // Distance vector to central gravity node
 const dx = centralNode.x - b.x;
 const dy = centralNode.y - b.y;
 const distSq = dx * dx + dy * dy;
 const dist = Math.sqrt(distSq);

 // Absorption check: ball collides with central mass
 if (dist < centralNode.radius + b.radius) {
 balls.splice(i, 1);
 continue;
 }

 // Inverse square law gravity acceleration
 const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

 // Acceleration vector components
 const ax = acceleration * (dx / dist);
 const ay = acceleration * (dy / dist);

 // Update velocity and position
 b.vx += ax;
 b.vy += ay;
 b.x += b.vx;
 b.y += b.vy;

 // Record position history for line trail
 b.trail.push({ x: b.x, y: b.y });
 if (b.trail.length > TRAIL_LENGTH) {
 b.trail.shift();
 }
 }
 }

 function draw() {
 // Clear canvas background
 ctx.fillStyle = '#000000';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 // 1. Draw Central Mass Node
 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
 ctx.fillStyle = '#ffffff';
 ctx.fill();

 // Center mark on node
 ctx.beginPath();
 ctx.arc(centralNode.x, centralNode.y, 2, 0, Math.PI * 2);
 ctx.fillStyle = '#000000';
 ctx.fill();

 // 2. Draw Ball & Trail
 for (const b of balls) {
 // Draw path line
 if (b.trail.length > 1) {
 ctx.beginPath();
 ctx.moveTo(b.trail[0].x, b.trail[0].y);
 for (let t = 1; t < b.trail.length; t++) {
 ctx.lineTo(b.trail[t].x, b.trail[t].y);
 }
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1.2;
 ctx.stroke();
 }

 // Draw ball object
 ctx.beginPath();
 ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
 ctx.fillStyle = '#ffffff';
 ctx.fill();
 }
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 animate();
 };
 </script>
</body>
</html>
