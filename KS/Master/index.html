<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Physics - Galaxy Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #030208;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Control Group Container */
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-group label {
            white-space: nowrap;
        }

        .control-group select {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            outline: none;
        }

        .control-group select:focus {
            border-color: #888888;
            background-color: #111111;
        }

        .control-group input[type="range"] {
            cursor: pointer;
            accent-color: #ffffff;
            width: 130px;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #020106;
            border: 1px solid #ffffff;
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #aaaaaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Gravity Simulation</h1>
        
        <!-- Central Body Dropdown Selection -->
        <div class="control-group">
            <label for="bodySelect">Central Body:</label>
            <select id="bodySelect">
                <option value="sun">Sun</option>
                <option value="mercury">Mercury</option>
                <option value="venus">Venus</option>
                <option value="earth" selected>Earth</option>
                <option value="mars">Mars</option>
                <option value="jupiter">Jupiter</option>
                <option value="saturn">Saturn</option>
                <option value="uranus">Uranus</option>
                <option value="neptune">Neptune</option>
            </select>
        </div>

        <div class="control-group">
            <label for="speedSlider">Launch Speed: <span id="speedValue">5</span></label>
            <input type="range" id="speedSlider" min="1" max="25" value="5" step="1">
        </div>

        <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        Click or tap anywhere on the canvas to launch a ball (up to 50 max, 1 launch per second).
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueDisplay = document.getElementById('speedValue');
        const bodySelect = document.getElementById('bodySelect');

        // SIMULATION CONSTANTS
        const BASE_GRAVITY = 1800;         // Base gravity constant scale
        const FIXED_LAUNCH_ANGLE = 90;     // Fixed direction in degrees (90° = straight right)
        const TRAIL_LENGTH = 300;          // Number of historic trail points stored
        const SOFTENING_FACTOR = 400;      // Prevents infinite velocity near center
        const SPAM_COOLDOWN_MS = 1000;     // Minimum time between clicks (1 launch per second max)
        const MAX_BALLS = 50;              // Maximum balls onscreen at a time

        // SOLAR SYSTEM CELESTIAL BODIES DATA
        const CELESTIAL_BODIES = {
            sun:     { name: 'Sun',     massFactor: 5.0,  radius: 22, color: '#ffcc00' },
            mercury: { name: 'Mercury', massFactor: 0.35, radius: 6,  color: '#aaaaaa' },
            venus:   { name: 'Venus',   massFactor: 0.85, radius: 9,  color: '#e3bb76' },
            earth:   { name: 'Earth',   massFactor: 1.0,  radius: 10, color: '#4f97e8' },
            mars:    { name: 'Mars',    massFactor: 0.55, radius: 8,  color: '#e25e40' },
            jupiter: { name: 'Jupiter', massFactor: 3.2,  radius: 18, color: '#d8ca9d' },
            saturn:  { name: 'Saturn',  massFactor: 2.3,  radius: 15, color: '#e4d191', hasRings: true },
            uranus:  { name: 'Uranus',  massFactor: 1.5,  radius: 13, color: '#7de3e4' },
            neptune: { name: 'Neptune', massFactor: 1.7,  radius: 13, color: '#4b70dd' }
        };

        // STATE VARIABLES
        let balls = [];
        let particles = [];
        let lastLaunchTime = 0;
        let galaxyStars = [];
        let galaxyAngle = 0;
        let astronauts = [];

        // Central Gravity Node Definition
        const centralNode = {
            x: 0,
            y: 0,
            key: 'earth',
            ...CELESTIAL_BODIES.earth
        };

        // Initialize Galaxy Particles & Background Stars
        function initGalaxy() {
            galaxyStars = [];
            const numStars = 1100;
            const arms = 2;
            const armWidth = 0.5;

            for (let i = 0; i < numStars; i++) {
                // Distribute stars along spiral arms
                const dist = Math.pow(Math.random(), 2) * 550 + 10;
                const armOffset = (Math.floor(Math.random() * arms) * (2 * Math.PI / arms));
                const angle = dist * 0.008 + armOffset + (Math.random() - 0.5) * armWidth;
                
                // Color palette: core warm light, arms bright cyan/purple/pink/blue
                let color;
                const randColor = Math.random();
                if (dist < 60) {
                    color = 'rgba(255, 235, 200, ' + (0.4 + Math.random() * 0.5) + ')';
                } else if (randColor < 0.35) {
                    color = 'rgba(120, 180, 255, ' + (0.3 + Math.random() * 0.5) + ')';
                } else if (randColor < 0.7) {
                    color = 'rgba(200, 140, 255, ' + (0.3 + Math.random() * 0.5) + ')';
                } else if (randColor < 0.85) {
                    color = 'rgba(255, 120, 200, ' + (0.3 + Math.random() * 0.5) + ')';
                } else {
                    color = 'rgba(255, 255, 255, ' + (0.4 + Math.random() * 0.5) + ')';
                }

                galaxyStars.push({
                    dist: dist,
                    angle: angle,
                    size: Math.random() * 1.8 + 0.5,
                    color: color
                });
            }
        }

        // Initialize 3 Floating Astronauts with gentle drift speeds and rotations
        function initAstronauts() {
            astronauts = [
                { x: 120, y: 140, vx: 0.12, vy: 0.08, angle: 0.2, vRot: 0.003, scale: 0.95 },
                { x: canvas.width - 150, y: 180, vx: -0.09, vy: 0.11, angle: -0.5, vRot: -0.002, scale: 0.85 },
                { x: 200, y: canvas.height - 150, vx: 0.07, vy: -0.10, angle: 1.1, vRot: 0.0025, scale: 1.05 }
            ];
        }

        // Update displayed speed label on slider movement
        speedSlider.addEventListener('input', () => {
            speedValueDisplay.textContent = speedSlider.value;
        });

        // Dropdown Selection Handler
        bodySelect.addEventListener('change', (e) => {
            const selectedKey = e.target.value;
            const bodyData = CELESTIAL_BODIES[selectedKey];
            if (bodyData) {
                centralNode.key = selectedKey;
                centralNode.massFactor = bodyData.massFactor;
                centralNode.radius = bodyData.radius;
                centralNode.color = bodyData.color;
                centralNode.hasRings = !!bodyData.hasRings;
                centralNode.name = bodyData.name;
            }
        });

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            // Recenter gravity node dynamically
            centralNode.x = canvas.width / 2;
            centralNode.y = canvas.height / 2;

            initGalaxy();
            initAstronauts();
        }

        window.addEventListener('resize', resizeCanvas);

        // Launch handler with 1x per second rate limiting (Spam Filter)
        function handleLaunchInput(clientX, clientY) {
            const now = Date.now();
            if (now - lastLaunchTime < SPAM_COOLDOWN_MS) {
                return; // Rate limit: maximum 1 launch per second
            }

            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            lastLaunchTime = now;
            launchBall(clickX, clickY);
        }

        // Pointer/Click Event Listeners
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleLaunchInput(e.clientX, e.clientY);
        });

        function launchBall(x, y) {
            if (balls.length >= MAX_BALLS) {
                return; // Enforce maximum of 50 balls onscreen
            }

            const launchVelocity = parseFloat(speedSlider.value);

            // Fixed launch direction: 90° (0° = UP, 90° = RIGHT, 180° = DOWN, 270° = LEFT)
            const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
            const vx = launchVelocity * Math.sin(rad);
            const vy = -launchVelocity * Math.cos(rad);

            balls.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                radius: 4,
                trail: []
            });
        }

        function createExplosion(x, y) {
            for (let p = 0; p < 18; p++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02,
                    size: Math.random() * 3 + 2,
                    color: Math.random() < 0.4 ? '#ff4400' : (Math.random() < 0.7 ? '#ffcc00' : '#ffffff')
                });
            }
        }

        function resetSimulation() {
            balls = [];
            particles = [];
        }

        function updatePhysics() {
            // Effective gravitational pull proportional to selected central body's mass factor
            const currentGravity = BASE_GRAVITY * centralNode.massFactor;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                // Remove ball if it travels too far off-screen
                const margin = 500;
                if (b.x < -margin || b.x > canvas.width + margin || 
                    b.y < -margin || b.y > canvas.height + margin) {
                    balls.splice(i, 1);
                    continue;
                }

                // Distance vector to central gravity node
                const dx = centralNode.x - b.x;
                const dy = centralNode.y - b.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Absorption check: ball collides with central mass
                if (dist < centralNode.radius + b.radius) {
                    balls.splice(i, 1);
                    continue;
                }

                // Gravity acceleration using mass factor
                const acceleration = currentGravity / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity and position
                b.vx += ax;
                b.vy += ay;
                b.x += b.vx;
                b.y += b.vy;

                // Collision check with astronauts
                let hitAstronaut = false;
                for (const astro of astronauts) {
                    const astroRadius = 22 * astro.scale;
                    const adx = astro.x - b.x;
                    const ady = astro.y - b.y;
                    const adist = Math.sqrt(adx * adx + ady * ady);

                    if (adist < astroRadius + b.radius) {
                        // Push direction in opposite direction of impact (away from collision center)
                        const nx = adist > 0 ? adx / adist : 0;
                        const ny = adist > 0 ? ady / adist : 0;

                        const pushImpulse = 2.5;
                        astro.vx += nx * pushImpulse + b.vx * 0.2;
                        astro.vy += ny * pushImpulse + b.vy * 0.2;
                        astro.vRot += (Math.random() - 0.5) * 0.05;

                        // Create explosion effect at collision point
                        createExplosion(b.x, b.y);

                        hitAstronaut = true;
                        break;
                    }
                }

                if (hitAstronaut) {
                    balls.splice(i, 1);
                    continue;
                }

                // Record position history for line trail
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > TRAIL_LENGTH) {
                    b.trail.shift();
                }
            }

            // Update explosion particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Slowly rotate background galaxy
            galaxyAngle += 0.0006;

            // Update drifting floating astronauts
            for (const astro of astronauts) {
                astro.x += astro.vx;
                astro.y += astro.vy;
                astro.angle += astro.vRot;

                // Gentle velocity drag so astronauts gradually settle after impact
                astro.vx *= 0.995;
                astro.vy *= 0.995;
                astro.vRot *= 0.995;

                // Screen bounce/wrap-around boundaries
                const margin = 40;
                if (astro.x < -margin) astro.x = canvas.width + margin;
                if (astro.x > canvas.width + margin) astro.x = -margin;
                if (astro.y < -margin) astro.y = canvas.height + margin;
                if (astro.y > canvas.height + margin) astro.y = -margin;
            }
        }

        // Render Spiral Galaxy Background
        function drawGalaxy() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Deep space radial core gradient
            const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 450);
            coreGlow.addColorStop(0, 'rgba(80, 50, 120, 0.45)');
            coreGlow.addColorStop(0.2, 'rgba(30, 20, 65, 0.35)');
            coreGlow.addColorStop(0.6, 'rgba(10, 8, 25, 0.2)');
            coreGlow.addColorStop(1, 'rgba(2, 1, 6, 0)');

            ctx.fillStyle = coreGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw spiral galaxy arms & stars
            for (let i = 0; i < galaxyStars.length; i++) {
                const s = galaxyStars[i];
                const currentAngle = s.angle + galaxyAngle;
                const x = cx + Math.cos(currentAngle) * s.dist;
                const y = cy + Math.sin(currentAngle) * s.dist;

                // Only render stars within visible bounds
                if (x >= 0 && x <= canvas.width && y >= 0 && y <= canvas.height) {
                    ctx.beginPath();
                    ctx.arc(x, y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.fill();
                }
            }
        }

        // Procedurally render an Astronaut floating in space
        function drawAstronaut(astro) {
            ctx.save();
            ctx.translate(astro.x, astro.y);
            ctx.rotate(astro.angle);
            ctx.scale(astro.scale, astro.scale);

            // Life Support Backpack (PLSS)
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(-18, -14, 10, 28);
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 1;
            ctx.strokeRect(-18, -14, 10, 28);

            // Space Suit Body
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(-10, -12, 20, 26, 6);
            ctx.fill();
            ctx.strokeStyle = '#aaaaaa';
            ctx.stroke();

            // Chest Control Pack
            ctx.fillStyle = '#333333';
            ctx.fillRect(-4, -6, 8, 8);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-2, -4, 2, 2);
            ctx.fillStyle = '#44ff44';
            ctx.fillRect(1, -4, 2, 2);

            // Arms (Raised floating posture)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            // Left Arm
            ctx.beginPath();
            ctx.moveTo(-9, -8);
            ctx.lineTo(-18, -16);
            ctx.stroke();

            // Right Arm
            ctx.beginPath();
            ctx.moveTo(9, -8);
            ctx.lineTo(17, -2);
            ctx.stroke();

            // Legs
            // Left Leg
            ctx.beginPath();
            ctx.moveTo(-5, 12);
            ctx.lineTo(-12, 24);
            ctx.stroke();

            // Right Leg
            ctx.beginPath();
            ctx.moveTo(5, 12);
            ctx.lineTo(10, 25);
            ctx.stroke();

            // Helmet
            ctx.beginPath();
            ctx.arc(0, -17, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Gold Reflective Helmet Visor
            ctx.beginPath();
            ctx.arc(1, -17, 7, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.fillStyle = '#ffb700';
            ctx.fill();
            ctx.strokeStyle = '#d49b00';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Visor reflection streak
            ctx.beginPath();
            ctx.arc(0, -18, 5, -Math.PI * 0.3, -Math.PI * 0.1);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            // Clear canvas background with dark space base
            ctx.fillStyle = '#020106';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Spiral Galaxy Background
            drawGalaxy();

            // 2. Draw Floating Astronauts
            for (const astro of astronauts) {
                drawAstronaut(astro);
            }

            // 3. Draw Saturn's Rings if selected
            if (centralNode.hasRings) {
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(centralNode.x, centralNode.y, centralNode.radius * 2.2, centralNode.radius * 0.7, -Math.PI / 6, 0, Math.PI * 2);
                ctx.strokeStyle = '#c2b280';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            // 4. Draw Central Celestial Mass Node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
            ctx.fillStyle = centralNode.color;
            ctx.fill();

            // Center mark on node
            ctx.beginPath();
            ctx.arc(centralNode.x, centralNode.y, Math.max(1.5, centralNode.radius * 0.15), 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Label for Central Mass
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(centralNode.name, centralNode.x, centralNode.y + centralNode.radius + 16);

            // 5. Draw Ball & Trail
            for (const b of balls) {
                if (b.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let t = 1; t < b.trail.length; t++) {
                        ctx.lineTo(b.trail[t].x, b.trail[t].y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // 6. Draw Explosion Particles
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
