<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Physics - Planet Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 12px 16px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ffffff;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select, input[type="number"] {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      outline: none;
      border-radius: 0;
    }

    input[type="number"] {
      width: 65px;
      text-align: center;
    }

    /* Standardize focus outline across controls */
    select:focus, input[type="number"]:focus {
      background-color: #111111;
      border-color: #7de3e4;
    }

    .btn-reset {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease-in-out;
    }

    .btn-reset:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #000000;
      border: 1px solid #ffffff;
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none; /* Prevents touch scrolling on Chromebook touch screens */
    }

    .instructions {
      margin-top: 6px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
    }

    /* Planet Info HUD */
    #info-bar {
      font-size: 12px;
      color: #4b9cd3;
      margin-top: 4px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Gravity Simulation</h1>
    <div class="controls-group">
      <label for="planetSelect">Planet:</label>
      <select id="planetSelect" onchange="updatePlanetInfo()">
        <option value="mercury">Mercury (0.38g)</option>
        <option value="venus">Venus (0.91g)</option>
        <option value="earth" selected>Earth (1.00g)</option>
        <option value="mars">Mars (0.38g)</option>
        <option value="jupiter">Jupiter (2.53g)</option>
        <option value="saturn">Saturn (1.07g)</option>
        <option value="uranus">Uranus (0.89g)</option>
        <option value="neptune">Neptune (1.14g)</option>
      </select>

      <label for="speedInput">Speed:</label>
      <input type="number" id="speedInput" value="5" min="0" max="25" step="0.5">

      <button class="btn-reset" onclick="resetSimulation()">Reset</button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>
  </div>

  <div id="info-bar">Selected: Earth | Surface Gravity Multiplier: 1.00x</div>
  <div class="instructions">
    Tap or click anywhere on space to launch a planet. Use WASD keys to gently thrust!
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const planetSelect = document.getElementById('planetSelect');
    const speedInput = document.getElementById('speedInput');
    const infoBar = document.getElementById('info-bar');

    // PLANET DATA DEFINITIONS
    const PLANET_DATA = {
      mercury: { name: 'Mercury', color: '#b5b5b5', radius: 5, gravityFactor: 0.38 },
      venus:   { name: 'Venus',   color: '#e3bb76', radius: 8, gravityFactor: 0.91 },
      earth:   { name: 'Earth',   color: '#4b9cd3', radius: 9, gravityFactor: 1.00 },
      mars:    { name: 'Mars',    color: '#c1440e', radius: 6, gravityFactor: 0.38 },
      jupiter: { name: 'Jupiter', color: '#d8ca9d', radius: 17, gravityFactor: 2.53 },
      saturn:  { name: 'Saturn',  color: '#e4d191', radius: 14, gravityFactor: 1.07, hasRings: true },
      uranus:  { name: 'Uranus',  color: '#7de3e4', radius: 11, gravityFactor: 0.89 },
      neptune: { name: 'Neptune', color: '#2b65ec', radius: 11, gravityFactor: 1.14 }
    };

    // SIMULATION CONSTANTS
    const BASE_GRAVITY_CONSTANT = 1800; // Base gravitational strength (G)
    const FIXED_LAUNCH_ANGLE = 90;      // Fixed launch direction in degrees (90° = Right)
    const TRAIL_LENGTH = 300;            // Historic points stored for tail
    const SOFTENING_FACTOR = 400;       // Prevents infinite acceleration near center
    const THRUST_FORCE = 0.08;          // Gentle WASD thrust strength

    // STATE VARIABLES
    let balls = [];
    let particles = [];
    const keys = {};

    // Central Gravity Mass Node Definition
    const centralNode = {
      x: 0,
      y: 0,
      radius: 14
    };

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      
      // Keep central gravity node centered
      centralNode.x = canvas.width / 2;
      centralNode.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // WASD Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Event Listener supporting both Mouse Clicks & Chromebook Touch Screen Taps
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      launchBall(clickX, clickY);
    });

    function updatePlanetInfo() {
      const selected = PLANET_DATA[planetSelect.value];
      infoBar.textContent = `Selected: ${selected.name} | Surface Gravity Multiplier: ${selected.gravityFactor.toFixed(2)}x`;
      infoBar.style.color = selected.color;
    }

    function launchBall(x, y) {
      const selected = PLANET_DATA[planetSelect.value];
      
      // Read current launch speed set by user (defaults to 5 if empty or invalid)
      const launchSpeed = parseFloat(speedInput.value) >= 0 ? parseFloat(speedInput.value) : 5;

      const rad = (FIXED_LAUNCH_ANGLE * Math.PI) / 180;
      const vx = launchSpeed * Math.sin(rad);
      const vy = -launchSpeed * Math.cos(rad);

      // Overwrite current ball with selected planet specs
      balls = [{
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: selected.radius,
        color: selected.color,
        gravityFactor: selected.gravityFactor,
        hasRings: selected.hasRings || false,
        name: selected.name,
        trail: []
      }];
    }

    function triggerExplosion(x, y, planetColor) {
      const particleCount = 35;
      const explosionColors = [planetColor, '#ffcc00', '#ff5500', '#ff2200', '#ffffff'];

      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.5 + 0.8;
        const color = explosionColors[Math.floor(Math.random() * explosionColors.length)];

        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3.5 + 1.5,
          color: color,
          alpha: 1.0,
          decay: Math.random() * 0.025 + 0.015
        });
      }
    }

    function resetSimulation() {
      balls = [];
      particles = [];
    }

    function updatePhysics() {
      // 1. Update active planet physics and thrust
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Apply WASD gentle thrust controls
        if (keys['w']) b.vy -= THRUST_FORCE;
        if (keys['s']) b.vy += THRUST_FORCE;
        if (keys['a']) b.vx -= THRUST_FORCE;
        if (keys['d']) b.vx += THRUST_FORCE;

        // Off-screen cleanup
        const margin = 500;
        if (b.x < -margin || b.x > canvas.width + margin || 
            b.y < -margin || b.y > canvas.height + margin) {
          balls.splice(i, 1);
          continue;
        }

        // Vector to central node
        const dx = centralNode.x - b.x;
        const dy = centralNode.y - b.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        // Explosion check on collision with star
        if (dist < centralNode.radius + b.radius) {
          triggerExplosion(b.x, b.y, b.color);
          balls.splice(i, 1);
          continue;
        }

        // Inverse-square gravity acceleration scaled by planet's gravity multiplier
        const effectiveGravity = BASE_GRAVITY_CONSTANT * b.gravityFactor;
        const acceleration = effectiveGravity / (distSq + SOFTENING_FACTOR);

        // Acceleration components
        const ax = acceleration * (dx / dist);
        const ay = acceleration * (dy / dist);

        // Update velocity and position
        b.vx += ax;
        b.vy += ay;
        b.x += b.vx;
        b.y += b.vy;

        // Save position trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_LENGTH) {
          b.trail.shift();
        }
      }

      // 2. Update explosion particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Central Gravity Mass (Star / Sun)
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc00';
      ctx.fill();

      // Sun Outer Glow
      ctx.beginPath();
      ctx.arc(centralNode.x, centralNode.y, centralNode.radius + 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 204, 0, 0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 2. Draw Active Planet & Path
      for (const b of balls) {
        // Draw orbital path trail matching planet color
        if (b.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let t = 1; t < b.trail.length; t++) {
            ctx.lineTo(b.trail[t].x, b.trail[t].y);
          }
          ctx.strokeStyle = b.color;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Draw Saturn's Rings if selected
        if (b.hasRings) {
          ctx.beginPath();
          ctx.ellipse(b.x, b.y, b.radius * 1.8, b.radius * 0.6, Math.PI / 6, 0, Math.PI * 2);
          ctx.strokeStyle = '#c2b180';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Draw Planet Body
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
      }

      // 3. Draw Explosion Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      updatePlanetInfo();
      animate();
    };
  </script>
</body>
</html>
