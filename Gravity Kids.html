<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity & Physics Playground</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0d0f18;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 1200px;
            gap: 10px;
        }

        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
        }

        .tool-group {
            display: flex;
            gap: 8px;
            align-items: center;
            border-right: 1px solid #475569;
            padding-right: 8px;
            margin-right: 4px;
        }
        .tool-group:last-child {
            border-right: none;
        }

        button {
            background-color: #0f172a;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #334155;
            color: #f8fafc;
        }

        button.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        button.danger {
            background-color: #7f1d1d;
            border-color: #ef4444;
            color: #fca5a5;
        }
        button.danger:hover {
            background-color: #991b1b;
            color: #ffffff;
        }

        /* Slider Controls Styling */
        .slider-label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slider-label span {
            color: #38bdf8;
            font-family: monospace;
            min-width: 36px;
        }

        input[type=range] {
            accent-color: #38bdf8;
            cursor: pointer;
            width: 110px;
        }

        #canvas-container {
            position: relative;
            width: 1200px;
            height: 580px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
        }

        canvas {
            background-color: #05070e;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            display: block;
            cursor: crosshair;
        }

        #instruction-banner {
            font-size: 13px;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <h1>GRAVITY & ORBITAL PATH PLAYGROUND</h1>

    <div id="toolbar">
        <div class="tool-group">
            <button id="btn-ball" class="active" onclick="setMode('ball')">⚽ Launch Ball</button>
            <button id="btn-attract" onclick="setMode('attract')">🔵 Gravity Node (+)</button>
            <button id="btn-repel" onclick="setMode('repel')">🔴 Anti-Gravity Node (-)</button>
        </div>

        <div class="tool-group">
            <button id="btn-trail" class="active" onclick="toggleTrails()">✨ Trails: ON</button>
            <label class="slider-label" for="trail-slider">
                Trail: <span id="trail-val">120</span>
            </label>
            <input type="range" id="trail-slider" min="10" max="1200" value="120" step="10" oninput="updateTrailLength(this.value)">
            <button id="btn-bounce" class="active" onclick="toggleBounce()">🧱 Wall Bounce: ON</button>
        </div>

        <div class="tool-group">
            <button class="danger" onclick="clearBalls()">Clear Balls</button>
            <button class="danger" onclick="clearNodes()">Clear Nodes</button>
            <button class="danger" onclick="resetAll()">Reset All</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas" width="1200" height="580"></canvas>
    </div>

    <div id="instruction-banner">
        <span id="help-text">Click and drag on the screen to aim and launch a bouncing ball.</span>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Simulation State
    let mode = 'ball'; // 'ball', 'attract', 'repel'
    let showTrails = true;
    let maxTrailLength = 120; // Default 120, max adjustable up to 1200
    let wallBounce = true;
    const G = 2400; // Gravitational constant scale

    let balls = [];
    let nodes = []; // {x, y, type: 'attract'|'repel', strength: 1}

    // Dragging / Aiming interaction state
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('btn-ball').classList.toggle('active', mode === 'ball');
        document.getElementById('btn-attract').classList.toggle('active', mode === 'attract');
        document.getElementById('btn-repel').classList.toggle('active', mode === 'repel');

        const helpText = document.getElementById('help-text');
        if (mode === 'ball') helpText.innerText = "Click and drag to aim and launch a bouncing ball.";
        else if (mode === 'attract') helpText.innerText = "Click anywhere to place a Blue Gravity Attractor Node.";
        else if (mode === 'repel') helpText.innerText = "Click anywhere to place a Red Anti-Gravity Repeller Node.";
    }

    function toggleTrails() {
        showTrails = !showTrails;
        document.getElementById('btn-trail').innerText = showTrails ? "✨ Trails: ON" : "✨ Trails: OFF";
        document.getElementById('btn-trail').classList.toggle('active', showTrails);
    }

    function updateTrailLength(val) {
        maxTrailLength = parseInt(val, 10);
        document.getElementById('trail-val').innerText = maxTrailLength;
    }

    function toggleBounce() {
        wallBounce = !wallBounce;
        document.getElementById('btn-bounce').innerText = wallBounce ? "🧱 Wall Bounce: ON" : "🧱 Wall Bounce: OFF";
        document.getElementById('btn-bounce').classList.toggle('active', wallBounce);
    }

    function clearBalls() { balls = []; }
    function clearNodes() { nodes = []; }
    function resetAll() { balls = []; nodes = []; }

    // Canvas Interaction
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (mode === 'ball') {
            isDragging = true;
            dragStart = { x, y };
            dragCurrent = { x, y };
        } else if (mode === 'attract' || mode === 'repel') {
            nodes.push({ x, y, type: mode, radius: 14 });
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            dragCurrent = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
    });

    canvas.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            // Launch velocity multiplier
            const vx = (dragStart.x - dragCurrent.x) * 0.04;
            const vy = (dragStart.y - dragCurrent.y) * 0.04;
            
            // Random vibrant trail color
            const hue = Math.floor(Math.random() * 360);
            const color = `hsl(${hue}, 100%, 65%)`;

            balls.push({
                x: dragStart.x,
                y: dragStart.y,
                vx: vx,
                vy: vy,
                radius: 6,
                color: color,
                history: []
            });
        }
    });

    // Physics Update
    function updatePhysics() {
        for (let i = balls.length - 1; i >= 0; i--) {
            let b = balls[i];
            let ax = 0;
            let ay = 0;
            let collided = false;

            // Compute gravitational acceleration & check node collision
            for (let n of nodes) {
                let dx = n.x - b.x;
                let dy = n.y - b.y;
                let distSq = dx * dx + dy * dy;

                // Collision detection: check if distance between centers < combined radii
                let minDistance = b.radius + n.radius;
                if (distSq < minDistance * minDistance) {
                    collided = true;
                    break;
                }
                
                // Smoothing factor prevents division by zero / infinite slingshot speed
                let dist = Math.sqrt(distSq + 400); 

                let force = G / (distSq + 200);
                if (n.type === 'repel') force = -force; // Inverse direction for anti-gravity

                ax += force * (dx / dist);
                ay += force * (dy / dist);
            }

            // Remove ball from array if it collided with a node
            if (collided) {
                balls.splice(i, 1);
                continue;
            }

            b.vx += ax * 0.1;
            b.vy += ay * 0.1;

            b.x += b.vx;
            b.y += b.vy;

            // Border Bounce Mechanics
            if (wallBounce) {
                if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -0.92; }
                if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.vx *= -0.92; }
                if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -0.92; }
                if (b.y + b.radius > canvas.height) { b.y = canvas.height - b.radius; b.vy *= -0.92; }
            }

            // Store position history for path trails
            if (showTrails) {
                b.history.push({ x: b.x, y: b.y });
                if (b.history.length > maxTrailLength) {
                    b.history.splice(0, b.history.length - maxTrailLength);
                }
            } else {
                b.history = [];
            }
        }
    }

    // Render Loop
    function render() {
        if (showTrails) {
            ctx.fillStyle = 'rgba(5, 7, 14, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#05070e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draw Nodes
        for (let n of nodes) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            if (n.type === 'attract') {
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
            } else {
                ctx.fillStyle = '#f43f5e';
                ctx.shadowColor = '#f43f5e';
            }
            ctx.shadowBlur = 15;
            ctx.fill();

            // Core Symbol
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.type === 'attract' ? '+' : '−', n.x, n.y);
            ctx.restore();
        }

        // Draw Balls & Paths
        for (let b of balls) {
            if (showTrails && b.history.length > 1) {
                ctx.beginPath();
                ctx.moveTo(b.history[0].x, b.history[0].y);
                for (let i = 1; i < b.history.length; i++) {
                    ctx.lineTo(b.history[i].x, b.history[i].y);
                }
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
        }

        // Draw Slingshot Aim Vector
        if (isDragging) {
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(dragCurrent.x, dragCurrent.y);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(dragStart.x, dragStart.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
        }

        requestAnimationFrame(loop);
    }

    function loop() {
        updatePhysics();
        render();
    }

    loop();
</script>
</body>
</html>
