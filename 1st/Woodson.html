<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1st Grade Space Gravity Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #050212;
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Pulsing and glowing UI styles */
        .glow-title {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #00f0ff, 0 0 30px #ffea00;
        }

        .glow-box {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .btn-touch {
            transition: transform 0.1s ease, box-shadow 0.15s ease, background-color 0.15s;
        }

        .btn-touch:active {
            transform: scale(0.93);
        }

        /* Animated progress bar transition */
        #cooldown-bar {
            transition: width 0.05s linear;
        }

        /* Custom scrollbar reset */
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen bg-slate-950 text-white select-none overflow-hidden">

    <!-- Top Header Navigation / HUD -->
    <header class="w-full bg-slate-900/90 border-b-2 border-fuchsia-500/50 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shadow-lg backdrop-blur-md">
        
        <!-- App Title -->
        <div class="flex items-center gap-2">
            <span class="text-3xl animate-bounce">🚀</span>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-wide bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 bg-clip-text text-transparent glow-title">
                    Space Gravity Simulator
                </h1>
                <p class="text-xs text-cyan-200 hidden sm:block font-medium">Woodson's 1st Grade Science Lab</p>
            </div>
        </div>

        <!-- HUD Metrics & Cooldown Timer -->
        <div class="flex items-center gap-3 sm:gap-4 flex-wrap">
            
            <!-- Spaceship Count Badge -->
            <div class="bg-slate-800/90 border-2 border-cyan-400/60 rounded-xl px-3 py-1.5 flex items-center gap-2 shadow-inner">
                <span class="text-xl">🛸</span>
                <div>
                    <div class="text-[10px] text-cyan-300 font-bold uppercase tracking-wider">Spaceships</div>
                    <div id="ship-counter" class="text-sm font-black text-yellow-300">0 / 50</div>
                </div>
            </div>

            <!-- Click Cooldown Progress Meter (Spam Filter Visualizer) -->
            <div class="bg-slate-800/90 border-2 border-purple-400/60 rounded-xl px-3 py-1.5 flex flex-col justify-center min-w-[130px] sm:min-w-[160px] shadow-inner">
                <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider mb-1">
                    <span class="text-purple-300">Launch Laser</span>
                    <span id="cooldown-text" class="text-emerald-400 font-extrabold">READY!</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 border border-slate-700 overflow-hidden">
                    <div id="cooldown-bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-300 w-full rounded-full"></div>
                </div>
            </div>

            <!-- Sound Toggle Button -->
            <button id="sound-btn" onclick="toggleSound()" class="btn-touch bg-slate-800 hover:bg-slate-700 border-2 border-yellow-400/70 text-yellow-300 p-2 rounded-xl text-lg flex items-center justify-center shadow-md">
                🔊
            </button>

            <!-- Reset Button -->
            <button onclick="resetSimulation()" class="btn-touch bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-extrabold px-4 py-2 rounded-xl border-2 border-red-300 shadow-lg text-sm tracking-wide flex items-center gap-1.5">
                <span>🔄</span> CLEAR
            </button>
        </div>
    </header>

    <!-- Main Canvas Wrapper -->
    <div id="canvas-wrapper" class="relative flex-1 w-full h-full bg-slate-950 overflow-hidden cursor-crosshair">
        
        <!-- Canvas Element -->
        <canvas id="simCanvas" class="w-full h-full"></canvas>

        <!-- Toast / Hint Banner Overlay -->
        <div id="toast-banner" class="absolute bottom-4 left-1/2 -translate-x-1/2 pointer-events-none bg-slate-900/80 border-2 border-cyan-400/80 px-6 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md text-center transition-opacity duration-300">
            <p id="toast-text" class="text-sm sm:text-base font-bold bg-gradient-to-r from-yellow-200 via-cyan-200 to-pink-300 bg-clip-text text-transparent flex items-center gap-2">
                ✨ Tap anywhere on screen to launch 10 spaceships into orbit! ✨
            </p>
        </div>
    </div>

    <!-- Simulation Code Logic -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS & CONFIG
        const GRAVITY_CONSTANT = 2800;    // Gravitational Pull Strength (G)
        const SOFTENING_FACTOR = 350;     // Prevents infinite velocity near Sun center
        const MAX_SPACESHIPS = 50;        // Strict limit of 50 active spaceships
        const COOLDOWN_MS = 1000;         // 1x per second spam click filter rate limit
        const SHIPS_PER_LAUNCH = 10;      // Launches 10 spaceships at once

        // STATE VARIABLES
        let spaceships = [];
        let solarParticles = [];
        let backgroundStars = [];
        let lastLaunchTime = 0;           // Timestamp of last launch for rate limiter
        let soundEnabled = true;

        // Central Sun Node
        const sun = {
            x: 0,
            y: 0,
            radius: 38,
            rotationAngle: 0
        };

        // Floating Astronaut State
        const astronaut = {
            x: 100,
            y: 100,
            vx: 0.35,
            vy: 0.2,
            angle: 0,
            rotSpeed: 0.008,
            scale: 0.9,
            tetherPhase: 0
        };

        // Moon State
        const moon = {
            x: 140,
            y: 120,
            radius: 42
        };

        // Vibrant Color Palette Array for Spaceships
        const NEON_COLORS = [
            '#00f0ff', '#ff007f', '#39ff14', '#ffe600', 
            '#ff5e00', '#b500ff', '#00ffaa', '#ff00aa',
            '#00d4ff', '#ffea00', '#ff0055', '#7d00ff'
        ];

        // Web Audio API Synthesizer (Zero External Dependencies)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'launch') {
                    // Celestial sweep sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'reset') {
                    // Warm chime sound
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(261.63, now + 0.4); // C4
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'absorbed') {
                    // Soft pop
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'cooldown') {
                    // Low buzz warning
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                // Audio fallback silence
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('border-yellow-400/70', soundEnabled);
            btn.classList.toggle('border-slate-600', !soundEnabled);
        }

        // RESIZE CANVAS & RECENTER
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter Sun
            sun.x = canvas.width / 2;
            sun.y = canvas.height / 2;

            // Reposition Moon dynamically relative to top right
            moon.x = Math.max(90, canvas.width - 140);
            moon.y = 110;

            generateBackgroundStars();
        }

        // GENERATE STARS WITH SHIMMERING GLINTS
        function generateBackgroundStars() {
            backgroundStars = [];
            const starCount = Math.floor((canvas.width * canvas.height) / 4500);

            for (let i = 0; i < starCount; i++) {
                backgroundStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 0.6,
                    color: ['#ffffff', '#00f0ff', '#ff00aa', '#ffe600', '#b500ff'][Math.floor(Math.random() * 5)],
                    alpha: Math.random(),
                    twinkleSpeed: 0.01 + Math.random() * 0.035,
                    hasCrossGlint: Math.random() > 0.82
                });
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // EVENT HANDLERS FOR TOUCH AND MOUSE
        function handleInteraction(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            attemptLaunch(clickX, clickY);
        }

        // Mouse click listener
        canvas.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        // Touch listener for Chromebook touchscreens
        let lastTouchTime = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent double-triggering or touch scrolling
            const touch = e.touches[0];
            if (touch) {
                lastTouchTime = Date.now();
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        // LAUNCH 10 SPACESHIPS IN STABLE ORBIT WITH RATE LIMITER
        function attemptLaunch(clickX, clickY) {
            const now = Date.now();
            const timeSinceLast = now - lastLaunchTime;

            // Spam-Click Filter Check (1000ms cooldown)
            if (timeSinceLast < COOLDOWN_MS) {
                showToast("⏱️ Wait 1 second between launches!");
                playSound('cooldown');
                shakeCooldownMeter();
                return;
            }

            // Maximum Spaceship Cap Check
            if (spaceships.length >= MAX_SPACESHIPS) {
                showToast("🚨 Maximum 50 spaceships reached! Click CLEAR to reset.");
                playSound('cooldown');
                return;
            }

            // Calculate current launch capacity up to MAX_SPACESHIPS
            const countToLaunch = Math.min(SHIPS_PER_LAUNCH, MAX_SPACESHIPS - spaceships.length);
            
            // Calculate distance and direction relative to central Sun
            const dx = clickX - sun.x;
            const dy = clickY - sun.y;
            const r = Math.sqrt(dx * dx + dy * dy);

            // Minimum launch distance check from Sun surface
            if (r < sun.radius + 15) {
                showToast("☀️ Too close to the Sun! Tap further out.");
                playSound('cooldown');
                return;
            }

            // Ideal Circular Orbital Speed Formula: v = sqrt(G / r)
            const idealOrbitalSpeed = Math.sqrt(GRAVITY_CONSTANT / r);

            // Tangential Vector (perpendicular to radial line from Sun)
            // Normal direction vector towards Sun: (-dx/r, -dy/r)
            // Tangential vector (clockwise orbit): (-dy/r, dx/r)
            const tangentX = -dy / r;
            const tangentY = dx / r;

            // Launch Fleet of Ships in Formation
            for (let i = 0; i < countToLaunch; i++) {
                // Introduce gentle variations in position and velocity so ships orbit in a beautiful fleet
                const speedVariation = 0.88 + (i * 0.028) + (Math.random() * 0.04 - 0.02);
                const shipSpeed = idealOrbitalSpeed * speedVariation;

                // Slight offset along tangent line
                const offsetDistance = (i - countToLaunch / 2) * 12;
                const spawnX = clickX + tangentX * offsetDistance + (Math.random() * 6 - 3);
                const spawnY = clickY + tangentY * offsetDistance + (Math.random() * 6 - 3);

                const color = NEON_COLORS[(spaceships.length + i) % NEON_COLORS.length];

                spaceships.push({
                    x: spawnX,
                    y: spawnY,
                    vx: tangentX * shipSpeed,
                    vy: tangentY * shipSpeed,
                    radius: 6,
                    color: color,
                    trail: [],
                    maxTrailLength: 45,
                    shipType: i % 3, // Rocket shape variant
                    id: Math.random()
                });
            }

            lastLaunchTime = now;
            playSound('launch');
            showToast(`🚀 Launched ${countToLaunch} spaceships into orbit!`);
            updateHUD();
        }

        // SHAKE COOLDOWN METER ON SPAM CLICK
        function shakeCooldownMeter() {
            const meter = document.getElementById('cooldown-text');
            meter.classList.add('animate-ping');
            setTimeout(() => meter.classList.remove('animate-ping'), 300);
        }

        // DISPLAY TOAST NOTIFICATION
        let toastTimeout = null;
        function showToast(message) {
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastText.textContent = "✨ Tap anywhere on screen to launch 10 spaceships into orbit! ✨";
            }, 2600);
        }

        // RESET SIMULATION
        function resetSimulation() {
            spaceships = [];
            playSound('reset');
            showToast("🔄 Space cleared! Ready to launch new fleet.");
            updateHUD();
        }

        // UPDATE HUD DISPLAY
        function updateHUD() {
            const counter = document.getElementById('ship-counter');
            counter.textContent = `${spaceships.length} / ${MAX_SPACESHIPS}`;

            if (spaceships.length >= MAX_SPACESHIPS) {
                counter.className = "text-sm font-black text-red-400 animate-pulse";
            } else if (spaceships.length >= 35) {
                counter.className = "text-sm font-black text-amber-300";
            } else {
                counter.className = "text-sm font-black text-yellow-300";
            }
        }

        // UPDATE COOLDOWN VISUAL PROGRESS BAR
        function updateCooldownBar() {
            const now = Date.now();
            const elapsed = now - lastLaunchTime;
            const progress = Math.min(100, (elapsed / COOLDOWN_MS) * 100);

            const bar = document.getElementById('cooldown-bar');
            const text = document.getElementById('cooldown-text');

            bar.style.width = `${progress}%`;

            if (progress >= 100) {
                text.textContent = "READY!";
                text.className = "text-emerald-400 font-extrabold";
                bar.className = "h-full bg-gradient-to-r from-emerald-400 to-cyan-300 w-full rounded-full";
            } else {
                const remaining = ((COOLDOWN_MS - elapsed) / 1000).toFixed(1);
                text.textContent = `WAIT (${remaining}s)`;
                text.className = "text-amber-400 font-extrabold";
                bar.className = "h-full bg-gradient-to-r from-amber-400 to-red-400 rounded-full";
            }
        }

        // SPAWN SOLAR PLASMA PARTICLES FROM SUN
        function updateSolarParticles() {
            // Spawn continuous solar flare particles
            if (Math.random() < 0.65) {
                const angle = Math.random() * Math.PI * 2;
                const spawnRadius = sun.radius * (0.8 + Math.random() * 0.3);
                const speed = 0.4 + Math.random() * 1.2;

                solarParticles.push({
                    x: sun.x + Math.cos(angle) * spawnRadius,
                    y: sun.y + Math.sin(angle) * spawnRadius,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3.5 + 1.2,
                    color: ['#ffe600', '#ff5e00', '#ff0055', '#ffffff', '#ffb700'][Math.floor(Math.random() * 5)],
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02
                });
            }

            // Update existing solar particles
            for (let i = solarParticles.length - 1; i >= 0; i--) {
                const p = solarParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    solarParticles.splice(i, 1);
                }
            }
        }

        // UPDATE ASTRONAUT POSITION
        function updateAstronaut() {
            astronaut.x += astronaut.vx;
            astronaut.y += astronaut.vy;
            astronaut.angle += astronaut.rotSpeed;
            astronaut.tetherPhase += 0.03;

            // Wrap around screen boundaries with margin
            const margin = 80;
            if (astronaut.x > canvas.width + margin) astronaut.x = -margin;
            if (astronaut.x < -margin) astronaut.x = canvas.width + margin;
            if (astronaut.y > canvas.height + margin) astronaut.y = -margin;
            if (astronaut.y < -margin) astronaut.y = canvas.height + margin;
        }

        // PHYSICS ENGINE STEP
        function updatePhysics() {
            for (let i = spaceships.length - 1; i >= 0; i--) {
                const s = spaceships[i];

                // Vector from spaceship to Sun
                const dx = sun.x - s.x;
                const dy = sun.y - s.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Collision with Sun check (absorption)
                if (dist < sun.radius + s.radius - 4) {
                    // Create mini explosion burst of solar sparks
                    for (let k = 0; k < 8; k++) {
                        const sparkAngle = Math.random() * Math.PI * 2;
                        const sparkSpeed = Math.random() * 2 + 1;
                        solarParticles.push({
                            x: s.x,
                            y: s.y,
                            vx: Math.cos(sparkAngle) * sparkSpeed,
                            vy: Math.sin(sparkAngle) * sparkSpeed,
                            radius: Math.random() * 3 + 1.5,
                            color: s.color,
                            life: 1.0,
                            decay: 0.03
                        });
                    }
                    playSound('absorbed');
                    spaceships.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Remove ships that drift way out of bounds
                const margin = 800;
                if (s.x < -margin || s.x > canvas.width + margin ||
                    s.y < -margin || s.y > canvas.height + margin) {
                    spaceships.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Gravity Acceleration (Inverse Square Law)
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Acceleration vector components towards Sun
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity & position
                s.vx += ax;
                s.vy += ay;
                s.x += s.vx;
                s.y += s.vy;

                // Record position history for rainbow light trail
                s.trail.push({ x: s.x, y: s.y });
                if (s.trail.length > s.maxTrailLength) {
                    s.trail.shift();
                }
            }

            sun.rotationAngle += 0.005;
            updateSolarParticles();
            updateAstronaut();
            updateCooldownBar();
        }

        // DRAWING FUNCTIONS

        // 1. DRAW TWINKLING STARS
        function drawStars() {
            for (const star of backgroundStars) {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.15) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                const currentAlpha = Math.max(0.1, Math.min(1, star.alpha));

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw shiny cross glint on bright stars
                if (star.hasCrossGlint && currentAlpha > 0.6) {
                    ctx.strokeStyle = star.color;
                    ctx.lineWidth = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(star.x - star.radius * 3, star.y);
                    ctx.lineTo(star.x + star.radius * 3, star.y);
                    ctx.moveTo(star.x, star.y - star.radius * 3);
                    ctx.lineTo(star.x, star.y + star.radius * 3);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // 2. DRAW MOON WITH CRATERS
        function drawMoon() {
            ctx.save();

            // Outer Atmospheric Glow
            const moonGlow = ctx.createRadialGradient(moon.x, moon.y, moon.radius * 0.8, moon.x, moon.y, moon.radius * 1.8);
            moonGlow.addColorStop(0, 'rgba(174, 216, 242, 0.35)');
            moonGlow.addColorStop(1, 'rgba(174, 216, 242, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moon.radius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            // Moon Base Body
            const moonGrad = ctx.createRadialGradient(moon.x - 12, moon.y - 12, 5, moon.x, moon.y, moon.radius);
            moonGrad.addColorStop(0, '#f0f4f8');
            moonGrad.addColorStop(0.7, '#cbd5e1');
            moonGrad.addColorStop(1, '#64748b');

            ctx.fillStyle = moonGrad;
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
            ctx.fill();

            // Crater Details
            const craters = [
                { x: moon.x - 14, y: moon.y - 10, r: 8 },
                { x: moon.x + 12, y: moon.y - 15, r: 6 },
                { x: moon.x + 8, y: moon.y + 12, r: 10 },
                { x: moon.x - 18, y: moon.y + 14, r: 5 },
                { x: moon.x - 2, y: moon.y + 2, r: 7 }
            ];

            ctx.fillStyle = 'rgba(100, 116, 139, 0.35)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;

            for (const c of craters) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
        }

        // 3. DRAW FLOATING ASTRONAUT
        function drawAstronaut() {
            ctx.save();
            ctx.translate(astronaut.x, astronaut.y);
            ctx.rotate(astronaut.angle);
            ctx.scale(astronaut.scale, astronaut.scale);

            // Wavy Tether Cord
            ctx.beginPath();
            ctx.moveTo(-15, 10);
            const waveY = Math.sin(astronaut.tetherPhase) * 15;
            ctx.quadraticCurveTo(-50, 30 + waveY, -100, 50);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Jetpack / Backpack
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.roundRect(-22, -18, 12, 32, 4);
            ctx.fill();

            // Suit Body
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.roundRect(-12, -16, 24, 30, 8);
            ctx.fill();

            // Suit Chest Emblem
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-6, -8, 5, 4);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(1, -8, 5, 4);

            // Helmet
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -20, 14, 0, Math.PI * 2);
            ctx.fill();

            // Gold Reflective Shiny Visor
            const visorGrad = ctx.createLinearGradient(-8, -26, 8, -14);
            visorGrad.addColorStop(0, '#f59e0b');
            visorGrad.addColorStop(0.5, '#fbbf24');
            visorGrad.addColorStop(1, '#78350f');

            ctx.fillStyle = visorGrad;
            ctx.beginPath();
            ctx.arc(2, -20, 9, 0, Math.PI * 2);
            ctx.fill();

            // Visor Shine Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(-1, -23, 3, 0, Math.PI * 2);
            ctx.fill();

            // Arms & Legs
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            // Left Arm waving
            ctx.beginPath();
            ctx.moveTo(-10, -8);
            ctx.lineTo(-20, -18);
            ctx.stroke();

            // Right Arm
            ctx.beginPath();
            ctx.moveTo(10, -8);
            ctx.lineTo(18, -2);
            ctx.stroke();

            // Legs
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(-12, 26);
            ctx.moveTo(6, 12);
            ctx.lineTo(10, 28);
            ctx.stroke();

            ctx.restore();
        }

        // 4. DRAW CENTRAL SUN WITH SOLAR FLARES & DYNAMIC PARTICLES
        function drawSun() {
            ctx.save();
            ctx.translate(sun.x, sun.y);

            // Rotating Solar Flares / Rays
            ctx.save();
            ctx.rotate(sun.rotationAngle);
            const rayCount = 12;
            const outerRayLen = sun.radius + 22;

            for (let i = 0; i < rayCount; i++) {
                const angle = (i * Math.PI * 2) / rayCount;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle - 0.15) * sun.radius, Math.sin(angle - 0.15) * sun.radius);
                ctx.lineTo(Math.cos(angle) * outerRayLen, Math.sin(angle) * outerRayLen);
                ctx.lineTo(Math.cos(angle + 0.15) * sun.radius, Math.sin(angle + 0.15) * sun.radius);
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(255, 230, 0, 0.55)' : 'rgba(255, 94, 0, 0.55)';
                ctx.fill();
            }
            ctx.restore();

            // Outer Radial Corona Glow
            const coronaGrad = ctx.createRadialGradient(0, 0, sun.radius * 0.7, 0, 0, sun.radius * 2.6);
            coronaGrad.addColorStop(0, 'rgba(255, 230, 0, 0.8)');
            coronaGrad.addColorStop(0.4, 'rgba(255, 94, 0, 0.4)');
            coronaGrad.addColorStop(0.8, 'rgba(255, 0, 128, 0.15)');
            coronaGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.fillStyle = coronaGrad;
            ctx.beginPath();
            ctx.arc(0, 0, sun.radius * 2.6, 0, Math.PI * 2);
            ctx.fill();

            // Sun Main Body Core
            const coreGrad = ctx.createRadialGradient(-10, -10, 4, 0, 0, sun.radius);
            coreGrad.addColorStop(0, '#ffffff');
            coreGrad.addColorStop(0.2, '#fff176');
            coreGrad.addColorStop(0.6, '#f57c00');
            coreGrad.addColorStop(1, '#d84315');

            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, sun.radius, 0, Math.PI * 2);
            ctx.fill();

            // Cute Friendly Sun Face Features (1st-Grade Friendly!)
            // Eyes
            ctx.fillStyle = '#3e2723';
            ctx.beginPath();
            ctx.arc(-11, -6, 4, 0, Math.PI * 2);
            ctx.arc(11, -6, 4, 0, Math.PI * 2);
            ctx.fill();

            // Eye Sparkle Glints
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-12, -8, 1.5, 0, Math.PI * 2);
            ctx.arc(10, -8, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Rosy Pink Cheeks
            ctx.fillStyle = 'rgba(255, 64, 129, 0.45)';
            ctx.beginPath();
            ctx.arc(-15, 2, 4.5, 0, Math.PI * 2);
            ctx.arc(15, 2, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Happy Smile
            ctx.beginPath();
            ctx.arc(0, 2, 9, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.restore();

            // Draw Emitted Solar Plasma Particles
            for (const p of solarParticles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 5. DRAW SPACESHIPS & RAINBOW EXHAUST TRAILS
        function drawSpaceships() {
            for (const s of spaceships) {
                // Draw Rainbow Light Trail
                if (s.trail.length > 1) {
                    for (let t = 0; t < s.trail.length - 1; t++) {
                        const p1 = s.trail[t];
                        const p2 = s.trail[t + 1];
                        const progress = t / s.trail.length;

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = s.color;
                        ctx.globalAlpha = progress * 0.75;
                        ctx.lineWidth = (progress * s.radius) + 0.8;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                // Draw Spaceship Body Pointing in Velocity Direction
                ctx.save();
                ctx.translate(s.x, s.y);

                // Calculate heading angle matching velocity vector
                const angle = Math.atan2(s.vy, s.vx) + Math.PI / 2;
                ctx.rotate(angle);

                // Flickering Engine Flame at Back
                const flameLength = 8 + Math.random() * 8;
                const flameGrad = ctx.createLinearGradient(0, 6, 0, 6 + flameLength);
                flameGrad.addColorStop(0, '#ffe600');
                flameGrad.addColorStop(0.5, '#ff5e00');
                flameGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');

                ctx.fillStyle = flameGrad;
                ctx.beginPath();
                ctx.moveTo(-3.5, 6);
                ctx.lineTo(0, 6 + flameLength);
                ctx.lineTo(3.5, 6);
                ctx.closePath();
                ctx.fill();

                // Rocket Main Hull Body
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.moveTo(0, -12); // Nose cone
                ctx.quadraticCurveTo(8, -2, 6, 8); // Right side
                ctx.lineTo(-6, 8); // Bottom base
                ctx.quadraticCurveTo(-8, -2, 0, -12); // Left side
                ctx.closePath();
                ctx.fill();

                // Shiny Cockpit Visor Bubble
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(0, -2, 3.2, 0, Math.PI * 2);
                ctx.fill();

                // Cockpit Highlight
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-1, -3, 1, 0, Math.PI * 2);
                ctx.fill();

                // Side Wings / Fins
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-6, 2);
                ctx.lineTo(-10, 8);
                ctx.lineTo(-5, 8);
                ctx.closePath();
                ctx.moveTo(6, 2);
                ctx.lineTo(10, 8);
                ctx.lineTo(5, 8);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // MAIN DRAW LOOP
        function draw() {
            // Dark Deep Space Canvas Background with Subtle Nebula Tint
            const bgGrad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 50,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
            );
            bgGrad.addColorStop(0, '#0c0524');
            bgGrad.addColorStop(0.6, '#050212');
            bgGrad.addColorStop(1, '#020008');

            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Layers
            drawStars();
            drawMoon();
            drawAstronaut();
            drawSun();
            drawSpaceships();
        }

        // MAIN ANIMATION LOOP
        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        // INIT ON WINDOW LOAD
        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
