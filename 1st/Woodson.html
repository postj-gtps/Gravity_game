<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1st Grade Space & Gravity Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #030014;
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Glowing text & UI elements */
        .glow-title {
            text-shadow: 0 0 12px #ff007f, 0 0 24px #00f0ff, 0 0 36px #ffea00;
        }

        .glow-box {
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .btn-touch {
            transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s;
        }

        .btn-touch:active {
            transform: scale(0.92);
        }

        /* Cooldown smooth transition */
        #cooldown-bar {
            transition: width 0.05s linear;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen bg-slate-950 text-white select-none overflow-hidden">

    <!-- Top Header HUD Navigation Bar -->
    <header class="w-full bg-slate-900/90 border-b-2 border-fuchsia-500/60 px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shadow-2xl backdrop-blur-md">
        
        <!-- App Title -->
        <div class="flex items-center gap-2.5">
            <span class="text-3xl sm:text-4xl animate-bounce">🚀</span>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-wide bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 bg-clip-text text-transparent glow-title">
                    Space & Gravity Simulator
                </h1>
                <p class="text-[11px] sm:text-xs text-cyan-200 font-bold hidden sm:block">Woodson's 1st Grade Science Lab</p>
            </div>
        </div>

        <!-- HUD Metrics & Interactive Controls -->
        <div class="flex items-center gap-2.5 sm:gap-4 flex-wrap">
            
            <!-- Rocket Counter Badge -->
            <div class="bg-slate-800/95 border-2 border-cyan-400/70 rounded-2xl px-3 py-1.5 flex items-center gap-2 shadow-inner">
                <span class="text-xl">🛸</span>
                <div>
                    <div class="text-[10px] text-cyan-300 font-extrabold uppercase tracking-wider">Rockets</div>
                    <div id="ship-counter" class="text-sm font-black text-yellow-300">0 / 50</div>
                </div>
            </div>

            <!-- Spam Filter 1-Second Cooldown Meter -->
            <div class="bg-slate-800/95 border-2 border-purple-400/70 rounded-2xl px-3 py-1.5 flex flex-col justify-center min-w-[130px] sm:min-w-[160px] shadow-inner">
                <div class="flex justify-between items-center text-[10px] font-extrabold uppercase tracking-wider mb-1">
                    <span class="text-purple-300">Launch Laser</span>
                    <span id="cooldown-text" class="text-emerald-400 font-extrabold">READY!</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 border border-slate-700 overflow-hidden">
                    <div id="cooldown-bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-300 w-full rounded-full"></div>
                </div>
            </div>

            <!-- Sound Effects Toggle Button -->
            <button id="sound-btn" onclick="toggleSound()" class="btn-touch bg-slate-800 hover:bg-slate-700 border-2 border-yellow-400/80 text-yellow-300 p-2.5 rounded-2xl text-xl flex items-center justify-center shadow-lg">
                🔊
            </button>

            <!-- Reset Button -->
            <button onclick="resetSimulation()" class="btn-touch bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-black px-4 py-2 rounded-2xl border-2 border-red-300 shadow-xl text-sm tracking-wider flex items-center gap-1.5">
                <span>🔄</span> CLEAR
            </button>
        </div>
    </header>

    <!-- Main Canvas Interactive Simulation Container -->
    <div id="canvas-wrapper" class="relative flex-1 w-full h-full bg-slate-950 overflow-hidden cursor-crosshair">
        
        <!-- Canvas -->
        <canvas id="simCanvas" class="w-full h-full"></canvas>

        <!-- Floating Touch Target Cursor Rings for Touch Feedback -->
        <div id="touch-ring" class="pointer-events-none absolute w-16 h-16 rounded-full border-4 border-cyan-400 opacity-0 transform -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300"></div>

        <!-- Notification Toast Banner -->
        <div id="toast-banner" class="absolute bottom-5 left-1/2 -translate-x-1/2 pointer-events-none bg-slate-900/90 border-2 border-cyan-400/90 px-6 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md text-center max-w-[90vw]">
            <p id="toast-text" class="text-xs sm:text-base font-extrabold bg-gradient-to-r from-yellow-200 via-cyan-200 to-pink-300 bg-clip-text text-transparent flex items-center justify-center gap-2">
                ✨ Tap anywhere on screen to launch 10 rockets! Some orbit, some plunge into the Sun! ✨
            </p>
        </div>
    </div>

    <!-- Script Implementation -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // SIMULATION CONSTANTS & CONFIGURATION
        const GRAVITY_CONSTANT = 3200;    // Gravitational Strength (G)
        const SOFTENING_FACTOR = 300;     // Prevents infinite acceleration near center
        const MAX_SPACESHIPS = 50;        // Maximum active rockets allowed
        const COOLDOWN_MS = 1000;         // 1x per second spam-click rate limit filter
        const SHIPS_PER_LAUNCH = 10;      // Number of rockets created per click

        // SIMULATION STATE VARIABLES
        let spaceships = [];
        let solarParticles = [];
        let backgroundStars = [];
        let explosionSparks = [];
        let lastLaunchTime = 0;
        let soundEnabled = true;

        // Central Sun Mass Definition
        const sun = {
            x: 0,
            y: 0,
            radius: 42,
            rotationAngle: 0,
            pulsePhase: 0
        };

        // Floating Astronaut State
        const astronaut = {
            x: 120,
            y: 120,
            vx: 0.3,
            vy: 0.18,
            angle: 0,
            rotSpeed: 0.006,
            scale: 0.95,
            tetherPhase: 0
        };

        // Detailed Background Moon Definition
        const moon = {
            x: 160,
            y: 130,
            radius: 46
        };

        // Vibrant Neon Color Palette for Rockets & Trails
        const NEON_COLORS = [
            '#00f0ff', '#ff007f', '#39ff14', '#ffe600', 
            '#ff5e00', '#b500ff', '#00ffaa', '#ff00aa',
            '#00d4ff', '#ffea00', '#ff0055', '#7d00ff'
        ];

        // Synthesizer Audio Context (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'launch') {
                    // Rocket launch ascending laser sound effect
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.35);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'crash') {
                    // Sun crash explosion sound effect
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'reset') {
                    // Reset clear chime
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(261.63, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'cooldown') {
                    // Rate limit warning buzzer
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                // Audio silent fallback
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('border-yellow-400/80', soundEnabled);
            btn.classList.toggle('border-slate-600', !soundEnabled);
        }

        // RESIZE CANVAS & DYNAMIC RECENTERING
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // Recenter Central Sun
            sun.x = canvas.width / 2;
            sun.y = canvas.height / 2;

            // Position Moon relative to screen top right
            moon.x = Math.max(100, canvas.width - 150);
            moon.y = 120;

            generateBackgroundStars();
        }

        // GENERATE MULTI-COLORED TWINKLING STARS
        function generateBackgroundStars() {
            backgroundStars = [];
            const starCount = Math.floor((canvas.width * canvas.height) / 4000);

            for (let i = 0; i < starCount; i++) {
                backgroundStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2.2 + 0.6,
                    color: ['#ffffff', '#00f0ff', '#ff00aa', '#ffe600', '#b500ff', '#39ff14'][Math.floor(Math.random() * 6)],
                    alpha: Math.random(),
                    twinkleSpeed: 0.012 + Math.random() * 0.035,
                    hasGlint: Math.random() > 0.82
                });
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // TOUCH & MOUSE INTERACTION HANDLER
        function handleInteraction(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            // Visual touch ring effect
            const ring = document.getElementById('touch-ring');
            ring.style.left = `${clickX}px`;
            ring.style.top = `${clickY}px`;
            ring.style.opacity = '1';
            ring.style.transform = 'translate(-50%, -50%) scale(1.3)';
            setTimeout(() => {
                ring.style.opacity = '0';
                ring.style.transform = 'translate(-50%, -50%) scale(0.8)';
            }, 250);

            attemptLaunch(clickX, clickY);
        }

        // Mouse click event
        canvas.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        // Touch event optimized for Chromebook Touchscreens
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling & zooming gestures
            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[0];
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        // LAUNCH 10 ROCKETS WITH VARIED TRAJECTORIES (ORBITAL & GRAVITY WELL FALLERS)
        function attemptLaunch(clickX, clickY) {
            const now = Date.now();
            const timeSinceLast = now - lastLaunchTime;

            // 1-Second Spam-Click Rate Limiter Check
            if (timeSinceLast < COOLDOWN_MS) {
                showToast("⏱️ Wait 1 second before launching again!");
                playSound('cooldown');
                shakeCooldownMeter();
                return;
            }

            // Maximum Active Rockets Cap Check
            if (spaceships.length >= MAX_SPACESHIPS) {
                showToast("🚨 Maximum 50 rockets active! Tap CLEAR to launch more.");
                playSound('cooldown');
                return;
            }

            // Distance & Direction relative to central Sun
            const dx = clickX - sun.x;
            const dy = clickY - sun.y;
            const r = Math.sqrt(dx * dx + dy * dy);

            // Minimum Launch Radius Check from Sun surface
            if (r < sun.radius + 15) {
                showToast("☀️ Too close to the Sun! Tap further away.");
                playSound('cooldown');
                return;
            }

            // Calculate current launch count (up to 10 rockets, max total 50)
            const countToLaunch = Math.min(SHIPS_PER_LAUNCH, MAX_SPACESHIPS - spaceships.length);

            // Ideal Circular Orbital Speed Formula: v = sqrt(G / r)
            const idealOrbitalSpeed = Math.sqrt(GRAVITY_CONSTANT / r);

            // Normal radial unit vector towards Sun: (nx, ny)
            const nx = dx / r;
            const ny = dy / r;

            // Clockwise Tangential Unit Vector (perpendicular to radial line): (tx, ty)
            const tx = -ny;
            const ty = nx;

            // Launch 10 Rockets with VARIED VELOCITIES (Orbits & Plunging Gravity Well Trajectories)
            for (let i = 0; i < countToLaunch; i++) {
                // Determine trajectory profile for each rocket:
                // - Some rockets launch near ideal circular orbital speed (0.95 - 1.05x speed)
                // - Some launch with significantly LOWER tangential speed (0.25 - 0.55x speed) or inward angle, causing them to fall into the Sun's gravity well!
                // - Some launch with slightly higher speed (1.15x) creating elongated elliptical orbits.

                let speedMultiplier;
                let radialInwardFactor = 0;

                if (i % 3 === 0) {
                    // Gravity Well Plungers (Sub-orbital speed -> falls into Sun!)
                    speedMultiplier = 0.25 + Math.random() * 0.35;
                    radialInwardFactor = -0.25; // slight inward nudge towards sun
                } else if (i % 3 === 1) {
                    // Stable Circular/Slightly Elliptical Orbiters
                    speedMultiplier = 0.92 + (i * 0.02) + (Math.random() * 0.08);
                    radialInwardFactor = (Math.random() * 0.1) - 0.05;
                } else {
                    // Wide Elliptical Orbiters
                    speedMultiplier = 1.1 + (Math.random() * 0.12);
                    radialInwardFactor = 0.1; // slight outward thrust
                }

                const finalVx = (tx * idealOrbitalSpeed * speedMultiplier) + (nx * idealOrbitalSpeed * radialInwardFactor);
                const finalVy = (ty * idealOrbitalSpeed * speedMultiplier) + (ny * idealOrbitalSpeed * radialInwardFactor);

                // Offset spawn points in a neat rocket formation layout
                const offsetSpread = (i - countToLaunch / 2) * 11;
                const spawnX = clickX + (tx * offsetSpread) + (Math.random() * 8 - 4);
                const spawnY = clickY + (ty * offsetSpread) + (Math.random() * 8 - 4);

                const color = NEON_COLORS[(spaceships.length + i) % NEON_COLORS.length];

                spaceships.push({
                    x: spawnX,
                    y: spawnY,
                    vx: finalVx,
                    vy: finalVy,
                    radius: 6,
                    color: color,
                    trail: [],
                    maxTrailLength: 45,
                    id: Math.random()
                });
            }

            lastLaunchTime = now;
            playSound('launch');
            showToast(`🚀 Launched ${countToLaunch} rockets! Watch some fall into the Sun's gravity well!`);
            updateHUD();
        }

        // COOLDOWN METER ANIMATION FEEDBACK ON SPAM CLICK
        function shakeCooldownMeter() {
            const text = document.getElementById('cooldown-text');
            text.classList.add('animate-bounce');
            setTimeout(() => text.classList.remove('animate-bounce'), 350);
        }

        // DISPLAY NOTIFICATION TOAST BANNER
        let toastTimeout = null;
        function showToast(message) {
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastText.textContent = "✨ Tap anywhere on screen to launch 10 rockets! Some orbit, some plunge into the Sun! ✨";
            }, 2800);
        }

        // RESET SIMULATION
        function resetSimulation() {
            spaceships = [];
            explosionSparks = [];
            playSound('reset');
            showToast("🔄 Space cleared! Ready to launch new rockets.");
            updateHUD();
        }

        // UPDATE HUD COUNTERS
        function updateHUD() {
            const counter = document.getElementById('ship-counter');
            counter.textContent = `${spaceships.length} / ${MAX_SPACESHIPS}`;

            if (spaceships.length >= MAX_SPACESHIPS) {
                counter.className = "text-sm font-black text-red-400 animate-pulse";
            } else if (spaceships.length >= 35) {
                counter.className = "text-sm font-black text-amber-300";
            } else {
                counter.className = "text-sm font-black text-yellow-300";
            }
        }

        // UPDATE COOLDOWN VISUAL PROGRESS METER
        function updateCooldownBar() {
            const now = Date.now();
            const elapsed = now - lastLaunchTime;
            const progress = Math.min(100, (elapsed / COOLDOWN_MS) * 100);

            const bar = document.getElementById('cooldown-bar');
            const text = document.getElementById('cooldown-text');

            bar.style.width = `${progress}%`;

            if (progress >= 100) {
                text.textContent = "READY!";
                text.className = "text-emerald-400 font-extrabold";
                bar.className = "h-full bg-gradient-to-r from-emerald-400 to-cyan-300 w-full rounded-full";
            } else {
                const remaining = ((COOLDOWN_MS - elapsed) / 1000).toFixed(1);
                text.textContent = `WAIT (${remaining}s)`;
                text.className = "text-amber-400 font-extrabold";
                bar.className = "h-full bg-gradient-to-r from-amber-400 to-red-500 rounded-full";
            }
        }

        // SPAWN CONTINUOUS SOLAR PLASMA WINDS
        function updateSolarParticles() {
            if (Math.random() < 0.7) {
                const angle = Math.random() * Math.PI * 2;
                const spawnR = sun.radius * (0.85 + Math.random() * 0.25);
                const speed = 0.5 + Math.random() * 1.4;

                solarParticles.push({
                    x: sun.x + Math.cos(angle) * spawnR,
                    y: sun.y + Math.sin(angle) * spawnR,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3.8 + 1.2,
                    color: ['#ffe600', '#ff5e00', '#ff0055', '#ffffff', '#ffb700'][Math.floor(Math.random() * 5)],
                    life: 1.0,
                    decay: 0.014 + Math.random() * 0.02
                });
            }

            for (let i = solarParticles.length - 1; i >= 0; i--) {
                const p = solarParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    solarParticles.splice(i, 1);
                }
            }
        }

        // UPDATE EXPLOSION SPARKS WHEN A ROCKET CRASHES INTO SUN
        function updateExplosionSparks() {
            for (let i = explosionSparks.length - 1; i >= 0; i--) {
                const sp = explosionSparks[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.vx *= 0.96; // drag
                sp.vy *= 0.96;
                sp.life -= sp.decay;

                if (sp.life <= 0) {
                    explosionSparks.splice(i, 1);
                }
            }
        }

        // TRIGGER EXPLOSION WHEN ROCKET CRASHES INTO SUN
        function triggerSunCrashExplosion(x, y, color) {
            playSound('crash');
            for (let k = 0; k < 18; k++) {
                const sparkAngle = Math.random() * Math.PI * 2;
                const sparkSpeed = Math.random() * 4.5 + 1.5;
                explosionSparks.push({
                    x: x,
                    y: y,
                    vx: Math.cos(sparkAngle) * sparkSpeed,
                    vy: Math.sin(sparkAngle) * sparkSpeed,
                    radius: Math.random() * 4.5 + 2,
                    color: color,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.025
                });
            }
        }

        // UPDATE ASTRONAUT POSITION
        function updateAstronaut() {
            astronaut.x += astronaut.vx;
            astronaut.y += astronaut.vy;
            astronaut.angle += astronaut.rotSpeed;
            astronaut.tetherPhase += 0.03;

            // Wrap around screen boundaries smoothly
            const margin = 80;
            if (astronaut.x > canvas.width + margin) astronaut.x = -margin;
            if (astronaut.x < -margin) astronaut.x = canvas.width + margin;
            if (astronaut.y > canvas.height + margin) astronaut.y = -margin;
            if (astronaut.y < -margin) astronaut.y = canvas.height + margin;
        }

        // PHYSICS STEP
        function updatePhysics() {
            for (let i = spaceships.length - 1; i >= 0; i--) {
                const s = spaceships[i];

                // Vector from Rocket to Central Sun
                const dx = sun.x - s.x;
                const dy = sun.y - s.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Check Sun Collision (Gravity Well Crash!)
                if (dist < sun.radius + s.radius - 2) {
                    triggerSunCrashExplosion(s.x, s.y, s.color);
                    spaceships.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Remove rockets drifting far out of screen space
                const margin = 800;
                if (s.x < -margin || s.x > canvas.width + margin ||
                    s.y < -margin || s.y > canvas.height + margin) {
                    spaceships.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Inverse Square Law Gravitational Acceleration
                const acceleration = GRAVITY_CONSTANT / (distSq + SOFTENING_FACTOR);

                // Directional Acceleration Components towards Sun
                const ax = acceleration * (dx / dist);
                const ay = acceleration * (dy / dist);

                // Update velocity & position
                s.vx += ax;
                s.vy += ay;
                s.x += s.vx;
                s.y += s.vy;

                // Record position history for neon trail
                s.trail.push({ x: s.x, y: s.y });
                if (s.trail.length > s.maxTrailLength) {
                    s.trail.shift();
                }
            }

            sun.rotationAngle += 0.006;
            sun.pulsePhase += 0.04;
            updateSolarParticles();
            updateExplosionSparks();
            updateAstronaut();
            updateCooldownBar();
        }

        // DRAWING FUNCTIONS

        // 1. DRAW TWINKLING MULTI-COLORED STARS
        function drawStars() {
            for (const star of backgroundStars) {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.15) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                const currentAlpha = Math.max(0.1, Math.min(1, star.alpha));

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                if (star.hasGlint && currentAlpha > 0.6) {
                    ctx.strokeStyle = star.color;
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(star.x - star.radius * 3.2, star.y);
                    ctx.lineTo(star.x + star.radius * 3.2, star.y);
                    ctx.moveTo(star.x, star.y - star.radius * 3.2);
                    ctx.lineTo(star.x, star.y + star.radius * 3.2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // 2. DRAW MOON WITH CRATERS
        function drawMoon() {
            ctx.save();

            // Atmospheric Lunar Glow
            const moonGlow = ctx.createRadialGradient(moon.x, moon.y, moon.radius * 0.8, moon.x, moon.y, moon.radius * 1.9);
            moonGlow.addColorStop(0, 'rgba(186, 230, 253, 0.35)');
            moonGlow.addColorStop(1, 'rgba(186, 230, 253, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moon.radius * 1.9, 0, Math.PI * 2);
            ctx.fill();

            // Moon Body Gradient
            const moonGrad = ctx.createRadialGradient(moon.x - 14, moon.y - 14, 5, moon.x, moon.y, moon.radius);
            moonGrad.addColorStop(0, '#f8fafc');
            moonGrad.addColorStop(0.65, '#cbd5e1');
            moonGrad.addColorStop(1, '#64748b');

            ctx.fillStyle = moonGrad;
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
            ctx.fill();

            // Craters Details
            const craters = [
                { x: moon.x - 16, y: moon.y - 12, r: 9 },
                { x: moon.x + 14, y: moon.y - 16, r: 7 },
                { x: moon.x + 10, y: moon.y + 14, r: 11 },
                { x: moon.x - 20, y: moon.y + 16, r: 6 },
                { x: moon.x - 2, y: moon.y + 2, r: 8 }
            ];

            ctx.fillStyle = 'rgba(100, 116, 139, 0.38)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1;

            for (const c of craters) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
        }

        // 3. DRAW FLOATING CARTOON ASTRONAUT
        function drawAstronaut() {
            ctx.save();
            ctx.translate(astronaut.x, astronaut.y);
            ctx.rotate(astronaut.angle);
            ctx.scale(astronaut.scale, astronaut.scale);

            // Wavy Space Tether
            ctx.beginPath();
            ctx.moveTo(-15, 10);
            const waveY = Math.sin(astronaut.tetherPhase) * 16;
            ctx.quadraticCurveTo(-50, 30 + waveY, -110, 60);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 2.2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Backpack
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.roundRect(-22, -18, 12, 32, 4);
            ctx.fill();

            // Suit Body
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.roundRect(-12, -16, 24, 30, 8);
            ctx.fill();

            // Suit Badges
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-6, -8, 5, 4);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(1, -8, 5, 4);

            // Helmet
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -20, 14, 0, Math.PI * 2);
            ctx.fill();

            // Visor
            const visorGrad = ctx.createLinearGradient(-8, -26, 8, -14);
            visorGrad.addColorStop(0, '#f59e0b');
            visorGrad.addColorStop(0.5, '#fbbf24');
            visorGrad.addColorStop(1, '#78350f');

            ctx.fillStyle = visorGrad;
            ctx.beginPath();
            ctx.arc(2, -20, 9, 0, Math.PI * 2);
            ctx.fill();

            // Visor Shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();
            ctx.arc(-1, -23, 3, 0, Math.PI * 2);
            ctx.fill();

            // Arms & Legs
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            // Waving arm
            ctx.beginPath();
            ctx.moveTo(-10, -8);
            ctx.lineTo(-20, -18);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(10, -8);
            ctx.lineTo(18, -2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(-12, 26);
            ctx.moveTo(6, 12);
            ctx.lineTo(10, 28);
            ctx.stroke();

            ctx.restore();
        }

        // 4. DRAW DETAILED SUN WITH SOLAR FLARES, CORONA & FACIAL FEATURES
        function drawSun() {
            ctx.save();
            ctx.translate(sun.x, sun.y);

            const dynamicPulse = Math.sin(sun.pulsePhase) * 3;

            // Rotating Solar Flare Rays
            ctx.save();
            ctx.rotate(sun.rotationAngle);
            const rayCount = 14;
            const outerRayLen = sun.radius + 24 + dynamicPulse;

            for (let i = 0; i < rayCount; i++) {
                const angle = (i * Math.PI * 2) / rayCount;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle - 0.12) * sun.radius, Math.sin(angle - 0.12) * sun.radius);
                ctx.lineTo(Math.cos(angle) * outerRayLen, Math.sin(angle) * outerRayLen);
                ctx.lineTo(Math.cos(angle + 0.12) * sun.radius, Math.sin(angle + 0.12) * sun.radius);
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(255, 230, 0, 0.6)' : 'rgba(255, 94, 0, 0.6)';
                ctx.fill();
            }
            ctx.restore();

            // Outer Radial Corona Glow
            const coronaGrad = ctx.createRadialGradient(0, 0, sun.radius * 0.7, 0, 0, sun.radius * 2.8 + dynamicPulse);
            coronaGrad.addColorStop(0, 'rgba(255, 230, 0, 0.85)');
            coronaGrad.addColorStop(0.4, 'rgba(255, 94, 0, 0.45)');
            coronaGrad.addColorStop(0.8, 'rgba(255, 0, 128, 0.18)');
            coronaGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.fillStyle = coronaGrad;
            ctx.beginPath();
            ctx.arc(0, 0, sun.radius * 2.8 + dynamicPulse, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core Body
            const coreGrad = ctx.createRadialGradient(-10, -10, 4, 0, 0, sun.radius);
            coreGrad.addColorStop(0, '#ffffff');
            coreGrad.addColorStop(0.2, '#fff176');
            coreGrad.addColorStop(0.6, '#f57c00');
            coreGrad.addColorStop(1, '#d84315');

            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, sun.radius, 0, Math.PI * 2);
            ctx.fill();

            // Friendly Sun Face (1st-Grade Kid Friendly)
            // Eyes
            ctx.fillStyle = '#3e2723';
            ctx.beginPath();
            ctx.arc(-12, -7, 4.5, 0, Math.PI * 2);
            ctx.arc(12, -7, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye Glints
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-13, -9, 1.6, 0, Math.PI * 2);
            ctx.arc(11, -9, 1.6, 0, Math.PI * 2);
            ctx.fill();

            // Cheeks
            ctx.fillStyle = 'rgba(255, 64, 129, 0.5)';
            ctx.beginPath();
            ctx.arc(-16, 2, 5, 0, Math.PI * 2);
            ctx.arc(16, 2, 5, 0, Math.PI * 2);
            ctx.fill();

            // Smile
            ctx.beginPath();
            ctx.arc(0, 2, 10, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 2.8;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.restore();

            // Render Solar Plasma Particles
            for (const p of solarParticles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Render Explosion Sparks when rockets crash
            for (const sp of explosionSparks) {
                ctx.save();
                ctx.globalAlpha = sp.life;
                ctx.fillStyle = sp.color;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 5. DRAW ROCKETS & NEON EXHAUST TRAILS
        function drawSpaceships() {
            for (const s of spaceships) {
                // Draw Rainbow Light Trail
                if (s.trail.length > 1) {
                    for (let t = 0; t < s.trail.length - 1; t++) {
                        const p1 = s.trail[t];
                        const p2 = s.trail[t + 1];
                        const progress = t / s.trail.length;

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = s.color;
                        ctx.globalAlpha = progress * 0.8;
                        ctx.lineWidth = (progress * s.radius) + 1.0;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                // Draw Rocket Body Pointing along Velocity Vector
                ctx.save();
                ctx.translate(s.x, s.y);

                const angle = Math.atan2(s.vy, s.vx) + Math.PI / 2;
                ctx.rotate(angle);

                // Flickering Engine Flame
                const flameLen = 8 + Math.random() * 9;
                const flameGrad = ctx.createLinearGradient(0, 6, 0, 6 + flameLen);
                flameGrad.addColorStop(0, '#ffe600');
                flameGrad.addColorStop(0.5, '#ff5e00');
                flameGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');

                ctx.fillStyle = flameGrad;
                ctx.beginPath();
                ctx.moveTo(-3.5, 6);
                ctx.lineTo(0, 6 + flameLen);
                ctx.lineTo(3.5, 6);
                ctx.closePath();
                ctx.fill();

                // Rocket Hull
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.moveTo(0, -13);
                ctx.quadraticCurveTo(8, -2, 6, 8);
                ctx.lineTo(-6, 8);
                ctx.quadraticCurveTo(-8, -2, 0, -13);
                ctx.closePath();
                ctx.fill();

                // Cockpit Visor Bubble
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(0, -2, 3.4, 0, Math.PI * 2);
                ctx.fill();

                // Cockpit Highlight
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-1, -3, 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Fins
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-6, 2);
                ctx.lineTo(-10, 8);
                ctx.lineTo(-5, 8);
                ctx.closePath();
                ctx.moveTo(6, 2);
                ctx.lineTo(10, 8);
                ctx.lineTo(5, 8);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // MAIN RENDER LOOP
        function draw() {
            // Cosmic Deep Blue Gradient
            const bgGrad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 60,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
            );
            bgGrad.addColorStop(0, '#0d0428');
            bgGrad.addColorStop(0.65, '#050212');
            bgGrad.addColorStop(1, '#020008');

            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Layers
            drawStars();
            drawMoon();
            drawAstronaut();
            drawSun();
            drawSpaceships();
        }

        // MAIN ANIMATION TICK
        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        // INITIALIZE ON LOAD
        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
